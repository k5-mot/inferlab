services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.10.2
    container_name: ${STACK_NAME:-inferlab}-open-webui
    restart: unless-stopped
    profiles:
      - webui
    environment:
      ### General
      WEBUI_URL: http://${PUBLIC_HOST}:31100
      WEBUI_SECRET_KEY: sk-open-webui-secret-key
      ENABLE_NOTES: "true"
      ENABLE_AUTOMATIONS: "true"
      ENABLE_CALENDAR: "true"
      ENABLE_CHANNELS: "true"
      ENABLE_API_KEYS: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: "/api/models,/api/v1/chats,/api/v1/chats/all/db,/api/v1/messages,/api/v1/channels,/api/v1/chat/completions,/api/v1/knowledge"
      ### For Keycloak
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: "user"
      OAUTH_CLIENT_ID: "open-webui"
      OAUTH_CLIENT_SECRET: "open-webui-oauth-client-secret-key"
      OPENID_PROVIDER_URL: http://${PUBLIC_HOST}:30001/realms/${STACK_NAME:-inferlab}/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://${PUBLIC_HOST}:31100/oauth/oidc/callback
      OAUTH_SCOPES: openid
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_PROVIDER_NAME: Keycloak
      ### For LLM on LiteLLM
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1;http://hermes-agent:8642/v1"
      OPENAI_API_KEYS: "${LITELLM_MASTER_KEY:-sk-litellm-master-key};hermes-agent-secret-key"
      DEFAULT_MODELS: "deepseek/deepseek-v4-flash:cloud"
      ### For Embedding model on LiteLLM
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: "cl-nagoya/ruri-v3:310m"
      RAG_OPENAI_API_BASE_URL: http://litellm:4000
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      RAG_EMBEDDING_BATCH_SIZE: "4"
      RAG_EMBEDDING_CONCURRENT_REQUESTS: "2"
      RAG_TEXT_SPLITTER: token
      CHUNK_SIZE: 1500
      CHUNK_OVERLAP: 150
      ### For Reranking model on LiteLLM
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_ENGINE: "external"
      RAG_EXTERNAL_RERANKER_URL: "http://litellm:4000"
      RAG_EXTERNAL_RERANKER_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      RAG_RERANKING_MODEL: "cl-nagoya/ruri-v3-reranker:310m"
      RAG_TOP_K: 12
      RAG_TOP_K_RERANKER: 6
      ### For Docling (Content Extraction)
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_API_KEY: "sk-docling-serve-api-key"
      # DOCLING_PARAMS: >-
      #   {
      #     "do_ocr": true,
      #     "force_ocr": false,
      #     "ocr_engine": "tesseract_cli",
      #     "ocr_preset": "tesseract",
      #     "ocr_lang": ["jpn", "jpn_vert", "eng"]
      #   }
      # "picture_description_custom_config": "{\"picture_area_threshold\": 0.01, \"batch_size\": 1, \"scale\": 2.0, \"engine_options\": {\"engine_type\": \"api\", \"url\": \"http://litellm:4000/v1/chat/completions\", \"headers\": {\"Authorization\": \"Bearer sk-litellm-master-key\"}, \"params\": {\"model\": \"gemma4:31b\", \"temperature\": 0.0, \"max_tokens\": 1024}, \"timeout\": 90, \"concurrency\": 1}, \"model_spec\": {\"name\": \"gemma4:31b\", \"default_repo_id\": \"gemma4:31b\", \"prompt\": \"この画像を日本語でRAG用に説明してください。画像内の文字、図表、UI、構造、位置関係、重要な数値・ラベルを具体的に記述してください。推測は避け、不明な点は不明と書いてください。\", \"response_format\": \"plaintext\", \"api_overrides\": {\"api\": {\"params\": {\"model\": \"gemma4:31b\", \"temperature\": 0.0, \"max_tokens\": 1024}}}}, \"prompt\": \"この画像を日本語でRAG用に説明してください。画像内の文字、図表、UI、構造、位置関係、重要な数値・ラベルを具体的に記述してください。推測は避け、不明な点は不明と書いてください。\", \"generation_config\": {\"temperature\": 0.0, \"max_tokens\": 1024}}"
      # DOCLING_PARAMS: >-
      #   {
      #     "do_ocr": true,
      #     "force_ocr": false,
      #     "ocr_preset": "auto",
      #     "ocr_custom_config": {
      #       "kind": "tesseract",
      #       "lang": ["jpn", "jpn_vert", "eng"],
      #       "force_full_page_ocr": false,
      #       "bitmap_area_threshold": 0.30
      #     },
      #     "do_picture_description": true,
      #     "generate_picture_images": true,
      #     "picture_description_preset": "litellm"
      #   }
      ### For Qdrant (Vector DB)
      VECTOR_DB: qdrant
      QDRANT_API_KEY: "sk-qdrant-api-key"
      QDRANT_URI: http://qdrant:6333
      ### For SearXNG (Web Search)
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      ### For Edge-TTS (Text-to-Speech)
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://voicevox-openai-tts:8000/v1
      AUDIO_TTS_OPENAI_API_KEY: "EMPTY"
      AUDIO_TTS_MODEL: "voicevox-v1"
      AUDIO_TTS_VOICE: "3"
    entrypoint:
      - bash
      - -c
      - export DOCLING_PARAMS="$(cat /run/config/docling_params.json)" && exec bash start.sh
    ports:
      - 31100:8080
    volumes:
      - open-webui-data:/app/backend/data
      - ./docling/params.json:/run/config/docling_params.json:ro
    networks:
      - internal-nw
    depends_on:
      docling:
        condition: service_started
      searxng:
        condition: service_started
      voicevox-openai-tts:
        condition: service_started
      qdrant:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - homepage.group=11-webui
      - homepage.name=Open-WebUI
      - homepage.icon=open-webui.png
      - homepage.href=http://${PUBLIC_HOST}:31100
      - homepage.description=AI_Chat

  docling:
    # image: quay.io/docling-project/docling-serve:v1.18.0
    image: ghcr.io/k5-mot/docling-serve-jp:v1.26.0
    container_name: ${STACK_NAME:-inferlab}-docling
    restart: unless-stopped
    profiles:
      - webui
    environment:
      DOCLING_SERVE_HOST: 0.0.0.0
      DOCLING_SERVE_PORT: 5001
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_API_KEY: "sk-docling-serve-api-key"
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: 36000
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: 1
      DOCLING_SERVE_QUEUE_MAX_SIZE: 1
      OMP_NUM_THREADS: 2
    ports:
      - 31101:5001
    volumes:
      - docling-data:/data
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:5001/readyz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: ${DOCLING_MEM_LIMIT:-8g}
    memswap_limit: ${DOCLING_MEMSWAP_LIMIT:-9g}
    pids_limit: 512
    labels:
      - homepage.group=11-webui
      - homepage.name=docling-serve
      - homepage.icon=docling.png
      - homepage.href=http://${PUBLIC_HOST}:31101/ui
      - homepage.description=Document_Converter

  searxng:
    image: docker.io/searxng/searxng:2026.7.3-80c9806de
    container_name: ${STACK_NAME:-inferlab}-searxng
    restart: unless-stopped
    profiles:
      - webui
    ports:
      - 31102:8080
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8080/healthz', headers={'Authorization':'Bearer sk-searxng-secret-key'}); print(urllib.request.urlopen(req).read().decode())\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - homepage.group=11-webui
      - homepage.name=SearXNG
      - homepage.icon=searxng.png
      - homepage.href=http://${PUBLIC_HOST}:31102
      - homepage.description=Search_engine

  voicevox_engine:
    image: docker.io/voicevox/voicevox_engine:cpu-0.25.2
    container_name: ${STACK_NAME:-inferlab}-voicevox_engine
    restart: unless-stopped
    profiles:
      - webui
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:50021/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=11-webui
      - homepage.name=VOICEVOX-Engine
      - homepage.icon=mdi-account-voice
      - homepage.description=Text_to_Speech_Engine

  voicevox-openai-tts:
    image: ghcr.io/sunwood-ai-labs/voicevox-openai-tts:0.2.0
    container_name: ${STACK_NAME:-inferlab}-voicevox-openai-tts
    restart: unless-stopped
    profiles:
      - webui
    environment:
      - VOICEVOX_ENGINE_URL=http://voicevox_engine:50021
    networks:
      - internal-nw
    depends_on:
      voicevox_engine:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=11-webui
      - homepage.name=VOICEVOX-API
      - homepage.icon=mdi-account-voice
      - homepage.description=Text_to_Speech_API

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.2
    container_name: ${STACK_NAME:-inferlab}-qdrant
    restart: unless-stopped
    profiles:
      - webui
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
      - ./qdrant/config.yaml:/qdrant/config/production.yaml
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - homepage.group=11-webui
      - homepage.name=Qdrant
      - homepage.icon=qdrant.png
      - homepage.description=Vector_DB

volumes:
  open-webui-data:
  docling-data:
  qdrant-storage:
  qdrant-snapshots:

networks:
  internal-nw:
