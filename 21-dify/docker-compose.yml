x-external-dns-stabilizer: &external-dns-stabilizer
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_search:
    - .
  dns_opt:
    - "timeout:1"
    - "attempts:2"
    - "ndots:1"

services:
  dify-init-permissions:
    image: docker.io/library/busybox:1.38.0
    container_name: ${STACK_NAME:-inferlab}-dify-init-permissions
    restart: "no"
    profiles:
      - dify
    command:
      - sh
      - /usr/local/bin/ensure-storage-permissions
    volumes:
      - dify-storage:/app/api/storage
      - ./init/ensure-storage-permissions.sh:/usr/local/bin/ensure-storage-permissions:ro
    networks:
      - internal-nw

  dify-api:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-api
    restart: unless-stopped
    profiles:
      - dify
    environment: &dify-api-env
      MODE: api
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      SECRET_KEY: sk-dify-secret-key
      INIT_PASSWORD: admin
      MIGRATION_ENABLED: "true"
      CONSOLE_WEB_URL: http://${PUBLIC_HOST}:32100
      CONSOLE_API_URL: http://${PUBLIC_HOST}:32100
      SERVICE_API_URL: http://${PUBLIC_HOST}:32100
      APP_WEB_URL: http://${PUBLIC_HOST}:32100
      APP_API_URL: http://${PUBLIC_HOST}:32100
      FILES_URL: http://${PUBLIC_HOST}:32100
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      DB_TYPE: postgresql
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: dify_user
      DB_PASSWORD: dify_password
      DB_DATABASE: dify_db
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dify_redis_password
      CELERY_BROKER_URL: redis://:dify_redis_password@dify-redis:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: qdrant
      QDRANT_URL: http://dify-qdrant:6333
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox-key
      CODE_EXECUTION_SSL_VERIFY: "true"
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: sk-dify-plugin-daemon-key
      PLUGIN_DIFY_INNER_API_KEY: sk-dify-plugin-inner-api-key
      INNER_API_KEY_FOR_PLUGIN: sk-dify-plugin-inner-api-key
      AGENT_BACKEND_BASE_URL: http://dify-agent-backend:5050
      MARKETPLACE_ENABLED: "false"
      MARKETPLACE_API_URL: "https://marketplace.dify.ai"
      MARKETPLACE_URL: "https://marketplace.dify.ai"
      CREATORS_PLATFORM_FEATURES_ENABLED: "false"
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-qdrant:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-agent-backend:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-API
      - homepage.description=AI workflow platform

  dify-worker:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-worker
    restart: unless-stopped
    profiles:
      - dify
    environment:
      <<: *dify-api-env
      MODE: worker
      MARKETPLACE_ENABLED: "false"
      MARKETPLACE_API_URL: "https://marketplace.dify.ai"
      MARKETPLACE_URL: "https://marketplace.dify.ai"
      CREATORS_PLATFORM_FEATURES_ENABLED: "false"
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-qdrant:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-agent-backend:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A celery_healthcheck.celery inspect ping
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Worker
      - homepage.description=AI workflow platform

  dify-worker-beat:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-worker-beat
    restart: unless-stopped
    profiles:
      - dify
    environment:
      <<: *dify-api-env
      MODE: beat
      MARKETPLACE_ENABLED: "false"
      MARKETPLACE_API_URL: "https://marketplace.dify.ai"
      MARKETPLACE_URL: "https://marketplace.dify.ai"
      CREATORS_PLATFORM_FEATURES_ENABLED: "false"
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys; cmd = open('/proc/1/cmdline', 'rb').read().replace(b'\0', b' '); sys.exit(0 if b'celery' in cmd and b'beat' in cmd else 1)"
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Worker-Beat
      - homepage.description=AI workflow platform

  dify-web:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-web:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-web
    restart: unless-stopped
    profiles:
      - dify
    environment:
      CONSOLE_API_URL: http://${PUBLIC_HOST}:32100
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      APP_API_URL: http://${PUBLIC_HOST}:32100
      NEXT_PUBLIC_SOCKET_URL: ws://${PUBLIC_HOST}:32100
      MARKETPLACE_API_URL: "https://marketplace.dify.ai"
      MARKETPLACE_URL: "https://marketplace.dify.ai"
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('net'); const s=net.connect(3000, require('os').hostname()); s.setTimeout(3000); s.on('connect',()=>{s.destroy(); process.exit(0)}); s.on('timeout',()=>{s.destroy(); process.exit(1)}); s.on('error',()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Web
      - homepage.description=AI workflow platform

  dify-plugin-daemon:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-plugin-daemon:0.6.8-local
    container_name: ${STACK_NAME:-inferlab}-dify-plugin-daemon
    restart: unless-stopped
    profiles:
      - dify
    environment:
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: dify_user
      DB_PASSWORD: dify_password
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dify_redis_password
      SERVER_PORT: 5002
      SERVER_KEY: sk-dify-plugin-daemon-key
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: sk-dify-plugin-inner-api-key
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      FORCE_VERIFYING_SIGNATURE: "true"
      MARKETPLACE_ENABLED: "false"
    volumes:
      - dify-plugin-daemon:/app/storage
    networks:
      - internal-nw
    depends_on:
      dify-postgres-init:
        condition: service_completed_successfully
      dify-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:5002/health/check >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Plugin
      - homepage.description=AI workflow platform

  dify-sandbox:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-sandbox:0.2.15
    container_name: ${STACK_NAME:-inferlab}-dify-sandbox
    restart: unless-stopped
    profiles:
      - dify
    environment:
      API_KEY: dify-sandbox-key
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://dify-ssrf-proxy:3128
      HTTPS_PROXY: http://dify-ssrf-proxy:3128
      SANDBOX_PORT: 8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    networks:
      - internal-nw
    depends_on:
      dify-ssrf-proxy:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8194/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Sandbox
      - homepage.description=AI workflow platform

  dify-local-sandbox:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-agent-local-sandbox:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-local-sandbox
    restart: unless-stopped
    profiles:
      - dify
    environment:
      SHELLCTL_AUTH_TOKEN: sk-dify-agent-shellctl-token
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Local-Sandbox
      - homepage.description=AI workflow platform

  dify-agent-backend:
    <<: *external-dns-stabilizer
    image: docker.io/langgenius/dify-agent-backend:1.16.1
    container_name: ${STACK_NAME:-inferlab}-dify-agent-backend
    restart: unless-stopped
    profiles:
      - dify
    environment:
      DIFY_AGENT_REDIS_URL: redis://:dify_redis_password@dify-redis:6379/2
      DIFY_AGENT_REDIS_PREFIX: dify-agent
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: sk-dify-plugin-daemon-key
      DIFY_AGENT_INNER_API_URL: http://dify-api:5001
      DIFY_AGENT_INNER_API_KEY: sk-dify-plugin-inner-api-key
      DIFY_AGENT_SHELLCTL_ENTRYPOINT: http://dify-local-sandbox:5004
      DIFY_AGENT_SHELLCTL_AUTH_TOKEN: sk-dify-agent-shellctl-token
      DIFY_AGENT_STUB_API_BASE_URL: http://dify-agent-backend:5050/agent-stub
      DIFY_AGENT_SERVER_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      DIFY_AGENT_SHUTDOWN_GRACE_SECONDS: 30
      DIFY_AGENT_RUN_RETENTION_SECONDS: 259200
    networks:
      - internal-nw
    depends_on:
      dify-redis:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-local-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s = socket.create_connection(('127.0.0.1', 5050), timeout=3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Agent-Backend
      - homepage.description=AI workflow platform

  dify-ssrf-proxy:
    <<: *external-dns-stabilizer
    image: docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: ${STACK_NAME:-inferlab}-dify-ssrf-proxy
    restart: unless-stopped
    profiles:
      - dify
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - squid -k check >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/squidex.png
      - homepage.group=21-dify
      - homepage.name=Dify-SSRF-Proxy
      - homepage.description=Forward proxy

  dify-postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-postgres
    restart: unless-stopped
    profiles:
      - dify
    environment:
      POSTGRES_USER: dify_user
      POSTGRES_PASSWORD: dify_password
      POSTGRES_DB: dify_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dify_user -d dify_db
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.icon=/icons/postgresql.png
      - homepage.group=21-dify
      - homepage.name=Dify-Postgres
      - homepage.description=Relational database

  dify-postgres-init:
    image: docker.io/library/postgres:15-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-postgres-init
    restart: "no"
    profiles:
      - dify
    environment:
      PGPASSWORD: dify_password
    command:
      - sh
      - /usr/local/bin/ensure-plugin-database
    volumes:
      - ./init/ensure-plugin-database.sh:/usr/local/bin/ensure-plugin-database:ro
    networks:
      - internal-nw
    depends_on:
      dify-postgres:
        condition: service_healthy

  dify-redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-redis
    restart: unless-stopped
    profiles:
      - dify
    command:
      - redis-server
      - --requirepass
      - dify_redis_password
    environment:
      REDISCLI_AUTH: dify_redis_password
    volumes:
      - dify-redis-data:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      - homepage.icon=/icons/redis.png
      - homepage.group=21-dify
      - homepage.name=Dify-Redis
      - homepage.description=Inmemory key-value NoSQL database

  dify-qdrant:
    <<: *external-dns-stabilizer
    image: docker.io/qdrant/qdrant:v1.18.3
    container_name: ${STACK_NAME:-inferlab}-dify-qdrant
    restart: unless-stopped
    profiles:
      - dify
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - dify-qdrant-storage:/qdrant/storage
      - dify-qdrant-snapshots:/qdrant/snapshots
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200' <&3"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - homepage.icon=/icons/qdrant.png
      - homepage.group=21-dify
      - homepage.name=Dify-Qdrant
      - homepage.description=Vector search database

  dify-nginx:
    image: docker.io/library/nginx:1.31.3-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-nginx
    restart: unless-stopped
    profiles:
      - dify
    volumes:
      - ./dify/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 32100:80
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
      dify-web:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify
      - homepage.href=http://${PUBLIC_HOST}:32100
      - homepage.description=AI workflow platform

volumes:
  dify-storage:
  dify-plugin-daemon:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-postgres-data:
  dify-redis-data:
  dify-qdrant-storage:
  dify-qdrant-snapshots:

networks:
  internal-nw:
