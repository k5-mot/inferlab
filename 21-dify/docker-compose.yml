services:
  dify-api:
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME}-dify-api
    restart: unless-stopped
    profiles:
      - dify
    environment: &dify-api-env
      MODE: api
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-dify-secret-key}
      INIT_PASSWORD: ${DIFY_INIT_PASSWORD:?DIFY_INIT_PASSWORD is required}
      MIGRATION_ENABLED: "true"
      CHECK_UPDATE_URL: ""
      OPENAI_API_BASE: http://litellm:4000/v1
      API_SENTRY_DSN: ""
      AMPLITUDE_API_KEY: ""
      DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "true"
      TELEMETRY_ENDPOINT: ""
      TELEMETRY_FALLBACK_ENDPOINT: ""
      ENABLE_WEBSITE_JINAREADER: "false"
      ENABLE_WEBSITE_FIRECRAWL: "false"
      ENABLE_WEBSITE_WATERCRAWL: "false"
      HOSTED_FETCH_APP_TEMPLATES_MODE: builtin
      HOSTED_FETCH_APP_TEMPLATES_REMOTE_DOMAIN: http://dify-nginx
      HOSTED_FETCH_PIPELINE_TEMPLATES_MODE: builtin
      HOSTED_FETCH_PIPELINE_TEMPLATES_REMOTE_DOMAIN: http://dify-nginx
      ENABLE_CHECK_UPGRADABLE_PLUGIN_TASK: "false"
      CONSOLE_WEB_URL: http://${PUBLIC_HOST}:32100
      CONSOLE_API_URL: http://${PUBLIC_HOST}:32100
      SERVICE_API_URL: http://${PUBLIC_HOST}:32100
      APP_WEB_URL: http://${PUBLIC_HOST}:32100
      APP_API_URL: http://${PUBLIC_HOST}:32100
      FILES_URL: http://${PUBLIC_HOST}:32100
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      DB_TYPE: postgresql
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: ${DIFY_DB_USER:-dify_user}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify_password}
      DB_DATABASE: dify_db
      REDIS_HOST: dify-valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: dify_redis_password
      CELERY_BROKER_URL: redis://:dify_redis_password@dify-valkey:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://${PUBLIC_HOST}:32102
      S3_REGION: us-east-1
      S3_BUCKET_NAME: dify-bucket
      S3_ACCESS_KEY: ${DIFY_RUSTFS_ACCESS_KEY:-dify_rustfs_key}
      S3_SECRET_KEY: ${DIFY_RUSTFS_SECRET_KEY:-dify_rustfs_secret}
      S3_ADDRESS_STYLE: path
      S3_USE_AWS_MANAGED_IAM: "false"
      VECTOR_STORE: qdrant
      QDRANT_URL: http://dify-qdrant:6333
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox-key}
      CODE_EXECUTION_SSL_VERIFY: "true"
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-sk-dify-plugin-daemon-key}
      PLUGIN_DIFY_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY:-sk-dify-plugin-inner-api-key}
      INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY:-sk-dify-plugin-inner-api-key}
      AGENT_BACKEND_BASE_URL: http://dify-agent-backend:5050
      MARKETPLACE_ENABLED: "false"
      MARKETPLACE_API_URL: http://dify-nginx
      MARKETPLACE_URL: http://dify-nginx
      CREATORS_PLATFORM_FEATURES_ENABLED: "false"
      CREATORS_PLATFORM_API_URL: http://dify-nginx
    networks:
      - internal-nw
    depends_on:
      dify-rustfs-bucket-init:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-valkey:
        condition: service_healthy
      dify-qdrant:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-agent-backend:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-API
      - homepage.description=AI workflow platform

  dify-worker:
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME}-dify-worker
    restart: unless-stopped
    profiles:
      - dify
    environment:
      <<: *dify-api-env
      MODE: worker
    networks:
      - internal-nw
    depends_on:
      dify-rustfs-bucket-init:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-valkey:
        condition: service_healthy
      dify-qdrant:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-agent-backend:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A celery_healthcheck.celery inspect ping
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Worker
      - homepage.description=AI workflow platform

  dify-worker-beat:
    image: docker.io/langgenius/dify-api:1.16.1
    container_name: ${STACK_NAME}-dify-worker-beat
    restart: unless-stopped
    profiles:
      - dify
    environment:
      <<: *dify-api-env
      MODE: beat
    networks:
      - internal-nw
    depends_on:
      dify-rustfs-bucket-init:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys; cmd = open('/proc/1/cmdline', 'rb').read().replace(b'\0', b' '); sys.exit(0 if b'celery' in cmd and b'beat' in cmd else 1)"
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Worker-Beat
      - homepage.description=AI workflow platform

  dify-web:
    image: docker.io/langgenius/dify-web:1.16.1
    container_name: ${STACK_NAME}-dify-web
    restart: unless-stopped
    profiles:
      - dify
    environment:
      CONSOLE_API_URL: http://${PUBLIC_HOST}:32100
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      APP_API_URL: http://${PUBLIC_HOST}:32100
      NEXT_PUBLIC_SOCKET_URL: ws://${PUBLIC_HOST}:32100
      MARKETPLACE_API_URL: http://dify-nginx
      MARKETPLACE_URL: http://dify-nginx
      WEB_SENTRY_DSN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('net'); const s=net.connect(3000, require('os').hostname()); s.setTimeout(3000); s.on('connect',()=>{s.destroy(); process.exit(0)}); s.on('timeout',()=>{s.destroy(); process.exit(1)}); s.on('error',()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Web
      - homepage.description=AI workflow platform

  dify-plugin-daemon:
    image: docker.io/langgenius/dify-plugin-daemon:0.6.8-local
    container_name: ${STACK_NAME}-dify-plugin-daemon
    restart: unless-stopped
    profiles:
      - dify
    environment:
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: ${DIFY_DB_USER:-dify_user}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify_password}
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: dify-valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: dify_redis_password
      SERVER_PORT: 5002
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-sk-dify-plugin-daemon-key}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY:-sk-dify-plugin-inner-api-key}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_TYPE: aws_s3
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_STORAGE_OSS_BUCKET: dify-bucket
      S3_USE_AWS_MANAGED_IAM: "false"
      S3_USE_AWS: "false"
      S3_ENDPOINT: http://dify-rustfs:9000
      S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY: ${DIFY_RUSTFS_ACCESS_KEY:-dify_rustfs_key}
      AWS_SECRET_KEY: ${DIFY_RUSTFS_SECRET_KEY:-dify_rustfs_secret}
      AWS_REGION: us-east-1
      FORCE_VERIFYING_SIGNATURE: "true"
      MARKETPLACE_ENABLED: "false"
      MARKETPLACE_API_URL: http://dify-nginx
      PIP_MIRROR_AUTO_DETECT: "false"
      PIP_MIRROR_URL: http://pypiserver:8080/simple/
      PIP_TRUSTED_HOST: pypiserver
      UV_INSECURE_HOST: pypiserver
      PLUGIN_IGNORE_UV_LOCK: "true"
      ENABLE_OTEL: "false"
    volumes:
      - dify-plugin-daemon:/app/storage
    networks:
      - internal-nw
    depends_on:
      dify-postgres-init:
        condition: service_completed_successfully
      dify-rustfs-bucket-init:
        condition: service_completed_successfully
      dify-valkey:
        condition: service_healthy
      pypiserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:5002/health/check >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Plugin
      - homepage.description=AI workflow platform

  dify-sandbox:
    image: docker.io/langgenius/dify-sandbox:0.2.15
    container_name: ${STACK_NAME}-dify-sandbox
    restart: unless-stopped
    profiles:
      - dify
    environment:
      API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox-key}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "false"
      SANDBOX_PORT: 8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8194/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Sandbox
      - homepage.description=AI workflow platform

  dify-local-sandbox:
    image: docker.io/langgenius/dify-agent-local-sandbox:1.16.1
    container_name: ${STACK_NAME}-dify-local-sandbox
    restart: unless-stopped
    profiles:
      - dify
    environment:
      SHELLCTL_AUTH_TOKEN: ${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-sk-dify-agent-shellctl-token}
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Local-Sandbox
      - homepage.description=AI workflow platform

  dify-agent-backend:
    image: docker.io/langgenius/dify-agent-backend:1.16.1
    container_name: ${STACK_NAME}-dify-agent-backend
    restart: unless-stopped
    profiles:
      - dify
    environment:
      DIFY_AGENT_REDIS_URL: redis://:dify_redis_password@dify-valkey:6379/2
      DIFY_AGENT_REDIS_PREFIX: dify-agent
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-sk-dify-plugin-daemon-key}
      DIFY_AGENT_INNER_API_URL: http://dify-api:5001
      DIFY_AGENT_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY:-sk-dify-plugin-inner-api-key}
      DIFY_AGENT_SHELLCTL_ENTRYPOINT: http://dify-local-sandbox:5004
      DIFY_AGENT_SHELLCTL_AUTH_TOKEN: ${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-sk-dify-agent-shellctl-token}
      DIFY_AGENT_STUB_API_BASE_URL: http://dify-agent-backend:5050/agent-stub
      DIFY_AGENT_SERVER_SECRET_KEY: ${DIFY_AGENT_SERVER_SECRET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY}
      DIFY_AGENT_SHUTDOWN_GRACE_SECONDS: 30
      DIFY_AGENT_RUN_RETENTION_SECONDS: 259200
    networks:
      - internal-nw
    depends_on:
      dify-valkey:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
      dify-local-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s = socket.create_connection(('127.0.0.1', 5050), timeout=3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify-Agent-Backend
      - homepage.description=AI workflow platform

  dify-postgres:
    image: docker.io/library/postgres:18.6-trixie
    container_name: ${STACK_NAME}-dify-postgres
    restart: unless-stopped
    profiles:
      - dify
    environment:
      POSTGRES_USER: ${DIFY_DB_USER:-dify_user}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD:-dify_password}
      POSTGRES_DB: dify_db
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - dify-postgres-18-data:/var/lib/postgresql
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d dify_db
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.icon=/icons/postgresql.png
      - homepage.group=21-dify
      - homepage.name=Dify-Postgres
      - homepage.description=Relational database

  dify-postgres-init:
    image: docker.io/library/postgres:18.6-trixie
    container_name: ${STACK_NAME}-dify-postgres-init
    restart: "no"
    profiles:
      - dify
    environment:
      DIFY_DB_USER: ${DIFY_DB_USER:-dify_user}
      PGPASSWORD: ${DIFY_DB_PASSWORD:-dify_password}
    command:
      - sh
      - -euc
      - |
        # plugin daemonは専用DB `dify_plugin` を要求するが、Dify本体のmigration対象外。
        # PostgreSQL起動後に存在確認して、未作成の場合だけ追加する。
        if psql -h dify-postgres -U "$${DIFY_DB_USER}" -d dify_db -tAc "SELECT 1 FROM pg_database WHERE datname = 'dify_plugin'" | grep -q '^1$'; then
          echo "dify_plugin database already exists."
          exit 0
        fi
        psql -h dify-postgres -U "$${DIFY_DB_USER}" -d dify_db -c "CREATE DATABASE dify_plugin OWNER \"$${DIFY_DB_USER}\";"
    networks:
      - internal-nw
    depends_on:
      dify-postgres:
        condition: service_healthy

  dify-rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-beta.12
    container_name: ${STACK_NAME}-dify-rustfs
    restart: unless-stopped
    profiles:
      - dify
    environment:
      RUSTFS_ACCESS_KEY: ${DIFY_RUSTFS_ACCESS_KEY:-dify_rustfs_key}
      RUSTFS_SECRET_KEY: ${DIFY_RUSTFS_SECRET_KEY:-dify_rustfs_secret}
    ports:
      - 32102:9000
      - 32103:9001
    volumes:
      - dify-rustfs-data:/data
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.icon=/icons/rustfs.png
      - homepage.group=21-dify
      - homepage.name=Dify-RustFS
      - homepage.href=http://${PUBLIC_HOST}:32103
      - homepage.description=S3-compatible object storage

  dify-rustfs-bucket-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.36.27
    container_name: ${STACK_NAME}-dify-rustfs-bucket-init
    restart: "no"
    profiles:
      - dify
    environment:
      AWS_ACCESS_KEY_ID: ${DIFY_RUSTFS_ACCESS_KEY:-dify_rustfs_key}
      AWS_SECRET_ACCESS_KEY: ${DIFY_RUSTFS_SECRET_KEY:-dify_rustfs_secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://dify-rustfs:9000
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      RUSTFS_DEFAULT_BUCKET: dify-bucket
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        # Dify起動時にbucketが必要なため、RustFSのhealth確認後に冪等作成する。
        if aws s3api head-bucket --bucket "$${RUSTFS_DEFAULT_BUCKET}"; then
          echo "Bucket already exists: $${RUSTFS_DEFAULT_BUCKET}"
        else
          echo "Creating bucket: $${RUSTFS_DEFAULT_BUCKET}"
          aws s3api create-bucket --bucket "$${RUSTFS_DEFAULT_BUCKET}"
        fi
    networks:
      - internal-nw
    depends_on:
      dify-rustfs:
        condition: service_healthy

  dify-valkey:
    image: docker.io/valkey/valkey:9.1.1-alpine3.24
    container_name: ${STACK_NAME}-dify-valkey
    restart: unless-stopped
    profiles:
      - dify
    command:
      - valkey-server
      - --requirepass
      - dify_redis_password
    environment:
      REDISCLI_AUTH: dify_redis_password
    volumes:
      - dify-valkey-data:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      - homepage.icon=/icons/valkey.png
      - homepage.group=21-dify
      - homepage.name=Dify-Valkey
      - homepage.description=Inmemory key-value NoSQL database

  dify-qdrant:
    image: docker.io/qdrant/qdrant:v1.19.0
    container_name: ${STACK_NAME}-dify-qdrant
    restart: unless-stopped
    profiles:
      - dify
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - dify-qdrant-storage:/qdrant/storage
      - dify-qdrant-snapshots:/qdrant/snapshots
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200' <&3"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - homepage.icon=/icons/qdrant.png
      - homepage.group=21-dify
      - homepage.name=Dify-Qdrant
      - homepage.description=Vector search database

  dify-nginx:
    image: docker.io/library/nginx:1.31.4-alpine
    container_name: ${STACK_NAME}-dify-nginx
    restart: unless-stopped
    profiles:
      - dify
    volumes:
      - ./dify/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 32100:80
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
      dify-web:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/dify.png
      - homepage.group=21-dify
      - homepage.name=Dify
      - homepage.href=http://${PUBLIC_HOST}:32100
      - homepage.description=AI workflow platform

volumes:
  dify-plugin-daemon:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-postgres-18-data:
  dify-rustfs-data:
  dify-valkey-data:
  dify-qdrant-storage:
  dify-qdrant-snapshots:

networks:
  internal-nw:
