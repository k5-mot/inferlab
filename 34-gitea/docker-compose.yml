#
# 参考資料:
# - Gitea
#   - https://docs.gitea.com/installation/install-with-docker
#   - https://docs.gitea.com/administration/config-cheat-sheet
#
services:
  gitea:
    image: docker.gitea.com/gitea:1.27.0
    container_name: ${STACK_NAME:-inferlab}-gitea
    restart: unless-stopped
    profiles:
      - gitea
    environment:
      USER_UID: ${GITEA_USER_UID:-1000}
      USER_GID: ${GITEA_USER_GID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea_password}
      GITEA__server__DOMAIN: ${PUBLIC_HOST}
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST}:${GITEA_HTTP_HOST_PORT:-33400}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: ${PUBLIC_HOST}
      GITEA__server__SSH_PORT: ${GITEA_SSH_HOST_PORT:-33422}
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-sk-gitea-secret-key-change-me}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:-sk-gitea-internal-token-change-me}
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-true}
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN_VIEW:-false}
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: ${GITEA_OAUTH2_ENABLE_AUTO_REGISTRATION:-true}
      GITEA__oauth2_client__USERNAME: ${GITEA_OAUTH2_USERNAME:-preferred_username}
      GITEA__oauth2_client__OPENID_CONNECT_SCOPES: ${GITEA_OAUTH2_OPENID_CONNECT_SCOPES:-email profile}
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__metrics__ENABLED: ${GITEA_METRICS_ENABLED:-true}
      GITEA__metrics__ENABLED_ISSUE_BY_LABEL: "false"
      GITEA__metrics__ENABLED_ISSUE_BY_REPOSITORY: "false"
    ports:
      - "${GITEA_HTTP_HOST_PORT:-33400}:3000"
      - "${GITEA_SSH_HOST_PORT:-33422}:22"
    volumes:
      - gitea_data:/data
    networks:
      - internal-nw
    depends_on:
      gitea-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - homepage.icon=/icons/gitea.png
      - homepage.group=34-gitea
      - homepage.name=Gitea
      - homepage.href=http://${PUBLIC_HOST}:${GITEA_HTTP_HOST_PORT:-33400}
      - homepage.description=Git hosting platform

  gitea-keycloak-init:
    image: docker.gitea.com/gitea:1.27.0
    container_name: ${STACK_NAME:-inferlab}-gitea-keycloak-init
    restart: "no"
    profiles:
      - gitea
    user: git
    command:
      - sh
      - -euc
      - |
        # GiteaのOAuth sourceは環境変数だけでは更新されないため、起動後にCLIで冪等同期する。
        auth_id="$$(gitea admin auth list --config /data/gitea/conf/app.ini | awk '$$2 == "keycloak" { print $$1; exit }')"
        if [ -n "$${auth_id}" ]; then
          gitea admin auth update-oauth \
            --config /data/gitea/conf/app.ini \
            --id "$${auth_id}" \
            --name keycloak \
            --provider openidConnect \
            --key gitea \
            --secret "$${GITEA_OIDC_CLIENT_SECRET}" \
            --auto-discover-url "$${GITEA_OIDC_DISCOVERY_URL}" \
            --scopes openid \
            --scopes email \
            --scopes profile \
            --group-claim-name groups
        else
          gitea admin auth add-oauth \
            --config /data/gitea/conf/app.ini \
            --name keycloak \
            --provider openidConnect \
            --key gitea \
            --secret "$${GITEA_OIDC_CLIENT_SECRET}" \
            --auto-discover-url "$${GITEA_OIDC_DISCOVERY_URL}" \
            --scopes openid \
            --scopes email \
            --scopes profile \
            --group-claim-name groups
        fi
    environment:
      GITEA_OIDC_CLIENT_SECRET: ${GITEA_OIDC_CLIENT_SECRET:-sk-gitea-oidc-client-secret-key}
      GITEA_OIDC_DISCOVERY_URL: http://${PUBLIC_HOST}:30001/realms/${STACK_NAME:-inferlab}/.well-known/openid-configuration
    volumes:
      - gitea_data:/data
    networks:
      - internal-nw
    depends_on:
      gitea:
        condition: service_healthy

  gitea-postgres:
    image: docker.io/library/postgres:18.4-trixie
    container_name: ${STACK_NAME:-inferlab}-gitea-postgres
    restart: unless-stopped
    profiles:
      - gitea
    environment:
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea_password}
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
    volumes:
      - gitea_postgres_data:/var/lib/postgresql
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
      - homepage.icon=/icons/postgresql.png
      - homepage.group=34-gitea
      - homepage.name=Gitea-Postgres
      - homepage.description=Relational database

volumes:
  gitea_data:
  gitea_postgres_data:

networks:
  internal-nw:
