services:
  wikijs:
    image: ghcr.io/requarks/wiki:2.5.314
    container_name: ${STACK_NAME}-wikijs
    restart: unless-stopped
    init: true
    profiles:
      - wikijs
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs-postgres
      DB_PORT: "5432"
      DB_USER: wikijs_db_user
      DB_PASS: ${WIKIJS_DB_PASSWORD:-wikijs_db_password}
      DB_NAME: wikijs
    ports:
      - "33100:3000"
    networks:
      - internal-nw
    depends_on:
      wikijs-postgres:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - homepage.group=31-wikijs
      - homepage.name=Wiki.js
      - homepage.href=http://${PUBLIC_HOST}:33100
      - homepage.description=Wiki platform
      - homepage.icon=/icons/wikijs.png

  wikijs-postgres:
    image: docker.io/library/postgres:17.11-alpine
    container_name: ${STACK_NAME}-wikijs-postgres
    restart: unless-stopped
    profiles:
      - wikijs
    environment:
      POSTGRES_DB: wikijs
      POSTGRES_USER: wikijs_db_user
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASSWORD:-wikijs_db_password}
    volumes:
      - wikijs-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-nw
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U wikijs_db_user -d wikijs
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.group=31-wikijs
      - homepage.name=Wiki.js-PostgreSQL
      - homepage.description=Relational database
      - homepage.icon=/icons/postgresql.png

volumes:
  wikijs-postgres-data:

networks:
  internal-nw:
