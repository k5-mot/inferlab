services:
  zulip:
    image: ghcr.io/zulip/zulip-server:12.1-0
    container_name: ${STACK_NAME:-inferlab}-zulip
    restart: unless-stopped
    profiles:
      - zulip
    mem_limit: ${ZULIP_MEM_LIMIT:-4g}
    memswap_limit: ${ZULIP_MEMSWAP_LIMIT:-4g}
    environment:
      CERTIFICATES: self-signed
      TZ: Asia/Tokyo
      SETTING_EXTERNAL_HOST: ${ZULIP_EXTERNAL_HOST:-${PUBLIC_HOST}:${ZULIP_HTTPS_HOST_PORT:-33300}}
      SETTING_TIME_ZONE: Asia/Tokyo
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMIN_EMAIL:-admin@example.com}
      SETTING_EMAIL_HOST: ${ZULIP_EMAIL_HOST:-}
      SETTING_EMAIL_HOST_USER: ${ZULIP_EMAIL_HOST_USER:-noreply@example.com}
      SETTING_EMAIL_PORT: ${ZULIP_EMAIL_PORT:-587}
      SETTING_EMAIL_USE_SSL: ${ZULIP_EMAIL_USE_SSL:-False}
      SETTING_EMAIL_USE_TLS: ${ZULIP_EMAIL_USE_TLS:-True}
      SETTING_REMOTE_POSTGRES_HOST: zulip-postgres
      SETTING_REMOTE_POSTGRES_PORT: "5432"
      CONFIG_postgresql__database_user: zulip
      CONFIG_postgresql__database_name: zulip
      CONFIG_http_proxy__allow_addresses: ${PUBLIC_HOST}
      CONFIG_application_server__uwsgi_processes: ${ZULIP_UWSGI_PROCESSES:-4}
      CONFIG_application_server__queue_workers_multiprocess: ${ZULIP_QUEUE_WORKERS_MULTIPROCESS:-false}
      SETTING_MEMCACHED_LOCATION: zulip-memcached:11211
      SETTING_RABBITMQ_HOST: zulip-rabbitmq
      SETTING_REDIS_HOST: zulip-redis
      SETTING_OPEN_REALM_CREATION: ${ZULIP_OPEN_REALM_CREATION:-True}
      SETTING_FAKE_EMAIL_DOMAIN: ${ZULIP_FAKE_EMAIL_DOMAIN:-zulip.local}
      ZULIP_DEFAULT_COLOR_SCHEME: ${ZULIP_DEFAULT_COLOR_SCHEME:-light}
      ZULIP_APPLY_DEFAULT_COLOR_SCHEME_TO_EXISTING_USERS: ${ZULIP_APPLY_DEFAULT_COLOR_SCHEME_TO_EXISTING_USERS:-True}
      ZULIP_FLUID_LAYOUT_WIDTH: ${ZULIP_FLUID_LAYOUT_WIDTH:-True}
      ZULIP_APPLY_FLUID_LAYOUT_WIDTH_TO_EXISTING_USERS: ${ZULIP_APPLY_FLUID_LAYOUT_WIDTH_TO_EXISTING_USERS:-True}
      ZULIP_AUTO_CREATE_REALM_ID: ${ZULIP_AUTO_CREATE_REALM_ID:-}
      ZULIP_AUTO_CREATE_REALM_NAME: ${ZULIP_AUTO_CREATE_REALM_NAME:-InferLab}
      ZULIP_AUTO_CREATE_ADMIN_EMAIL: ${ZULIP_AUTO_CREATE_ADMIN_EMAIL:-admin@example.com}
      ZULIP_AUTO_CREATE_ADMIN_NAME: ${ZULIP_AUTO_CREATE_ADMIN_NAME:-InferLab Admin}
      ZULIP_AUTO_CREATE_ADMIN_PASSWORD: ${ZULIP_AUTO_CREATE_ADMIN_PASSWORD:-}
      ZULIP_OIDC_ENABLED: ${ZULIP_OIDC_ENABLED:-True}
      ZULIP_OIDC_IDP_KEY: ${ZULIP_OIDC_IDP_KEY:-keycloak}
      ZULIP_OIDC_DISPLAY_NAME: ${ZULIP_OIDC_DISPLAY_NAME:-Keycloak}
      ZULIP_OIDC_DISPLAY_ICON: ${ZULIP_OIDC_DISPLAY_ICON:-}
      ZULIP_OIDC_URL: ${ZULIP_OIDC_URL:-https://${PUBLIC_HOST}:${KEYCLOAK_HTTPS_HOST_PORT:-30002}/realms/${STACK_NAME:-inferlab}}
      ZULIP_OIDC_CLIENT_ID: ${ZULIP_OIDC_CLIENT_ID:-zulip}
      ZULIP_OIDC_AUTO_SIGNUP: ${ZULIP_OIDC_AUTO_SIGNUP:-True}
      ZULIP_OIDC_FULL_NAME_VALIDATED: ${ZULIP_OIDC_FULL_NAME_VALIDATED:-True}
      SECRETS_email_password: ${ZULIP_EMAIL_PASSWORD:-123456789}
      SECRETS_rabbitmq_password: ${ZULIP_RABBITMQ_PASSWORD:-zulip_password}
      SECRETS_postgres_password: ${ZULIP_POSTGRES_PASSWORD:-zulip_password}
      SECRETS_memcached_password: ${ZULIP_MEMCACHED_PASSWORD:-zulip_password}
      SECRETS_redis_password: ${ZULIP_REDIS_PASSWORD:-zulip_password}
      SECRETS_secret_key: ${ZULIP_SECRET_KEY:-sk-zulip-secret-key}
      SECRETS_social_auth_oidc_secret: ${ZULIP_OIDC_CLIENT_SECRET:-sk-zulip-oidc-client-secret-key}
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      ZULIP_AUTH_BACKENDS: ${ZULIP_AUTH_BACKENDS:-EmailAuthBackend,GenericOpenIdConnectBackend}
      ZULIP_CUSTOM_SETTINGS: |
        import os

        _zulip_oidc_enabled = os.environ.get("ZULIP_OIDC_ENABLED", "True").lower() in {
            "1",
            "true",
            "yes",
            "on",
        }
        _zulip_oidc_auto_signup = os.environ.get("ZULIP_OIDC_AUTO_SIGNUP", "True").lower() in {
            "1",
            "true",
            "yes",
            "on",
        }
        SOCIAL_AUTH_OIDC_ENABLED_IDPS = {}
        if _zulip_oidc_enabled:
            SOCIAL_AUTH_OIDC_ENABLED_IDPS[os.environ.get("ZULIP_OIDC_IDP_KEY", "keycloak")] = {
                "oidc_url": os.environ.get("ZULIP_OIDC_URL"),
                "display_name": os.environ.get("ZULIP_OIDC_DISPLAY_NAME", "Keycloak"),
                "display_icon": os.environ.get("ZULIP_OIDC_DISPLAY_ICON") or None,
                "client_id": os.environ.get("ZULIP_OIDC_CLIENT_ID", "zulip"),
                "secret": get_secret("social_auth_oidc_secret"),
                "auto_signup": _zulip_oidc_auto_signup,
            }
        SOCIAL_AUTH_OIDC_FULL_NAME_VALIDATED = os.environ.get(
            "ZULIP_OIDC_FULL_NAME_VALIDATED",
            "True",
        ).lower() in {
            "1",
            "true",
            "yes",
            "on",
        }
    ports:
      - "${ZULIP_HTTP_HOST_PORT:-33302}:80"
      - "${ZULIP_HTTPS_HOST_PORT:-33300}:443"
      - "${ZULIP_SMTP_HOST_PORT:-33325}:25"
    volumes:
      - zulip-data:/data
      - ./local-static:/home/zulip/local-static:ro
      - ./nginx/app.d/usability-css.conf:/etc/nginx/zulip-include/app.d/usability-css.conf:ro
      - ./post-setup.d:/data/post-setup.d:ro
      - ../00-common/keycloak/certs/keycloak.crt:/usr/local/share/ca-certificates/keycloak.crt:ro
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    networks:
      - internal-nw
    depends_on:
      zulip-postgres:
        condition: service_healthy
      zulip-memcached:
        condition: service_started
      zulip-rabbitmq:
        condition: service_healthy
      zulip-redis:
        condition: service_healthy
    labels:
      - homepage.group=33-zulip
      - homepage.name=Zulip
      - homepage.href=https://${ZULIP_EXTERNAL_HOST:-${PUBLIC_HOST}:${ZULIP_HTTPS_HOST_PORT:-33300}}/
      - homepage.description=Team chat platform
      - homepage.icon=/icons/zulip.png
    healthcheck:
      test:
        - CMD-SHELL
        - curl -kfsS https://127.0.0.1/ >/dev/null || curl -fsS http://127.0.0.1/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  zulip-postgres:
    image: zulip/zulip-postgresql:14
    container_name: ${STACK_NAME:-inferlab}-zulip-postgres
    restart: unless-stopped
    profiles:
      - zulip
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${ZULIP_POSTGRES_PASSWORD:-zulip_password}
    volumes:
      - zulip-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U zulip -d zulip
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.icon=/icons/postgresql.png
      - homepage.group=33-zulip
      - homepage.name=Zulip-Postgres
      - homepage.description=Relational database

  zulip-memcached:
    image: docker.io/library/memcached:1.6.45-alpine
    container_name: ${STACK_NAME:-inferlab}-zulip-memcached
    restart: unless-stopped
    profiles:
      - zulip
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: ${ZULIP_MEMCACHED_PASSWORD:-zulip_password}
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pidof memcached >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - homepage.group=33-zulip
      - homepage.name=Zulip-Memcached
      - homepage.description=In-memory cache
      - homepage.icon=/icons/memcached.png
  zulip-rabbitmq:
    image: docker.io/library/rabbitmq:4.2
    container_name: ${STACK_NAME:-inferlab}-zulip-rabbitmq
    restart: unless-stopped
    profiles:
      - zulip
    command:
      - sh
      - -euc
      - |
        rabbitmq-plugins enable --offline rabbitmq_prometheus
        exec rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${ZULIP_RABBITMQ_PASSWORD:-zulip_password}
    volumes:
      - zulip-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
      - homepage.icon=/icons/rabbitmq.png
      - homepage.group=33-zulip
      - homepage.name=Zulip-RabbitMQ
      - homepage.description=Reliable message broker

  zulip-redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: ${STACK_NAME:-inferlab}-zulip-redis
    restart: unless-stopped
    profiles:
      - zulip
    command:
      - sh
      - -euc
      - |
        echo "requirepass '$$REDIS_PASSWORD'" > /etc/redis.conf
        exec redis-server /etc/redis.conf
    environment:
      REDIS_PASSWORD: ${ZULIP_REDIS_PASSWORD:-zulip_password}
    volumes:
      - zulip-redis-data:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      - homepage.icon=/icons/redis.png
      - homepage.group=33-zulip
      - homepage.name=Zulip-Redis
      - homepage.description=In-memory data store

volumes:
  zulip-data:
  zulip-postgres-data:
  zulip-rabbitmq-data:
  zulip-redis-data:

networks:
  internal-nw:
