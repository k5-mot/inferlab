services:
  ragflow:
    image: docker.io/infiniflow/ragflow:v0.25.2
    container_name: ragflow
    restart: unless-stopped
    profiles:
      - ragflow
    command:
      - --enable-adminserver
    environment:
      DEVICE: cpu
      MEM_LIMIT: ${RAGFLOW_MEM_LIMIT:-8073741824}
      ## RAGFlow
      API_PROXY_SCHEME: python
      TZ: Asia/Tokyo
      HF_ENDPOINT: https://hf-mirror.com
      # MAX_CONTENT_LENGTH: 1073741824
      DOC_BULK_SIZE: 4
      EMBEDDING_BATCH_SIZE: 16
      REGISTER_ENABLED: 1
      USE_DOCLING: false
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      # RAGFLOW_CRYPTO_ENABLED: true
      # RAGFLOW_CRYPTO_ALGORITH: aes-256-cbc
      # RAGFLOW_CRYPTO_KEY: ragflow-crypto-key
      THREAD_POOL_MAX_WORKERS: 128
      DISABLE_PASSWORD_LOGIN: false
      ## Elasticsearch
      DOC_ENGINE: elasticsearch
      ES_HOST: ragflow-elasticsearch
      ES_USER: ${RAGFLOW_ES_USER:-elastic}
      ELASTIC_PASSWORD: ${RAGFLOW_ELASTIC_PASSWORD:-infini_rag_flow}
      ## MySQL
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: ${RAGFLOW_MYSQL_PORT:-3306}
      MYSQL_DBNAME: ${RAGFLOW_MYSQL_DBNAME:-rag_flow}
      MYSQL_USER: root
      MYSQL_MAX_PACKET: ${RAGFLOW_MYSQL_MAX_PACKET:-1073741824}
      ## MinIO
      MINIO_HOST: ragflow-minio
      MINIO_CONSOLE_PORT: ${RAGFLOW_MINIO_CONSOLE_PORT:-9001}
      MINIO_PORT: ${RAGFLOW_MINIO_PORT:-9000}
      MINIO_USER: ${RAGFLOW_MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-infini_rag_flow}
      ## Redis (Valkey)
      REDIS_HOST: ragflow-redis
      REDIS_PORT: ${RAGFLOW_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}
      ## RAGFlow Sandbox
      # SANDBOX_ENABLED: 1
      # COMPOSE_PROFILES: ${COMPOSE_PROFILES},sandbox
      # SANDBOX_ARTIFACT_BUCKET: sandbox-artifacts
      # SANDBOX_ARTIFACT_EXPIRE_DAYS: 7
      # SANDBOX_EXECUTOR_MANAGER_IMAGE: ${SANDBOX_EXECUTOR_MANAGER_IMAGE:-infiniflow/sandbox-executor-manager:latest}
      # SANDBOX_EXECUTOR_MANAGER_POOL_SIZE: ${SANDBOX_EXECUTOR_MANAGER_POOL_SIZE:-3}
      # SANDBOX_BASE_PYTHON_IMAGE: ${SANDBOX_BASE_PYTHON_IMAGE:-infiniflow/sandbox-base-python:latest}
      # SANDBOX_BASE_NODEJS_IMAGE: ${SANDBOX_BASE_NODEJS_IMAGE:-infiniflow/sandbox-base-nodejs:latest}
      # SANDBOX_EXECUTOR_MANAGER_PORT: ${SANDBOX_EXECUTOR_MANAGER_PORT:-9385}
      # SANDBOX_ENABLE_SECCOMP: false
      # SANDBOX_MAX_MEMORY: 256m # b, k, m, g
      # SANDBOX_TIMEOUT: 10s # s, m, 1m30s
      RAGFLOW_OPENAI_BASE_URL: ${RAGFLOW_OPENAI_BASE_URL:-http://litellm:4000/v1}
      RAGFLOW_OPENAI_API_KEY: ${RAGFLOW_OPENAI_API_KEY:-sk-litellm-master-key}
      RAGFLOW_CHAT_MODEL: ${RAGFLOW_CHAT_MODEL:-gemma4:31b}
      RAGFLOW_EMBEDDING_MODEL: ${RAGFLOW_EMBEDDING_MODEL:-ruri-v3:310m}
      RAGFLOW_RERANK_MODEL: ${RAGFLOW_RERANK_MODEL:-ruri-v3-reranker:310m}
      RAGFLOW_VISION_MODEL: ${RAGFLOW_VISION_MODEL:-gemma3:31b}
      RAGFLOW_VISION_BASE_URL: ${RAGFLOW_VISION_BASE_URL:-http://litellm:4000/v1}
      RAGFLOW_VISION_API_KEY: ${RAGFLOW_VISION_API_KEY:-sk-litellm-master-key}
    ports:
      - 31008:80
      # - ${RAGFLOW_SVR_WEB_HTTP_PORT:-80}:80
      # - ${RAGFLOW_SVR_WEB_HTTPS_PORT:-443}:443
      # - ${RAGFLOW_SVR_HTTP_PORT:-9380}:9380
      # - ${RAGFLOW_ADMIN_SVR_HTTP_PORT:-9381}:9381
      # - ${RAGFLOW_SVR_MCP_PORT:-9382}:9382
      # - ${RAGFLOW_GO_HTTP_PORT:-9384}:9384
      # - ${RAGFLOW_GO_ADMIN_PORT:-9383}:9383
    volumes:
      - ragflow-logs:/ragflow/logs
      - ./ragflow/tiktoken-cache:/ragflow/.cache/tiktoken:ro
      - ./ragflow/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    networks:
      - llm-public
      - llm-internal
    depends_on:
      ragflow-elasticsearch:
        condition: service_healthy
      ragflow-mysql:
        condition: service_healthy
      ragflow-minio:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  ragflow-elasticsearch:
    image: docker.io/library/elasticsearch:${STACK_VERSION:-8.11.3}
    container_name: ragflow-elasticsearch
    restart: unless-stopped
    profiles:
      - ragflow
    environment:
      node.name: ragflow-elasticsearch
      ELASTIC_PASSWORD: ${RAGFLOW_ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    mem_limit: ${RAGFLOW_MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:9200" ]
      interval: 10s
      timeout: 10s
      retries: 120
    volumes:
      - ragflow-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - llm-internal

  ragflow-mysql:
    image: docker.io/library/mysql:8.0.39
    container_name: ragflow-mysql
    restart: unless-stopped
    profiles:
      - ragflow
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-infini_rag_flow}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --init-file=/data/application/init.sql
      - --binlog_expire_logs_seconds=604800
    volumes:
      - ragflow-mysql-data:/var/lib/mysql
      - ./ragflow/init.sql:/data/application/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-uroot", "-p${RAGFLOW_MYSQL_PASSWORD:-infini_rag_flow}" ]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - llm-internal

  ragflow-minio:
    image: docker.io/pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: ragflow-minio
    restart: unless-stopped
    profiles:
      - ragflow
    command: [ "server", "--console-address", ":9001", "/data" ]
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - ragflow-minio-data:/data
    networks:
      - llm-internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 10s
      retries: 120

  ragflow-redis:
    image: docker.io/valkey/valkey:8
    container_name: ragflow-redis
    restart: unless-stopped
    profiles:
      - ragflow
    command: [ "redis-server", "--requirepass", "${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - ragflow-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${RAGFLOW_REDIS_PASSWORD:-infini_rag_flow}", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - llm-internal

volumes:
  ragflow-logs:
  ragflow-elasticsearch-data:
  ragflow-mysql-data:
  ragflow-minio-data:
  ragflow-redis-data:

networks:
  llm-public:
  llm-internal:
