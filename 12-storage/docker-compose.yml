#
# 参考資料:
#
services:
  nextcloud:
    image: docker.io/library/nextcloud:34.0.1-apache
    container_name: ${STACK_NAME:-inferlab}-nextcloud
    restart: unless-stopped
    profiles:
      - storage
    depends_on:
      nextcloud-postgres:
        condition: service_healthy
      nextcloud-valkey:
        condition: service_healthy
    environment:
      POSTGRES_DB: nextcloud_db
      POSTGRES_USER: nextcloud_user
      POSTGRES_PASSWORD: nextcloud_password
      POSTGRES_HOST: nextcloud-postgres
      REDIS_HOST: nextcloud-valkey
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 ${PUBLIC_HOST} nextcloud"
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_INIT_HTACCESS: "true"
      OVERWRITECLIURL: http://${PUBLIC_HOST}:31200
      PHP_MEMORY_LIMIT: 1024M
      PHP_UPLOAD_LIMIT: 2G
      APACHE_BODY_LIMIT: 0
      NEXTCLOUD_OIDC_PROVIDER_ID: keycloak
      NEXTCLOUD_OIDC_CLIENT_ID: nextcloud
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET:-sk-nextcloud-oidc-client-secret-key}
      NEXTCLOUD_OIDC_DISCOVERY_URL: http://${PUBLIC_HOST}:30001/realms/${STACK_NAME:-inferlab}/.well-known/openid-configuration
      NEXTCLOUD_OIDC_END_SESSION_ENDPOINT: http://${PUBLIC_HOST}:30001/realms/${STACK_NAME:-inferlab}/protocol/openid-connect/logout
      NEXTCLOUD_OIDC_POST_LOGOUT_URI: http://${PUBLIC_HOST}:31200/login
      NEXTCLOUD_OIDC_SCOPE: "openid profile email"
      NEXTCLOUD_OIDC_MAPPING_UID: preferred_username
      NEXTCLOUD_OIDC_MAPPING_DISPLAY_NAME: name
      NEXTCLOUD_OIDC_MAPPING_EMAIL: email
      NEXTCLOUD_OIDC_MAPPING_GROUPS: groups
      NEXTCLOUD_OIDC_UNIQUE_UID: 0
      NEXTCLOUD_OIDC_GROUP_PROVISIONING: 1
      NEXTCLOUD_OIDC_ALLOW_INSECURE_HTTP: true
      NEXTCLOUD_ALLOW_LOCAL_REMOTE_SERVERS: true
    ports:
      - 31200:80
    volumes:
      - nextcloud:/var/www/html
      - ./nextcloud/before-starting-hooks:/docker-entrypoint-hooks.d/before-starting:ro
      - ./nextcloud/post-installation-hooks:/docker-entrypoint-hooks.d/post-installation:ro
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/status.php\") === false ? 1 : 0);'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/nextcloud.labels
    labels:
      - homepage.group=12-storage
      - homepage.name=Nextcloud
      - homepage.href=http://${PUBLIC_HOST}:31200/apps/files/files
      - homepage.description=Cloud storage platform

  nextcloud-postgres:
    image: docker.io/library/postgres:18.4-trixie
    container_name: ${STACK_NAME:-inferlab}-nextcloud-postgres
    restart: unless-stopped
    profiles:
      - storage
    environment:
      POSTGRES_DB: nextcloud_db
      POSTGRES_USER: nextcloud_user
      POSTGRES_PASSWORD: nextcloud_password
      TZ: UTC
      PGTZ: UTC
    volumes:
      - nextcloud-postgres:/var/lib/postgresql
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nextcloud_user -d nextcloud_db
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/postgres.labels
    labels:
      - homepage.group=12-storage
      - homepage.name=Nextcloud-Postgres
      - homepage.description=Relational database

  nextcloud-valkey:
    image: docker.io/valkey/valkey:8.1.9-alpine3.24
    container_name: ${STACK_NAME:-inferlab}-nextcloud-valkey
    restart: unless-stopped
    profiles:
      - storage
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/valkey.labels
    labels:
      - homepage.group=12-storage
      - homepage.name=Nextcloud-Valkey
      - homepage.description=Inmemory key-value NoSQL database

  oikb-rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: ${STACK_NAME:-inferlab}-oikb-rustfs
    restart: unless-stopped
    profiles:
      - storage
    environment:
      RUSTFS_ACCESS_KEY: ${OIKB_RUSTFS_ACCESS_KEY_ID:-rustfs_admin}
      RUSTFS_SECRET_KEY: ${OIKB_RUSTFS_SECRET_ACCESS_KEY:-rustfs_secret_key}
    ports:
      - 31203:9000
      - 31204:9001
    volumes:
      - oikb-rustfs-data:/data
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://127.0.0.1:9000/minio/health/ready > /dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.group=12-storage
      - homepage.name=OIKB-RustFS
      - homepage.href=http://${PUBLIC_HOST}:31203
      - homepage.description=OIKB data source object storage

  oikb-rustfs-bucket-init:
    build:
      context: ./oikb
      dockerfile: Containerfile
    image: inferlab/oikb-s3:latest
    container_name: ${STACK_NAME:-inferlab}-oikb-rustfs-bucket-init
    restart: "no"
    profiles:
      - storage
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        python - <<'PY'
        import os

        import boto3
        import botocore

        s3 = boto3.client(
            "s3",
            endpoint_url="http://oikb-rustfs:9000",
            aws_access_key_id=os.environ["OIKB_RUSTFS_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["OIKB_RUSTFS_SECRET_ACCESS_KEY"],
            region_name="us-east-1",
        )
        try:
            s3.create_bucket(Bucket=os.environ["OIKB_RUSTFS_BUCKET"])
        except botocore.exceptions.ClientError as exc:
            if exc.response.get("Error", {}).get("Code") not in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                raise
        PY
    environment:
      OIKB_RUSTFS_ACCESS_KEY_ID: ${OIKB_RUSTFS_ACCESS_KEY_ID:-rustfs_admin}
      OIKB_RUSTFS_SECRET_ACCESS_KEY: ${OIKB_RUSTFS_SECRET_ACCESS_KEY:-rustfs_secret_key}
      OIKB_RUSTFS_BUCKET: ${OIKB_RUSTFS_BUCKET:-oikb}
    networks:
      - internal-nw
    depends_on:
      oikb-rustfs:
        condition: service_healthy

  oikb:
    build:
      context: ./oikb
      dockerfile: Containerfile
    image: inferlab/oikb-s3:latest
    container_name: ${STACK_NAME:-inferlab}-oikb
    restart: unless-stopped
    command: daemon --config /app/.oikb.yaml
    profiles:
      - storage
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OIKB_OPENWEBUI_TIMEOUT: ${OIKB_OPENWEBUI_TIMEOUT:-21600}
      OIKB_API_KEY: ${OIKB_API_KEY:-sk-oikb-api-key}
      LOG_FORMAT: json
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_USER: admin
      NEXTCLOUD_PASSWORD: admin
      NEXTCLOUD_OPENWEBUI_KB_ID: ${NEXTCLOUD_OPENWEBUI_KB_ID:-}
      OIKB_NEXTCLOUD_SOURCE: /nextcloud/data/admin/files/oikb
      OIKB_NEXTCLOUD_INTERVAL: 1h
      AWS_ACCESS_KEY_ID: ${OIKB_RUSTFS_ACCESS_KEY_ID:-rustfs_admin}
      AWS_SECRET_ACCESS_KEY: ${OIKB_RUSTFS_SECRET_ACCESS_KEY:-rustfs_secret_key}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://oikb-rustfs:9000
      AWS_ENDPOINT_URL_S3: http://oikb-rustfs:9000
      OIKB_RUSTFS_BUCKET: ${OIKB_RUSTFS_BUCKET:-oikb}
      OIKB_RUSTFS_SOURCE: ${OIKB_RUSTFS_SOURCE:-s3://oikb/documents}
      OIKB_RUSTFS_INTERVAL: 1h
    ports:
      - 31201:8080
    volumes:
      - ./oikb/oikb.yaml:/app/.oikb.yaml:ro
      - nextcloud:/nextcloud:ro
    networks:
      - internal-nw
    depends_on:
      nextcloud:
        condition: service_healthy
      oikb-rustfs-bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health', timeout=3).read()" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/open-webui.labels
    labels:
      - homepage.group=12-storage
      - homepage.name=Open-WebUI-Knowledge-Bases
      - homepage.href=http://${PUBLIC_HOST}:31201
      - homepage.description=Knowledge bases for Open-WebUI

volumes:
  nextcloud:
  nextcloud-postgres:
  oikb-rustfs-data:

networks:
  internal-nw:
