services:
  keycloak:
    container_name: worklab-alfa-llm-keycloak
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:30000}
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HOST_PORT:-30000}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/worklab-realm.json:ro
    networks:
      - llm-public
      - llm-internal

  postgres-keycloak:
    container_name: worklab-alfa-llm-postgres-keycloak
    restart: unless-stopped
    image: docker.io/library/postgres:18.3
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-internal

  litellm:
    container_name: worklab-alfa-llm-litellm
    restart: unless-stopped
    image: docker.io/litellm/litellm:v1.83.3-stable
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-worklab-litellm}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-worklab}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-worklab}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse:3000/api/public/otel}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal

  vllm-gemma4-31b:
    container_name: worklab-alfa-llm-vllm-gemma4-31b
    restart: unless-stopped
    profiles:
      - inference
    image: docker.io/vllm/vllm-openai:v0.19.1
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - google/gemma-4-E4B-it
      - --served-model-name
      - gemma-4-E4B-it
    shm_size: 16gb
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

