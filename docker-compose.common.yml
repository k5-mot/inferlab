services:
  keycloak:
    container_name: worklab-alfa-llm-keycloak
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:30000}
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HOST_PORT:-30000}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/worklab-realm.json:ro
    networks:
      - llm-public
      - llm-internal

  postgres-keycloak:
    container_name: worklab-alfa-llm-postgres-keycloak
    restart: unless-stopped
    image: docker.io/library/postgres:18.3
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-internal

volumes:
  postgres-keycloak-data:

networks:
  llm-public:
  llm-internal:
