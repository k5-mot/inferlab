services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: inferlab-keycloak
    restart: unless-stopped
    profiles:
      - common
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://192.168.3.10:30000}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME_ADMIN:-http://192.168.3.10:30000}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HOST_PORT:-30000}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/inferlab-realm.json:ro
    networks:
      - llm-public
      - llm-internal

  postgres-keycloak:
    image: docker.io/library/postgres:18.3
    container_name: inferlab-postgres-keycloak
    restart: unless-stopped
    profiles:
      - common
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - llm-internal

volumes:
  postgres-keycloak-data:

networks:
  llm-public:
  llm-internal:
