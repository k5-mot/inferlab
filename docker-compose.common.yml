services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak
    restart: unless-stopped
    profiles:
      - common
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak_user}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:30000}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME_ADMIN:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:30000}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-30000}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/inferlab-realm.json:ro
    networks:
      - llm-public
      - llm-internal
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  keycloak-postgres:
    image: docker.io/library/postgres:18.3
    container_name: keycloak-postgres
    restart: unless-stopped
    profiles:
      - common
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak_user}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_password}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - llm-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  keycloak-postgres-data:

networks:
  llm-public:
  llm-internal:
