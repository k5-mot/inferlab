services:
  dify-init-permissions:
    image: docker.io/library/busybox:latest
    container_name: ${STACK_NAME:-inferlab}-dify-init-permissions
    restart: "no"
    profiles:
      - automation
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw

  dify-api:
    image: docker.io/langgenius/dify-api:1.16.0-rc1
    container_name: ${STACK_NAME:-inferlab}-dify-api
    restart: unless-stopped
    profiles:
      - automation
    environment: &dify-api-env
      MODE: api
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      SECRET_KEY: sk-dify-secret-key
      INIT_PASSWORD: admin
      MIGRATION_ENABLED: "true"
      CONSOLE_WEB_URL: http://${PUBLIC_HOST}:31300
      CONSOLE_API_URL: http://${PUBLIC_HOST}:31300
      SERVICE_API_URL: http://${PUBLIC_HOST}:31300
      APP_WEB_URL: http://${PUBLIC_HOST}:31300
      APP_API_URL: http://${PUBLIC_HOST}:31300
      FILES_URL: http://${PUBLIC_HOST}:31300
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      DB_TYPE: postgresql
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: dify_user
      DB_PASSWORD: dify_password
      DB_DATABASE: dify_db
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dify_redis_password
      CELERY_BROKER_URL: redis://:dify_redis_password@dify-redis:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox-key
      CODE_EXECUTION_SSL_VERIFY: "true"
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DIFY_INNER_API_KEY: sk-dify-plugin-inner-api-key
      INNER_API_KEY_FOR_PLUGIN: sk-dify-plugin-inner-api-key
      MARKETPLACE_ENABLED: "true"
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-API
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-worker:
    image: docker.io/langgenius/dify-api:1.16.0-rc1
    container_name: ${STACK_NAME:-inferlab}-dify-worker
    restart: unless-stopped
    profiles:
      - automation
    environment:
      <<: *dify-api-env
      MODE: worker
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A celery_healthcheck.celery inspect ping
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Worker
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-worker-beat:
    image: docker.io/langgenius/dify-api:1.16.0-rc1
    container_name: ${STACK_NAME:-inferlab}-dify-worker-beat
    restart: unless-stopped
    profiles:
      - automation
    environment:
      <<: *dify-api-env
      MODE: beat
    volumes:
      - dify-storage:/app/api/storage
    networks:
      - internal-nw
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A celery_healthcheck.celery inspect ping
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Worker-Beat
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-web:
    image: docker.io/langgenius/dify-web:1.16.0-rc1
    container_name: ${STACK_NAME:-inferlab}-dify-web
    restart: unless-stopped
    profiles:
      - automation
    environment:
      CONSOLE_API_URL: http://${PUBLIC_HOST}:31300
      SERVER_CONSOLE_API_URL: http://dify-api:5001
      APP_API_URL: http://${PUBLIC_HOST}:31300
      NEXT_PUBLIC_SOCKET_URL: ws://${PUBLIC_HOST}:31300
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Web
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-plugin-daemon:
    image: docker.io/langgenius/dify-plugin-daemon:0.6.3-local
    container_name: ${STACK_NAME:-inferlab}-dify-plugin-daemon
    restart: unless-stopped
    profiles:
      - automation
    environment:
      DB_HOST: dify-postgres
      DB_PORT: 5432
      DB_USERNAME: dify_user
      DB_PASSWORD: dify_password
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      SERVER_PORT: 5002
      SERVER_KEY: sk-dify-plugin-daemon-key
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: sk-dify-plugin-inner-api-key
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      FORCE_VERIFYING_SIGNATURE: "true"
      MARKETPLACE_ENABLED: "true"
    volumes:
      - dify-plugin-daemon:/app/storage
    networks:
      - internal-nw
    depends_on:
      dify-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:5002/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Plugin
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-sandbox:
    image: docker.io/langgenius/dify-sandbox:0.2.15
    container_name: ${STACK_NAME:-inferlab}-dify-sandbox
    restart: unless-stopped
    profiles:
      - automation
    environment:
      API_KEY: dify-sandbox-key
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://dify-ssrf-proxy:3128
      HTTPS_PROXY: http://dify-ssrf-proxy:3128
      SANDBOX_PORT: 8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    networks:
      - internal-nw
    depends_on:
      dify-ssrf-proxy:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8194/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Sandbox
      - homepage.icon=sh-dify
      - homepage.description=Automation

  dify-ssrf-proxy:
    image: docker.io/ubuntu/squid:latest
    container_name: ${STACK_NAME:-inferlab}-dify-ssrf-proxy
    restart: unless-stopped
    profiles:
      - automation
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
    networks:
      - internal-nw
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-SSRF-Proxy
      - homepage.icon=squid.png
      - homepage.description=Proxy

  dify-postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-postgres
    restart: unless-stopped
    profiles:
      - automation
    environment:
      POSTGRES_USER: dify_user
      POSTGRES_PASSWORD: dify_password
      POSTGRES_DB: dify_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify-postgres-data:/var/lib/postgresql/data
      - ./dify/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dify_user -d dify_db
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Postgres
      - homepage.icon=postgres.png
      - homepage.description=Database

  dify-redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: ${STACK_NAME:-inferlab}-dify-redis
    restart: unless-stopped
    profiles:
      - automation
    command:
      - redis-server
      - --requirepass
      - dify_redis_password
    environment:
      REDISCLI_AUTH: dify_redis_password
    volumes:
      - dify-redis-data:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify-Redis
      - homepage.icon=redis.png
      - homepage.description=Inmemory_Database

  dify-nginx:
    image: docker.io/library/nginx:latest
    container_name: ${STACK_NAME:-inferlab}-dify-nginx
    restart: unless-stopped
    profiles:
      - automation
    volumes:
      - ./dify/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 31300:80
    networks:
      - internal-nw
    depends_on:
      dify-api:
        condition: service_healthy
      dify-web:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.group=13-automation
      - homepage.name=Dify
      - homepage.icon=sh-dify
      - homepage.href=http://${PUBLIC_HOST}:31300
      - homepage.description=Automation

volumes:
  dify-storage:
  dify-plugin-daemon:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-postgres-data:
  dify-redis-data:

networks:
  internal-nw:
