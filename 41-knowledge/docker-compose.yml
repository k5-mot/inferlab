#
# 参考資料:
# - llm-wiki
#   - https://github.com/geronimo-iia/llm-wiki
#   - https://github.com/geronimo-iia/llm-wiki/blob/main/docs/guides/installation.md
#   - https://github.com/geronimo-iia/llm-wiki/blob/main/docs/guides/ide-integration.md
#
services:
  llm-wiki:
    build:
      context: ./llm-wiki
      dockerfile: Dockerfile
      args:
        LLM_WIKI_VERSION: ${LLM_WIKI_VERSION:-v0.5.5}
    image: ${LLM_WIKI_IMAGE:-inferlab/llm-wiki:v0.5.5}
    container_name: ${STACK_NAME:-inferlab}-llm-wiki
    restart: unless-stopped
    profiles:
      - knowledge
    environment:
      LLM_WIKI_CONFIG: /state/config.toml
      LLM_WIKI_SPACE_NAME: ${LLM_WIKI_SPACE_NAME:-inferlab}
      LLM_WIKI_SPACE_PATH: /wikis/${LLM_WIKI_SPACE_NAME:-inferlab}
      LLM_WIKI_HTTP_PORT: "8080"
      GIT_AUTHOR_NAME: ${LLM_WIKI_GIT_AUTHOR_NAME:-InferLab LLM Wiki}
      GIT_AUTHOR_EMAIL: ${LLM_WIKI_GIT_AUTHOR_EMAIL:-llm-wiki@inferlab.local}
      GIT_COMMITTER_NAME: ${LLM_WIKI_GIT_COMMITTER_NAME:-InferLab LLM Wiki}
      GIT_COMMITTER_EMAIL: ${LLM_WIKI_GIT_COMMITTER_EMAIL:-llm-wiki@inferlab.local}
    ports:
      - "${LLM_WIKI_HTTP_HOST_PORT:-34100}:8080"
    volumes:
      - llm-wiki-state:/state
      - llm-wiki-data:/wikis
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 8080
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    labels:
      - homepage.icon=/icons/llm-wiki.png
      - homepage.group=41-knowledge
      - homepage.name=LLM Wiki
      - homepage.href=http://${PUBLIC_HOST}:${LLM_WIKI_HTTP_HOST_PORT:-34100}/mcp
      - homepage.description=Git-backed Markdown wiki engine for agents

  llmwiki-sync-worker:
    build:
      context: ./llmwiki-sync-worker
      dockerfile: Dockerfile
    image: ${LLMWIKI_SYNC_WORKER_IMAGE:-inferlab/llmwiki-sync-worker:latest}
    container_name: ${STACK_NAME:-inferlab}-llmwiki-sync-worker
    restart: unless-stopped
    profiles:
      - knowledge
    environment:
      SYNC_CONFIG_PATH: /config/config.yaml
      LLM_WIKI_MCP_URL: http://llm-wiki:8080/mcp
      LLM_WIKI_SPACE_NAME: ${LLM_WIKI_SPACE_NAME:-inferlab}
      LLMWIKI_SYNC_INTERVAL_SECONDS: ${LLMWIKI_SYNC_INTERVAL_SECONDS:-3600}
      LLMWIKI_SYNC_HTTP_TIMEOUT_SECONDS: ${LLMWIKI_SYNC_HTTP_TIMEOUT_SECONDS:-30}
      LLMWIKI_SYNC_WEB_ENABLED: ${LLMWIKI_SYNC_WEB_ENABLED:-true}
      LLMWIKI_SYNC_WEB_HOST: 0.0.0.0
      LLMWIKI_SYNC_WEB_PORT: "8090"
      LLMWIKI_SYNC_COUCHDB_ENABLED: ${LLMWIKI_SYNC_COUCHDB_ENABLED:-true}
      LLMWIKI_SYNC_COUCHDB_MAX_DOCS_PER_DATABASE: ${LLMWIKI_SYNC_COUCHDB_MAX_DOCS_PER_DATABASE:-50}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-couchdb_user}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-couchdb_password}
      LLMWIKI_SYNC_NEXTCLOUD_ENABLED: ${LLMWIKI_SYNC_NEXTCLOUD_ENABLED:-false}
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_LLMWIKI_USER: ${NEXTCLOUD_LLMWIKI_USER:-}
      NEXTCLOUD_LLMWIKI_PASSWORD: ${NEXTCLOUD_LLMWIKI_PASSWORD:-}
      NEXTCLOUD_LLMWIKI_ROOT_PATH: ${NEXTCLOUD_LLMWIKI_ROOT_PATH:-/}
      NEXTCLOUD_LLMWIKI_DEPTH: ${NEXTCLOUD_LLMWIKI_DEPTH:-1}
      NEXTCLOUD_LLMWIKI_MAX_ITEMS: ${NEXTCLOUD_LLMWIKI_MAX_ITEMS:-50}
      LLMWIKI_SYNC_BOOKSTACK_ENABLED: ${LLMWIKI_SYNC_BOOKSTACK_ENABLED:-false}
      BOOKSTACK_URL: http://bookstack
      BOOKSTACK_LLMWIKI_TOKEN_ID: ${BOOKSTACK_LLMWIKI_TOKEN_ID:-}
      BOOKSTACK_LLMWIKI_TOKEN_SECRET: ${BOOKSTACK_LLMWIKI_TOKEN_SECRET:-}
      BOOKSTACK_LLMWIKI_MAX_ITEMS: ${BOOKSTACK_LLMWIKI_MAX_ITEMS:-50}
      LLMWIKI_SYNC_ZULIP_ENABLED: ${LLMWIKI_SYNC_ZULIP_ENABLED:-false}
      ZULIP_URL: https://zulip
      ZULIP_LLMWIKI_EMAIL: ${ZULIP_LLMWIKI_EMAIL:-}
      ZULIP_LLMWIKI_API_KEY: ${ZULIP_LLMWIKI_API_KEY:-}
      ZULIP_LLMWIKI_VERIFY_TLS: ${ZULIP_LLMWIKI_VERIFY_TLS:-false}
      ZULIP_LLMWIKI_MAX_STREAMS: ${ZULIP_LLMWIKI_MAX_STREAMS:-50}
      ZULIP_LLMWIKI_MAX_MESSAGES: ${ZULIP_LLMWIKI_MAX_MESSAGES:-50}
      LLMWIKI_SYNC_KANEO_ENABLED: ${LLMWIKI_SYNC_KANEO_ENABLED:-false}
      KANEO_URL: http://kaneo:5173
      KANEO_LLMWIKI_API_TOKEN: ${KANEO_LLMWIKI_API_TOKEN:-}
      KANEO_LLMWIKI_WORKSPACE_ID: ${KANEO_LLMWIKI_WORKSPACE_ID:-}
      KANEO_LLMWIKI_MAX_PROJECTS: ${KANEO_LLMWIKI_MAX_PROJECTS:-50}
      LLMWIKI_SYNC_GITLAB_ENABLED: ${LLMWIKI_SYNC_GITLAB_ENABLED:-false}
      GITLAB_URL: http://gitlab
      GITLAB_LLMWIKI_TOKEN: ${GITLAB_LLMWIKI_TOKEN:-}
      GITLAB_LLMWIKI_MAX_PROJECTS: ${GITLAB_LLMWIKI_MAX_PROJECTS:-50}
    ports:
      - "${LLMWIKI_SYNC_WEB_HOST_PORT:-34101}:8090"
    volumes:
      - llmwiki-sync-worker-state:/state
      - ./llmwiki-sync-worker/config.yaml:/config/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      llm-wiki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          grep -q '"status": "ok"' /state/health.json
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - homepage.icon=/icons/python.png
      - homepage.group=41-knowledge
      - homepage.name=LLMwiki Sync Worker
      - homepage.href=http://${LLMWIKI_SYNC_WEB_PUBLIC_HOST:-127.0.0.1}:${LLMWIKI_SYNC_WEB_HOST_PORT:-34101}
      - homepage.description=Configured sources sync worker via llm-wiki MCP

volumes:
  llmwiki-sync-worker-state:
  llm-wiki-state:
  llm-wiki-data:

networks:
  internal-nw:
