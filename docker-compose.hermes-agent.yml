services:
  hermes-agent-config:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent-config
    restart: "no"
    profiles:
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        cp /config/config.yaml /opt/data/config.yaml
        chown -R 1000:1000 /opt/data || true
    volumes:
      - hermes-agent-data:/opt/data
      - ./hermes-agent/config.yaml:/config/config.yaml:ro

  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - gateway
      - run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: ${HERMES_AGENT_PORT:-8642}
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
    ports:
      - "${HERMES_AGENT_HOST_PORT:-31006}:${HERMES_AGENT_PORT:-8642}"
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - llm-public
      - llm-internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      hermes-agent-config:
        condition: service_completed_successfully

  hermes-agent-dashboard:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent-dashboard
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "${HERMES_AGENT_DASHBOARD_PORT:-9119}"
      - --no-open
      - --insecure
    environment:
      GATEWAY_HEALTH_URL: http://hermes-agent:${HERMES_AGENT_PORT:-8642}
    ports:
      - "127.0.0.1:${HERMES_AGENT_DASHBOARD_HOST_PORT:-31009}:${HERMES_AGENT_DASHBOARD_PORT:-9119}"
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - llm-public
      - llm-internal
    depends_on:
      hermes-agent:
        condition: service_started

volumes:
  hermes-agent-data:

networks:
  llm-public:
  llm-internal:
