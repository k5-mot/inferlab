services:
  hermes-agent-config:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent-config
    restart: "no"
    profiles:
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        cp /config/config.yaml /opt/data/config.yaml
        chown -R 1000:1000 /opt/data || true
    volumes:
      - hermes-agent-data:/opt/data
      - ./skills:/opt/inferlab/skills:ro
      - ./hermes-agent/config.yaml:/config/config.yaml:ro

  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - gateway
      - run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: ${HERMES_AGENT_PORT:-8642}
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Tokyo}
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: ${OPEN_WEBUI_DEFAULT_CHANNEL:-report}
      OPEN_WEBUI_CHANNELS_LIST_PATH: ${OPEN_WEBUI_CHANNELS_LIST_PATH:-/api/v1/channels/}
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: ${OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE:-/api/v1/channels/{channel_id}/messages/post}
      OPEN_WEBUI_MAX_MESSAGE_CHARS: ${OPEN_WEBUI_MAX_MESSAGE_CHARS:-20000}
      PYTHONPATH: /opt/inferlab
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - 31006:8642
    volumes:
      - hermes-agent-data:/opt/data
      - ./skills:/opt/inferlab/skills:ro
    networks:
      - llm-public
      - llm-internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      hermes-agent-config:
        condition: service_completed_successfully

  hermes-agent-dashboard:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.4.23}
    container_name: inferlab-hermes-agent-dashboard
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - dashboard
      - --host
      - "0.0.0.0"
      - --port
      - "9119"
      - --no-open
      - --insecure
    environment:
      GATEWAY_HEALTH_URL: http://hermes-agent:8642
    ports:
      - 31009:9119
    volumes:
      - hermes-agent-data:/opt/data
      - ./skills:/opt/inferlab/skills:ro
    networks:
      - llm-public
      - llm-internal
    depends_on:
      hermes-agent:
        condition: service_started

volumes:
  hermes-agent-data:

networks:
  llm-public:
  llm-internal:
