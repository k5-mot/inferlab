services:
  hermes-agent:
    image: docker.io/nousresearch/hermes-agent:v2026.4.23
    container_name: inferlab-hermes-agent
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - setup
    environment:
      HERMES_AGENT_PORT: ${HERMES_AGENT_PORT:-8080}
    ports:
      - "${HERMES_AGENT_HOST_PORT:-31006}:${HERMES_AGENT_PORT:-8080}"
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - llm-public
      - llm-internal

networks:
  llm-public:
  llm-internal:
