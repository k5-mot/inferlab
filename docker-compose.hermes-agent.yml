services:
  hermes-agent-init:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: hermes-agent-init
    restart: no
    profiles:
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -c
        # cp -rv  /opt/config/.codex/auth.json  /opt/data/auth.json
        # cp -rfv /opt/config/.codex/           /opt/data
    command:
      - |
        set -eu
        mkdir -p /opt/data/skills
        cp -rv  /opt/config/config.yaml       /opt/data/config.yaml
        cp -rfv /opt/config/skills/*          /opt/data/skills
        npm install --prefix /opt/data rss-mcp --silent
        export PYTHONPATH="/opt/data/langfuse-python-packages$${PYTHONPATH:+:$$PYTHONPATH}"
        if ! python - <<'PY' >/dev/null 2>&1
        import importlib.metadata as md
        from langfuse import Langfuse, propagate_attributes

        expected = {
            "certifi": "2026.5.20",
            "packaging": "26.0",
            "requests": "2.33.0",
        }
        for package, version in expected.items():
            if md.version(package) != version:
                raise SystemExit(1)
        PY
        then
          python -m ensurepip --upgrade
          python -m pip install --no-cache-dir --upgrade --target /opt/data/langfuse-python-packages \
            "$${HERMES_LANGFUSE_SDK_PACKAGE:-langfuse}" \
            certifi==2026.5.20 \
            packaging==26.0 \
            requests==2.33.0
        fi
        python - <<'PY'
        from langfuse import Langfuse, propagate_attributes
        PY
        chown -R 10000:10000 /opt/data || true
    volumes:
      - hermes-agent-data:/opt/data
      - ./hermes/hermes-config.yaml:/opt/config/config.yaml
      - ~/.codex:/opt/config/.codex:ro
      - ./skills:/opt/config/skills:ro
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      HERMES_LANGFUSE_SDK_PACKAGE: ${HERMES_LANGFUSE_SDK_PACKAGE:-langfuse}

  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: hermes-agent
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - gateway
      - run
    environment:
      # https://hermes-agent.nousresearch.com/docs/reference/environment-variables
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: ${HERMES_AGENT_PORT:-8642}
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      PYTHONPATH: /opt/data/langfuse-python-packages
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Tokyo}
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:31001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: ${OPEN_WEBUI_DEFAULT_CHANNEL:-report}
      OPEN_WEBUI_CHANNELS_LIST_PATH: ${OPEN_WEBUI_CHANNELS_LIST_PATH:-/api/v1/channels/}
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: ${OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE:-/api/v1/channels/{channel_id}/messages/post}
      OPEN_WEBUI_CHATS_ALL_DB_PATH: ${OPEN_WEBUI_CHATS_ALL_DB_PATH:-/api/v1/chats/all/db}
      OPEN_WEBUI_MAX_MESSAGE_CHARS: ${OPEN_WEBUI_MAX_MESSAGE_CHARS:-20000}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - llm-public
      - llm-internal
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${HERMES_AGENT_PORT:-8642}/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      hermes-agent-init:
        condition: service_completed_successfully

  hermes-agent-dashboard:
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: hermes-agent-dashboard
    restart: unless-stopped
    profiles:
      - hermes-agent
    command:
      - dashboard
      - --host
      - "0.0.0.0"
      - --port
      - "9119"
      - --no-open
    environment:
      GATEWAY_HEALTH_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pw-hermes-agent-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-sk-hermes-agent-dashboard-secret}
      PYTHONPATH: /opt/data/langfuse-python-packages
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
    ports:
      - 31009:9119
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - llm-public
      - llm-internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9119/health >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      hermes-agent:
        condition: service_healthy

volumes:
  hermes-agent-data:

networks:
  llm-public:
  llm-internal:
