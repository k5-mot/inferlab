services:
  zulip:
    image: ghcr.io/zulip/zulip-server:12.1-0
    container_name: zulip
    restart: unless-stopped
    profiles:
      - team-chat
    environment:
      DB_HOST: zulip-postgres
      DB_HOST_PORT: "5432"
      DB_USER: zulip
      SSL_CERTIFICATE_GENERATION: self-signed
      SETTING_MEMCACHED_LOCATION: zulip-memcached:11211
      SETTING_RABBITMQ_HOST: zulip-rabbitmq
      SETTING_REDIS_HOST: zulip-redis
      SECRETS_email_password: ${ZULIP_EMAIL_PASSWORD:-123456789}
      SECRETS_rabbitmq_password: ${ZULIP_RABBITMQ_PASSWORD:-zulip_password}
      SECRETS_postgres_password: ${ZULIP_POSTGRES_PASSWORD:-zulip_password}
      SECRETS_memcached_password: ${ZULIP_MEMCACHED_PASSWORD:-zulip_password}
      SECRETS_redis_password: ${ZULIP_REDIS_PASSWORD:-zulip_password}
      SECRETS_secret_key: ${ZULIP_SECRET_KEY:-sk-zulip-secret-key}
      SETTING_EXTERNAL_HOST: ${ZULIP_EXTERNAL_HOST:-localhost.localdomain}
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMIN_EMAIL:-admin@example.com}
      SETTING_EMAIL_HOST: ${ZULIP_EMAIL_HOST:-}
      SETTING_EMAIL_HOST_USER: ${ZULIP_EMAIL_HOST_USER:-noreply@example.com}
      SETTING_EMAIL_PORT: ${ZULIP_EMAIL_PORT:-587}
      SETTING_EMAIL_USE_SSL: ${ZULIP_EMAIL_USE_SSL:-False}
      SETTING_EMAIL_USE_TLS: ${ZULIP_EMAIL_USE_TLS:-True}
      ZULIP_AUTH_BACKENDS: EmailAuthBackend
    ports:
      - "${ZULIP_HTTP_HOST_PORT:-32002}:80"
      - "${ZULIP_HTTPS_HOST_PORT:-32443}:443"
      - "${ZULIP_SMTP_HOST_PORT:-32025}:25"
    volumes:
      - zulip-data:/data
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    networks:
      - internalnw
    depends_on:
      zulip-postgres:
        condition: service_started
      zulip-memcached:
        condition: service_started
      zulip-rabbitmq:
        condition: service_started
      zulip-redis:
        condition: service_started

  zulip-postgres:
    image: zulip/zulip-postgresql:14
    container_name: zulip-postgres
    restart: unless-stopped
    profiles:
      - team-chat
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${ZULIP_POSTGRES_PASSWORD:-zulip_password}
    volumes:
      - zulip-postgres-data:/var/lib/postgresql/data
    networks:
      - internalnw

  zulip-memcached:
    image: docker.io/library/memcached:alpine
    container_name: zulip-memcached
    restart: unless-stopped
    profiles:
      - team-chat
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: ${ZULIP_MEMCACHED_PASSWORD:-zulip_password}
    networks:
      - internalnw

  zulip-rabbitmq:
    image: docker.io/library/rabbitmq:4.1
    container_name: zulip-rabbitmq
    restart: unless-stopped
    profiles:
      - team-chat
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${ZULIP_RABBITMQ_PASSWORD:-zulip_password}
    volumes:
      - zulip-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internalnw

  zulip-redis:
    image: docker.io/library/redis:alpine
    container_name: zulip-redis
    restart: unless-stopped
    profiles:
      - team-chat
    command:
      - sh
      - -euc
      - |
        echo "requirepass '$$REDIS_PASSWORD'" > /etc/redis.conf
        exec redis-server /etc/redis.conf
    environment:
      REDIS_PASSWORD: ${ZULIP_REDIS_PASSWORD:-zulip_password}
    volumes:
      - zulip-redis-data:/data
    networks:
      - internalnw

volumes:
  zulip-data:
  zulip-postgres-data:
  zulip-rabbitmq-data:
  zulip-redis-data:

networks:
  internalnw:
