model:
  provider: "openai-codex"
  default: "gpt-5.5"

fallback_providers:
  - provider: "custom"
    model: "gpt-oss:120b-cloud"
    base_url: "http://ollama:11434/v1"
    api_mode: "chat_completions"
  - provider: "openrouter"
    model: "anthropic/claude-sonnet-4"

discord:
  require_mention: true

mcp_servers:
  searxng:
    command: "npx"
    args: ["-y", "mcp-searxng"]
    env:
      SEARXNG_URL: "http://searxng:8080/"
