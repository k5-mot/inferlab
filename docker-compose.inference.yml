services:
  litellm:
    container_name: worklab-alfa-llm-litellm
    restart: unless-stopped
    image: docker.io/litellm/litellm:v1.83.3-stable
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-worklab-litellm}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-worklab}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-worklab}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse:3000/api/public/otel}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal

  vllm-gemma4-31b:
    container_name: worklab-alfa-llm-vllm-gemma4-31b
    restart: unless-stopped
    profiles:
      - inference
    image: docker.io/vllm/vllm-openai:v0.19.1
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - google/gemma-4-E4B-it
      - --served-model-name
      - gemma-4-E4B-it
    shm_size: 16gb
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  vllm-ruri-v3-310m:
    container_name: worklab-alfa-llm-vllm-ruri-v3-310m
    restart: unless-stopped
    profiles:
      - inference
    image: docker.io/vllm/vllm-openai:v0.19.1
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - cl-nagoya/ruri-v3-310m
      - --served-model-name
      - ruri-v3-310m
      - --task
      - embed
    shm_size: 8gb
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  vllm-ruri-v3-reranker-310m:
    container_name: worklab-alfa-llm-vllm-ruri-v3-reranker-310m
    restart: unless-stopped
    profiles:
      - inference
    image: docker.io/vllm/vllm-openai:v0.19.1
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - cl-nagoya/ruri-v3-reranker-310m
      - --served-model-name
      - ruri-v3-reranker-310m
      - --task
      - score
    shm_size: 8gb
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

volumes:
  vllm-cache:

networks:
  llm-public:
  llm-internal:
