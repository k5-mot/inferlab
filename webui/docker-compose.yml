services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.10.2-slim
    container_name: open-webui
    restart: unless-stopped
    profiles:
      - webui
    environment:
      WEBUI_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:31001}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-sk-open-webui-secret-key}
      ENABLE_API_KEYS: "true"
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DEFAULT_MODELS: gemma4:31b
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: ruri-v3:310m
      RAG_OPENAI_API_BASE_URL: http://litellm:4000
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_ENGINE: external
      RAG_EXTERNAL_RERANKER_URL: http://litellm:4000
      RAG_EXTERNAL_RERANKER_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      RAG_RERANKING_MODEL: ruri-v3-reranker:310m
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_API_KEY: sk-docling-serve-api-key
      VECTOR_DB: qdrant
      QDRANT_API_KEY: sk-qdrant-api-key
      QDRANT_URI: http://qdrant:6333
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://voicevox-openai-tts:8000/v1
      AUDIO_TTS_OPENAI_API_KEY: sk-voicevox-openai-tts-api-key
      AUDIO_TTS_MODEL: voicevox-v1
      AUDIO_TTS_VOICE: "1"
    ports:
      - "${OPEN_WEBUI_HOST_PORT:-31001}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - llm-public
      - llm-internal
    depends_on:
      litellm:
        condition: service_started
      docling:
        condition: service_started
      qdrant:
        condition: service_started
      searxng:
        condition: service_started
      voicevox-openai-tts:
        condition: service_started

  docling:
    image: ghcr.io/k5-mot/docling-serve-jp:v1.26.0
    container_name: docling
    restart: unless-stopped
    profiles:
      - webui
    environment:
      DOCLING_SERVE_HOST: 0.0.0.0
      DOCLING_SERVE_PORT: "5001"
      DOCLING_SERVE_API_KEY: sk-docling-serve-api-key
    ports:
      - "${DOCLING_HOST_PORT:-50000}:5001"
    volumes:
      - docling-data:/data
    networks:
      - llm-internal

  searxng:
    image: docker.io/searxng/searxng:2026.7.11-62a1ab7ed
    container_name: searxng
    restart: unless-stopped
    profiles:
      - webui
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - llm-internal

  voicevox_engine:
    image: docker.io/voicevox/voicevox_engine:cpu-0.25.2
    container_name: voicevox_engine
    restart: unless-stopped
    profiles:
      - webui
    ports:
      - "${VOICEVOX_ENGINE_HOST_PORT:-50021}:50021"
    networks:
      - llm-internal

  voicevox-openai-tts:
    image: ghcr.io/sunwood-ai-labs/voicevox-openai-tts:0.2.0
    container_name: voicevox-openai-tts
    restart: unless-stopped
    profiles:
      - webui
    environment:
      VOICEVOX_ENGINE_URL: http://voicevox_engine:50021
      API_KEY: sk-voicevox-openai-tts-api-key
    ports:
      - "${VOICEVOX_OPENAI_TTS_HOST_PORT:-50022}:8000"
    networks:
      - llm-internal
    depends_on:
      voicevox_engine:
        condition: service_started

  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.2
    container_name: qdrant
    restart: unless-stopped
    profiles:
      - webui
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - llm-internal

  open-webui-computer:
    image: ghcr.io/open-webui/computer:0.9.4
    container_name: open-webui-computer
    restart: unless-stopped
    profiles:
      - webui
    networks:
      - llm-internal

volumes:
  open-webui-data:
  docling-data:
  qdrant-storage:
  qdrant-snapshots:

networks:
  llm-public:
  llm-internal:
