
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  session_id_header_name: X-OpenWebUI-Chat-Id
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer

model_list:

  # Ollama
  - model_name: gemma4:e4b
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://ollama:11434

  - model_name: gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://ollama:11434

  - model_name: gemma3:31b
    litellm_params:
      model: ollama_chat/gemma3:31b
      api_base: http://ollama:11434

  - model_name: gpt-oss:120b
    litellm_params:
      model: ollama_chat/gpt-oss:120b-cloud
      api_base: http://ollama:11434

  - model_name: minimax-m2.7:229b
    litellm_params:
      model: ollama_chat/minimax-m2.7:cloud
      api_base: http://ollama:11434

  - model_name: qwen3.5:397b
    litellm_params:
      model: ollama_chat/qwen3.5:397b-cloud
      api_base: http://ollama:11434

  - model_name: glm-5.1:754b
    litellm_params:
      model: ollama_chat/glm-5.1:cloud
      api_base: http://ollama:11434

  - model_name: kimi-k2.6:1.0t
    litellm_params:
      model: ollama_chat/kimi-k2.6:cloud
      api_base: http://ollama:11434

  - model_name: deepseek-v4-flash:284b
    litellm_params:
      model: ollama_chat/deepseek-v4-flash:cloud
      api_base: http://ollama:11434

  - model_name: deepseek-v4-pro:1.6t
    litellm_params:
      model: ollama_chat/deepseek-v4-pro:cloud
      api_base: http://ollama:11434

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: ollama_chat/gemini-3-flash-preview:cloud
      api_base: http://ollama:11434

  - model_name: qwen3-coder-next:80b
    litellm_params:
      model: ollama_chat/qwen3-coder-next:cloud
      api_base: http://ollama:11434

  - model_name: nomic-embed-text-v2-moe
    litellm_params:
      model: ollama/nomic-embed-text-v2-moe
      api_base: http://ollama:11434

  # Openrouter
  - model_name: free-router
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: free-router[1m]
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: free-router[200k]
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: free-router[32k]
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # Google AI Studio
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash-preview-04-17
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      input_cost_per_token: 0.0000003    # $0.30 / 1M tokens
      output_cost_per_token: 0.0000025   # $2.50 / 1M tokens

  # Hermes-Agent
  # - model_name: hermes-agent
  #   litellm_params:
  #     model: openai/hermes-agent
  #     api_base: http://hermes-agent:8642/v1
  #     api_key: hermes-agent-secret-key

  # Text Embedding Inference (TEI)
  - model_name: ruri-v3:310m
    litellm_params:
      model: openai/cl-nagoya/ruri-v3-310m
      api_base: http://tei-embedding:8000/v1
      api_key: EMPTY
      encoding_format: float

  - model_name: ruri-v3-reranker:310m
    litellm_params:
      model: openai/cl-nagoya/ruri-v3-reranker-310m
      api_base: http://tei-reranking:8000/v1
      api_key: EMPTY
      encoding_format: float

litellm_settings:
  callbacks:
    - langfuse_otel
  extra_spend_tag_headers:
    - "x-openwebui-user-id"
    - "x-openwebui-user-email"
  langfuse_default_tags:
    - "cache_hit"
    - "user_api_key_user_id"
    - "user_api_key_team_alias"
  drop_params: true
  request_timeout: 600
