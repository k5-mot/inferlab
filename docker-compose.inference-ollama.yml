      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "classify"
      - --dtype
      - "float32"
      # - --gpu-memory-utilization
      # - "0.05"
      - --served-model-name
      - "ruri-v3-reranker:310m"
    volumes:
      - ollama-vllm-cache:/root/.cache
    networks:
      - llm-internal
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 10s
