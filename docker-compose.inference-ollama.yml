  vllm-ruri-v3-310m:
    image: docker.io/vllm/vllm-openai-cpu:v0.21.0
    container_name: inferlab-vllm-ruri-v3-310m
    restart: unless-stopped
    # shm_size: 8gb
    profiles:
      - inference-ollama
    command:
      - "cl-nagoya/ruri-v3-310m"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "embed"
      - --dtype
      - "float32"
      # - --gpu-memory-utilization
      # - "0.05"
      - --served-model-name
      - "ruri-v3:310m"
    volumes:
      - ollama-vllm-cache:/root/.cache
    networks:
      - llm-internal
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 60s

  vllm-ruri-v3-reranker-310m:
    image: docker.io/vllm/vllm-openai-cpu:v0.21.0
    container_name: inferlab-vllm-ruri-v3-reranker-310m
