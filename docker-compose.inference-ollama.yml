services:
  # https://hub.docker.com/r/litellm/litellm
  # https://hub.docker.com/hardened-images/catalog/dhi/litellm
  # https://docs.litellm.ai/blog/vllm-embeddings-incident
  litellm:
    # image:  dhi.io/litellm:1.83.7
    image: docker.io/litellm/litellm:v1.83.7-stable
    container_name: inferlab-litellm
    restart: unless-stopped
    profiles:
      - inference-ollama
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-langfuse-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-langfuse-secret-key}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse:3000/api/public/otel}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config-ollama.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal
    depends_on:
      ollama:
        condition: service_healthy
      vllm-ruri-v3-310m:
        condition: service_healthy
      vllm-ruri-v3-reranker-310m:
        condition: service_healthy
      # vllm-qwen3-embedding-06b:
      #   condition: service_healthy
      # vllm-qwen3-reranker-06b:
      #   condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  ollama:
    image: docker.io/ollama/ollama:0.24.0
    container_name: inferlab-ollama
    restart: unless-stopped
    profiles:
      - inference-ollama
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-sk-ollama-api-key}"
    ports:
      - 11434:11434
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - llm-internal
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama list > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: docker.io/ollama/ollama:0.24.0
    container_name: inferlab-ollama-init
    restart: no
    profiles:
      - inference-ollama
    tty: true
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=127.0.0.1:11434
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - llm-internal
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - >-
        ollama serve & OLLAMA_PID=$$!; until ollama list > /dev/null 2>&1; do
          echo 'Waiting for Ollama to be ready...';
          sleep 1;
        done; echo 'Ollama is ready. Importing models in parallel...'; (
          ollama pull gemma4:e4b                   &
          ollama pull gemma4:31b-cloud             &
          ollama pull gpt-oss:120b-cloud           &
          ollama pull minimax-m2.7:cloud           &
          ollama pull qwen3.5:397b-cloud           &
          ollama pull glm-5.1:cloud                &
          ollama pull kimi-k2.6:cloud              &
          ollama pull deepseek-v4-flash:cloud      &
          ollama pull deepseek-v4-pro:cloud        &
          ollama pull gemini-3-flash-preview:cloud &
          ollama pull qwen3-coder-next:cloud       &
          wait
        ); echo 'All models pulled.'; kill "$$OLLAMA_PID"

  # infinity:
  #   image: docker.io/michaelf34/infinity:0.0.77
  #   container_name: inferlab-infinity
