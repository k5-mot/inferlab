[project]
name = "llm-wiki-platform"
version = "0.1.0"
description = "OpenKBを中核とする社内LLM Wikiパイプライン"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0,<4",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "pydantic>=2.11.0,<3",
    "pyyaml>=6.0.2,<7",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.0,<1",
    "types-pyyaml>=6.0.12.20250516",
]

[project.scripts]
llm-wiki-api = "llm_wiki_platform.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_platform"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llm_wiki_platform"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
