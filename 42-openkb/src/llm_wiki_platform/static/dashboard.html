<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenKB Sync Control</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <style>
    .checkpoint { max-width: 18rem; }
    [aria-busy="true"] .sync-icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <h1 class="navbar-brand mb-0">OpenKB Sync Control</h1>
        <span id="api-state" class="badge bg-secondary-lt">接続確認中</span>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <h2 class="page-title">データソース</h2>
          <div id="updated-at" class="text-secondary mt-1">-</div>
        </div>
      </div>
      <div class="page-body"><div class="container-xl">
        <div id="notice" class="alert alert-danger d-none" role="alert"></div>
        <div class="row row-cards mb-3" aria-label="同期サマリー">
          <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Sources</div><div id="source-count" class="h2 mb-0">-</div></div></div></div>
          <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Enabled</div><div id="enabled-count" class="h2 mb-0">-</div></div></div></div>
          <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Running</div><div id="running-count" class="h2 mb-0">-</div></div></div></div>
          <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary">Documents</div><div id="document-count" class="h2 mb-0">-</div></div></div></div>
        </div>
        <div class="card"><div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead><tr><th>Source</th><th>State</th><th>Documents</th><th>Last sync</th><th>Result</th><th></th></tr></thead>
            <tbody id="source-rows"><tr><td colspan="6" class="text-center text-secondary py-5">Loading...</td></tr></tbody>
          </table>
        </div></div>
      </div></div>
    </div>
  </div>
  <script>
    const busySources = new Set();

    /** HTMLへ埋め込む文字列をescapeする。 @param {unknown} value 表示値。 @returns {string} escape済み文字列。 */
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }

    /** ISO日時をlocal表記へ変換する。 @param {string|null|undefined} value ISO日時。 @returns {string} 表示日時。 */
    function formatDate(value) {
      return value ? new Intl.DateTimeFormat('ja-JP', {dateStyle:'short', timeStyle:'medium'}).format(new Date(value)) : '-';
    }

    /** sourceの最新ingest runを取得する。 @param {string} name source名。 @param {Array<object>} runs run一覧。 @returns {object|undefined} 最新run。 */
    function latestRun(name, runs) {
      return runs.find(run => run.job_key === `ingest:${name}`);
    }

    /** run detailを短い集計表示へ変換する。 @param {object|undefined} run run情報。 @returns {string} 集計文字列。 */
    function runDetail(run) {
      if (!run?.detail) return '実行履歴なし';
      if (run.status === 'failed') return escapeHtml(run.detail.error || '同期に失敗');
      return `new ${run.detail.new ?? 0} / updated ${run.detail.updated ?? 0} / unchanged ${run.detail.unchanged ?? 0}`;
    }

    /** run状態に対応するbadge classを返す。 @param {string} status run状態。 @returns {string} Tabler badge class。 */
    function statusClass(status) {
      return {succeeded:'bg-green-lt', failed:'bg-red-lt', running:'bg-blue-lt'}[status] || 'bg-yellow-lt';
    }

    /** API responseからdashboard全体を描画する。 @param {Array<object>} sources source状態。 @param {Array<object>} runs run履歴。 @param {object} health job状態。 @returns {void} */
    function renderDashboard(sources, runs, health) {
      const jobs = health.jobs || {};
      document.getElementById('source-count').textContent = sources.length;
      document.getElementById('enabled-count').textContent = sources.filter(source => source.enabled).length;
      document.getElementById('running-count').textContent = sources.filter(source => jobs[`ingest:${source.name}`]?.running).length;
      document.getElementById('document-count').textContent = sources.reduce((sum, source) => sum + source.documents, 0);
      document.getElementById('updated-at').textContent = `更新: ${formatDate(new Date().toISOString())}`;
      document.getElementById('source-rows').innerHTML = sources.map(source => {
        const run = latestRun(source.name, runs);
        const isRunning = jobs[`ingest:${source.name}`]?.running || run?.status === 'running' || busySources.has(source.name);
        const result = isRunning ? 'running' : (run?.status || 'unknown');
        return `<tr>
          <td><div class="fw-bold">${escapeHtml(source.name)}</div><div class="checkpoint text-secondary text-truncate" title="${escapeHtml(source.checkpoint || '')}">${escapeHtml(source.checkpoint || 'checkpoint: none')}</div></td>
          <td><span class="badge ${source.enabled ? 'bg-green-lt' : 'bg-secondary-lt'}">${source.enabled ? 'enabled' : 'disabled'}</span></td>
          <td>${source.documents}</td>
          <td><div>${formatDate(run?.finished_at || run?.started_at)}</div><div class="text-secondary small">${runDetail(run)}</div></td>
          <td><span class="badge ${statusClass(result)}">${result}</span></td>
          <td class="text-end"><button class="btn btn-primary btn-sm" data-source="${escapeHtml(source.name)}" aria-busy="${isRunning}" ${source.enabled && !isRunning ? '' : 'disabled'}><span class="sync-icon" aria-hidden="true">&#8635;</span> ${isRunning ? '同期中' : '同期'}</button></td>
        </tr>`;
      }).join('');
    }

    /** API接続状態を表示する。 @param {boolean} connected 接続可否。 @param {string} message 表示メッセージ。 @returns {void} */
    function showConnection(connected, message) {
      const state = document.getElementById('api-state');
      state.className = `badge ${connected ? 'bg-green-lt' : 'bg-red-lt'}`;
      state.textContent = connected ? 'API connected' : 'API unavailable';
      const notice = document.getElementById('notice');
      notice.textContent = message;
      notice.classList.toggle('d-none', connected || !message);
    }

    /** APIから最新状態を取得する。 @returns {Promise<void>} 描画完了時にresolveするPromise。 */
    async function loadDashboard() {
      try {
        const responses = await Promise.all([fetch('/sources'), fetch('/runs?limit=200'), fetch('/health')]);
        if (responses.some(response => !response.ok)) throw new Error('状態APIの取得に失敗しました');
        const [sources, runs, health] = await Promise.all(responses.map(response => response.json()));
        renderDashboard(sources, runs, health);
        showConnection(true, '');
      } catch (error) {
        showConnection(false, error instanceof Error ? error.message : String(error));
      }
    }

    /** 指定sourceのmanual ingestを送信する。 @param {string} source source名。 @returns {Promise<void>} 受付処理完了時にresolveするPromise。 */
    async function triggerSync(source) {
      busySources.add(source);
      await loadDashboard();
      try {
        const response = await fetch(`/ingest/${encodeURIComponent(source)}`, {method: 'POST'});
        if (!response.ok) throw new Error((await response.json()).detail || '同期を開始できませんでした');
      } catch (error) {
        showConnection(false, error instanceof Error ? error.message : String(error));
      } finally {
        window.setTimeout(() => { busySources.delete(source); void loadDashboard(); }, 700);
      }
    }

    /** source actionのclickを処理する。 @param {MouseEvent} event click event。 @returns {void} */
    function handleAction(event) {
      const button = event.target.closest('button[data-source]');
      if (button && !button.disabled) void triggerSync(button.dataset.source);
    }

    document.addEventListener('click', handleAction);
    window.setInterval(loadDashboard, 5000);
    void loadDashboard();
  </script>
</body>
</html>
