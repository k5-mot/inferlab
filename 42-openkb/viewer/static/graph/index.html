<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKB Knowledge Graph</title>
    <link rel="stylesheet" href="./graph.css" />
  </head>
  <body>
    <main class="graph-shell">
      <header class="toolbar">
        <div class="identity">
          <strong>Knowledge Graph</strong>
          <span id="counts">0 articles / 0 links</span>
        </div>
        <div class="actions">
          <label class="search-box" for="search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="search" type="search" placeholder="記事を検索" autocomplete="off" />
          </label>
          <button id="fit" type="button" title="全体を表示" aria-label="全体を表示">
            <i data-lucide="maximize-2" aria-hidden="true"></i>
          </button>
          <button id="relayout" type="button" title="配置を再計算" aria-label="配置を再計算">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </button>
        </div>
      </header>
      <section class="workspace" aria-label="Knowledge graph">
        <aside id="legend" class="legend" aria-label="カテゴリ"></aside>
        <div id="graph-canvas" class="graph-canvas"></div>
        <aside id="details" class="details" aria-live="polite">
          <button id="close-details" type="button" title="詳細を閉じる" aria-label="詳細を閉じる">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
          <span id="detail-category" class="detail-category"></span>
          <h2 id="detail-title"></h2>
          <p id="detail-description"></p>
          <a id="detail-link" href="#" target="_top">
            記事を開く
            <i data-lucide="external-link" aria-hidden="true"></i>
          </a>
        </aside>
      </section>
    </main>
    <script src="./graph-data.js"></script>
    <script type="module" src="./graph.js"></script>
  </body>
</html>
