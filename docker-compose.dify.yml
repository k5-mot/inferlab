x-dify-service-env: &dify-service-env
  CONSOLE_API_URL: ${DIFY_CONSOLE_API_URL:-http://localhost:31002/console/api}
  CONSOLE_WEB_URL: ${DIFY_CONSOLE_WEB_URL:-http://localhost:31002}
  SERVICE_API_URL: ${DIFY_SERVICE_API_URL:-http://localhost:31002/api}
  TRIGGER_URL: ${DIFY_TRIGGER_URL:-http://localhost:31002}
  APP_API_URL: ${DIFY_APP_API_URL:-http://localhost:31002/api}
  APP_WEB_URL: ${DIFY_APP_WEB_URL:-http://localhost:31002}
  FILES_URL: ${DIFY_FILES_URL:-http://localhost:31002/files}
  INTERNAL_FILES_URL: http://dify-api:5001/files
  ENDPOINT_URL_TEMPLATE: ${DIFY_ENDPOINT_URL_TEMPLATE:-http://localhost:31002/e/{hook_id}}
  SECRET_KEY: ${DIFY_SECRET_KEY:-worklab-alfa-dify-secret-key}
  DB_PASSWORD: ${DIFY_POSTGRES_PASSWORD:-difyai123456}
  REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
  CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
  WEAVIATE_API_KEY: ${DIFY_WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
  CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
  SANDBOX_API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
  PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
  PLUGIN_DIFY_INNER_API_KEY: ${DIFY_PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}

services:
  dify-init-permissions:
    container_name: worklab-alfa-llm-dify-init-permissions
    restart: "no"
    profiles:
      - dify
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify-app-storage:/app/api/storage
    networks:
      - llm-internal

  dify-api:
    container_name: worklab-alfa-llm-dify-api
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-api:1.10.1
    env_file:
      - ./dify/dify.env
    environment:
      <<: *dify-service-env
      MODE: api
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-db-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
      dify-weaviate:
        condition: service_healthy
      dify-ssrf-proxy:
        condition: service_started
    volumes:
      - dify-app-storage:/app/api/storage
    networks:
      - llm-internal
      - llm-dify-ssrf

  dify-worker:
    container_name: worklab-alfa-llm-dify-worker
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-api:1.10.1
    env_file:
      - ./dify/dify.env
    environment:
      <<: *dify-service-env
      MODE: worker
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-db-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
      dify-weaviate:
        condition: service_healthy
      dify-ssrf-proxy:
        condition: service_started
    volumes:
      - dify-app-storage:/app/api/storage
    networks:
      - llm-internal
      - llm-dify-ssrf

  dify-worker-beat:
    container_name: worklab-alfa-llm-dify-worker-beat
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-api:1.10.1
    env_file:
      - ./dify/dify.env
    environment:
      <<: *dify-service-env
      MODE: beat
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      dify-db-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
      dify-weaviate:
        condition: service_healthy
      dify-ssrf-proxy:
        condition: service_started
    networks:
      - llm-internal
      - llm-dify-ssrf

  dify-web:
    container_name: worklab-alfa-llm-dify-web
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-web:1.10.1
    env_file:
      - ./dify/dify.env
    environment:
      <<: *dify-service-env
    depends_on:
      dify-api:
        condition: service_started
    networks:
      - llm-internal

  dify-plugin-daemon:
    container_name: worklab-alfa-llm-dify-plugin-daemon
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-plugin-daemon:0.4.1-local
    env_file:
      - ./dify/dify.env
    environment:
      <<: *dify-service-env
      DB_DATABASE: dify_plugin
      SERVER_PORT: 5002
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${DIFY_PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    depends_on:
      dify-db-postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    volumes:
      - dify-plugin-storage:/app/storage
    networks:
      - llm-internal

  dify-sandbox:
    container_name: worklab-alfa-llm-dify-sandbox
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${DIFY_SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://dify-ssrf-proxy:3128
      HTTPS_PROXY: http://dify-ssrf-proxy:3128
      SANDBOX_PORT: 8194
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8194/health
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-dify-ssrf

  dify-db-postgres:
    container_name: worklab-alfa-llm-dify-db-postgres
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DIFY_POSTGRES_PASSWORD:-difyai123456}
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
               -c 'statement_timeout=0'
               -c 'idle_in_transaction_session_timeout=0'
    volumes:
      - dify-postgres-data:/var/lib/postgresql/data
      - ./dify/postgres/init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - localhost
        - -U
        - postgres
        - -d
        - dify
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-internal

  dify-redis:
    container_name: worklab-alfa-llm-dify-redis
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/redis:6-alpine
    environment:
      REDISCLI_AUTH: ${DIFY_REDIS_PASSWORD:-difyai123456}
    command:
      - redis-server
      - --requirepass
      - ${DIFY_REDIS_PASSWORD:-difyai123456}
    volumes:
      - dify-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDISCLI_AUTH}" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-internal

  dify-weaviate:
    container_name: worklab-alfa-llm-dify-weaviate
    restart: unless-stopped
    profiles:
      - dify
    image: docker.io/semitechnologies/weaviate:1.27.0
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${DIFY_WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
      DISABLE_TELEMETRY: "false"
    volumes:
      - dify-weaviate-data:/var/lib/weaviate
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:8080/v1/.well-known/ready
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - llm-internal

  dify-ssrf-proxy:
    container_name: worklab-alfa-llm-dify-ssrf-proxy
    restart: unless-stopped
    profiles:
      - dify
    image: ubuntu/squid:5.2-22.04_beta
    entrypoint:
      - sh
      - -c
      - cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      REVERSE_PROXY_PORT: 8194
      SANDBOX_HOST: dify-sandbox
      SANDBOX_PORT: 8194
    volumes:
      - ./dify/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./dify/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    networks:
      - llm-internal
      - llm-dify-ssrf

  dify:
    container_name: worklab-alfa-llm-dify
    restart: unless-stopped
    profiles:
      - dify
    image: nginx:1.29.1
    depends_on:
      dify-api:
        condition: service_started
      dify-web:
        condition: service_started
      dify-plugin-daemon:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh
    environment:
      NGINX_SERVER_NAME: _
      NGINX_HTTPS_ENABLED: "false"
      NGINX_SSL_PORT: 443
      NGINX_PORT: 80
      NGINX_SSL_CERT_FILENAME: dify.crt
      NGINX_SSL_CERT_KEY_FILENAME: dify.key
      NGINX_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      NGINX_WORKER_PROCESSES: auto
      NGINX_CLIENT_MAX_BODY_SIZE: 100M
      NGINX_KEEPALIVE_TIMEOUT: 65
      NGINX_PROXY_READ_TIMEOUT: 3600s
      NGINX_PROXY_SEND_TIMEOUT: 3600s
      NGINX_ENABLE_CERTBOT_CHALLENGE: "false"
      CERTBOT_DOMAIN: ""
    volumes:
      - ./dify/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./dify/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./dify/nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - ./dify/nginx/conf.d:/etc/nginx/conf.d
      - ./dify/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    networks:
      - llm-internal

volumes:
  dify-app-storage:
  dify-postgres-data:
  dify-redis-data:
  dify-plugin-storage:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-weaviate-data:

networks:
  llm-internal:
  llm-dify-ssrf:
