  #     PERSIST_DIRECTORY: /data
  #   volumes:
  #     - chroma-data:/data
  #   networks:
  #     - llm-internal

  open-webui-pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: inferlab-open-webui-pipelines
    restart: unless-stopped
    profiles:
      - openwebui
    environment:
      PIPELINES_API_KEY: ${OPEN_WEBUI_PIPELINES_API_KEY:-0p3n-w3bu!}
    volumes:
      - open-webui-pipelines-data:/app/pipelines
    networks:
      - llm-internal

