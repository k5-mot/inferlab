services:
  litellm:
    image: docker.io/litellm/litellm:v1.83.3-stable
    container_name: inferlab-litellm
    restart: unless-stopped
    profiles:
      - inference-vllm
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-langfuse-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-langfuse-secret-key}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse:3000/api/public/otel}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal

  vllm-gemma4-e4b:
    image: docker.io/vllm/vllm-openai:v0.19.1
    container_name: inferlab-vllm-gemma4-e4b
    restart: unless-stopped
    # shm_size: 16gb
    profiles:
      - inference-vllm
    command:
      - "google/gemma-4-E4B-it"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "auto"
      - --dtype
      - "bfloat16"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.5"
      - --chat-template
      - "chat_template.jinja"
      - --enable-auto-tool-choice
      - "true"
      - --tool-call-parser
      - "gemma4"
      - --reasoning-parser
      - "gemma4"
      - --served-model-name
      - "gemma4:e4b"
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  # vllm-gemma4-31b:
