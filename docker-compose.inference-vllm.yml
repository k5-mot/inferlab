      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "embed"
      - --dtype
      - "bfloat16"
      # - --gpu-memory-utilization
      # - "0.05"
      - --served-model-name
      - "Qwen3-Embedding:0.6b"
    volumes:
      - vllm-cache:/root/.cache
    networks:
