  vllm-ruri-v3-310m:
    image: docker.io/vllm/vllm-openai:v0.19.1
    container_name: inferlab-vllm-ruri-v3-310m
    restart: unless-stopped
    # shm_size: 8gb
    profiles:
      - inference-vllm
    command:
      - "cl-nagoya/ruri-v3-310m"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "embed"
      - --dtype
      - "float32"
      - --gpu-memory-utilization
      - "0.05"
      - --served-model-name
      - "ruri-v3:310m"
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  vllm-ruri-v3-reranker-310m:
    image: docker.io/vllm/vllm-openai:v0.19.1
    container_name: inferlab-vllm-ruri-v3-reranker-310m
    restart: unless-stopped
    # shm_size: 8gb
    profiles:
      - inference-vllm
      - inference
    command:
      - "cl-nagoya/ruri-v3-reranker-310m"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "classify"
      - --dtype
      - "float32"
      - --gpu-memory-utilization
      - "0.05"
      - --served-model-name
      - "ruri-v3-reranker:310m"
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

volumes:
  vllm-cache:

networks:
  llm-public:
  llm-internal:
