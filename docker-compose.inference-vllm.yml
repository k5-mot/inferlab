services:
  litellm:
    image: docker.io/litellm/litellm:v1.83.3-stable
    container_name: inferlab-litellm
    restart: unless-stopped
    profiles:
      - inference-vllm
    command:
      - --config
      - /app/config-vllm.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-langfuse-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-langfuse-secret-key}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse:3000/api/public/otel}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config-vllm.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal

  vllm-gemma4-e4b:
    image: docker.io/vllm/vllm-openai:v0.19.1
    container_name: inferlab-vllm-gemma4-e4b
    restart: unless-stopped
    # shm_size: 16gb
    profiles:
      - inference-vllm
    # environment:
    #   VLLM_API_KEY: ${VLLM_API_KEY:-sk-vllm-api-key}
    command:
      # - "google/gemma-4-E4B-it"
      # - "google/gemma-4-26B-A4B-it"
      - "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
      # - "google/gemma-4-31B-it"
      # - "cyankiwi/gemma-4-31B-it-AWQ-4bit"
      # - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
      # - "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
      # - "Qwen/Qwen3-Coder-Next"
      # - "cyankiwi/Qwen3-Coder-Next-AWQ-4bit"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --api-key
      - "${VLLM_API_KEY}"
      - --convert
      - "auto"
      - --dtype
      # - "bfloat16"
      - "half"
      - --quantization
      # - "fp8"
      - "awq"
      - --kv-cache-dtype
      - "fp8"
      - --max-model-len
      - "32768"
      - --max-num-batched-tokens
      - "32768"
      # - "131072"
      - --gpu-memory-utilization
      - "0.92"
      - --max-num-seqs
      # - "2"
      - "4"
      - --chat-template
      - "chat_template.jinja"
      - --enable-auto-tool-choice
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --tool-call-parser
      - "gemma4"
      - --reasoning-parser
      - "gemma4"
      - --served-model-name
      - "gemma4:e4b"
      # - --limit-mm-per-prompt
      # - '{"image":0,"audio":0}'
      # Context Window: 32768, 28672〜30000
      # Context Window: 28672
      # Max Output Tokens: 4096〜8192
      # Max Output Tokens: 4096
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  # vllm-gemma4-31b:
  #   image: docker.io/vllm/vllm-openai:v0.19.1
  #   container_name: inferlab-vllm-gemma4-31b
  #   restart: unless-stopped
  #   shm_size: 16gb
  #   profiles:
  #     - inference-vllm
  #   command:
  #     - "google/gemma-4-31B-it"
  #     - --host
  #     - "0.0.0.0"
  #     - --port
  #     - "8000"
  #     - --convert
  #     - "auto"
  #     - --dtype
  #     - "bfloat16"
  #     - --max-model-len
  #     - "32768"
  #     - --gpu-memory-utilization
  #     - "0.5"
  #     - --chat-template
  #     - "chat_template.jinja"
  #     - --enable-auto-tool-choice
  #     - "true"
  #     - --tool-call-parser
  #     - "gemma4"
  #     - --reasoning-parser
  #     - "gemma4"
  #     - --served-model-name
  #     - "gemma4:31b"
  #   volumes:
  #     - vllm-cache:/root/.cache
  #   networks:
  #     - llm-internal

  vllm-ruri-v3-310m:
    image: docker.io/vllm/vllm-openai-cpu:v0.19.1
    container_name: inferlab-vllm-ruri-v3-310m
    restart: unless-stopped
    # shm_size: 8gb
    profiles:
      - inference-vllm
    command:
      - "cl-nagoya/ruri-v3-310m"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --convert
      - "embed"
      - --dtype
      - "float32"
      # - --gpu-memory-utilization
      # - "0.05"
      - --served-model-name
      - "ruri-v3:310m"
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  vllm-ruri-v3-reranker-310m:
