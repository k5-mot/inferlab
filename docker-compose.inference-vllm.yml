      - --dtype
      - "float32"
      # - --gpu-memory-utilization
      # - "0.05"
      - --served-model-name
      - "ruri-v3-reranker:310m"
    volumes:
      - vllm-cache:/root/.cache
    networks:
      - llm-internal

  vllm-qwen3-embedding-06b:
    image: docker.io/vllm/vllm-openai-cpu:v0.19.1
    container_name: inferlab-vllm-qwen3-embedding-06b
