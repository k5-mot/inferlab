services:
  # https://hub.docker.com/r/litellm/litellm
  # https://hub.docker.com/hardened-images/catalog/dhi/litellm
  # https://docs.litellm.ai/blog/vllm-embeddings-incident
  litellm:
    image: docker.io/litellm/litellm:1.92.0
    container_name: litellm
    restart: unless-stopped
    profiles:
      - inference-ollama
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config-ollama.yaml:/app/config.yaml:ro
    networks:
      - llm-public
      - llm-internal
      # depends_on:
      # ollama:
      #   condition: service_healthy
      # vllm-embedding:
      #   condition: service_healthy
      # vllm-reranking:
      #   condition: service_healthy
      # ulimits:
      #   nofile:
      #     soft: 65535
      #     hard: 65535
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit() if requests.get('http://localhost:4000/health/readiness').status_code == 200 else exit(1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: docker.io/ollama/ollama:0.31.2
    container_name: ollama
    restart: unless-stopped
    profiles:
      - inference-ollama
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-sk-ollama-api-key}"
    ports:
      - 11434:11434
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - llm-internal
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama list > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

  ollama-init:
    image: docker.io/ollama/ollama:0.31.2
    container_name: ollama-init
    restart: no
    profiles:
      - inference-ollama
    tty: true
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_INIT_MODELS=${OLLAMA_INIT_MODELS:-gemma4:e4b gemma4:31b-cloud gpt-oss:120b-cloud minimax-m2.7:cloud qwen3.5:397b-cloud glm-5.1:cloud kimi-k2.6:cloud deepseek-v4-flash:cloud deepseek-v4-pro:cloud gemini-3-flash-preview:cloud qwen3-coder-next:cloud nomic-embed-text-v2-moe}
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - llm-internal
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - >-
        ollama serve & OLLAMA_PID=$$!; until ollama list > /dev/null 2>&1; do
          echo 'Waiting for Ollama to be ready...';
          sleep 1;
        done; echo 'Ollama is ready. Importing models sequentially...'; for model in $${OLLAMA_INIT_MODELS}; do
          echo "Pulling $$model...";
          ollama pull "$$model";
        done; echo 'All models pulled.'; kill "$$OLLAMA_PID"

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: tei-embedding
    restart: unless-stopped
    profiles:
      - inference-ollama
    command:
      - --model-id
      - cl-nagoya/ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "512"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "16"
      - --tokenization-workers
      - "2"
    volumes:
      - tei-cache:/data
    networks:
      - llm-internal
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s

  tei-reranking:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: tei-reranking
    restart: unless-stopped
    profiles:
      - inference-ollama
    command:
      - --model-id
      - cl-nagoya/ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "512"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "16"
      - --tokenization-workers
      - "2"
    volumes:
      - tei-cache:/data
    networks:
      - llm-internal
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
