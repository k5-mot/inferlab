services:
  litellm:
    image: docker.io/litellm/litellm:1.92.0
    container_name: litellm
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
    ports:
      - "${LITELLM_HOST_PORT:-40000}:4000"
    volumes:
      - ./litellm/config-ollama.yaml:/app/config.yaml:ro
    networks:
      - internalnw

  ollama:
    image: docker.io/ollama/ollama:0.31.2
    container_name: ollama
    restart: unless-stopped
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-sk-ollama-api-key}
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internalnw

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    container_name: tei-embedding
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
    volumes:
      - tei-cache:/data
    networks:
      - internalnw

  tei-reranking:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    container_name: tei-reranking
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
    volumes:
      - tei-cache:/data
    networks:
      - internalnw

volumes:
  ollama-cache:
  tei-cache:

networks:
  internalnw:
