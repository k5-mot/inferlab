x-oauth2-proxy-env: &oauth2-proxy-env
  OAUTH2_PROXY_PROVIDER: keycloak-oidc
  OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
  OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:30000/realms/worklab}
  OAUTH2_PROXY_LOGIN_URL: ${KEYCLOAK_LOGIN_URL:-http://localhost:30000/realms/worklab/protocol/openid-connect/auth}
  OAUTH2_PROXY_REDEEM_URL: ${KEYCLOAK_INTERNAL_TOKEN_URL:-http://keycloak:8080/realms/worklab/protocol/openid-connect/token}
  OAUTH2_PROXY_OIDC_JWKS_URL: ${KEYCLOAK_INTERNAL_JWKS_URL:-http://keycloak:8080/realms/worklab/protocol/openid-connect/certs}
  OAUTH2_PROXY_SCOPE: openid email profile groups
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_COOKIE_SECURE: "false"
  OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
  OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
  OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

x-oauth2-proxy-base: &oauth2-proxy-base
  restart: unless-stopped
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
  depends_on:
    keycloak:
      condition: service_started
  environment:
    <<: *oauth2-proxy-env
  networks:
    - llm-public
    - llm-internal

services:
  chroma:
    container_name: worklab-alfa-llm-chroma
    restart: unless-stopped
    image: docker.io/chromadb/chroma:1.5.8
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma-data:/data
    networks:
      - llm-internal

  open-webui-pipelines:
    container_name: worklab-alfa-llm-open-webui-pipelines
    restart: unless-stopped
    image: ghcr.io/open-webui/pipelines:main
    environment:
      PIPELINES_API_KEY: ${OPEN_WEBUI_PIPELINES_API_KEY:-0p3n-w3bu!}
    volumes:
      - open-webui-pipelines-data:/app/pipelines
    networks:
      - llm-internal

  docling-serve:
    container_name: worklab-alfa-llm-docling-serve
    restart: unless-stopped
    image: quay.io/docling-project/docling-serve:v1.16.1
    environment:
      DOCLING_SERVE_HOST: 0.0.0.0
      DOCLING_SERVE_PORT: 5001
      DOCLING_SERVE_ENABLE_UI: "true"
    volumes:
      - docling-serve-data:/data
    networks:
      - llm-internal

  searxng:
    container_name: worklab-alfa-llm-searxng
    restart: unless-stopped
    image: docker.io/searxng/searxng:2026.4.13-ee66b070a
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - llm-internal

  carbone:
    container_name: worklab-alfa-llm-carbone
    restart: unless-stopped
    image: docker.io/carbone/carbone-ee:full-5.4.5
    environment:
      LANG: C.UTF-8
      CARBONE_EE_BIND: 0.0.0.0
      CARBONE_EE_PORT: 4000
      CARBONE_EE_LICENSE: ${CARBONE_EE_LICENSE:-}
    volumes:
      - carbone-data:/app/data
      - carbone-templates:/app/template
      - carbone-renders:/app/render
    networks:
      - llm-internal

  oauth2-proxy-carbone:
    <<: *oauth2-proxy-base
    container_name: worklab-alfa-llm-oauth2-proxy-carbone
    depends_on:
      keycloak:
        condition: service_started
      carbone:
        condition: service_started
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CARBONE_CLIENT_ID:-carbone}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CARBONE_CLIENT_SECRET:-worklab-carbone-client-secret}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_CARBONE_REDIRECT_URL:-http://localhost:31005/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: http://carbone:4000/
    ports:
      - "${CARBONE_HOST_PORT:-31005}:4180"

  carbone-mcp:
    container_name: worklab-alfa-llm-carbone-mcp
    restart: unless-stopped
    image: docker.io/carbone/carbone-mcp:1.1.1
    environment:
      CARBONE_BASE_URL: http://carbone:4000
      MCP_TRANSPORT: http
      MCP_PORT: 3000
      MCP_PATH: /
    depends_on:
      carbone:
        condition: service_started
    networks:
      - llm-internal

  oauth2-proxy-carbone-mcp:
    <<: *oauth2-proxy-base
    container_name: worklab-alfa-llm-oauth2-proxy-carbone-mcp
    depends_on:
      keycloak:
        condition: service_started
      carbone-mcp:
        condition: service_started
    environment:
      <<: *oauth2-proxy-env
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CARBONE_MCP_CLIENT_ID:-carbone-mcp}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CARBONE_MCP_CLIENT_SECRET:-worklab-carbone-mcp-client-secret}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_CARBONE_MCP_REDIRECT_URL:-http://localhost:51001/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: http://carbone-mcp:3000/
    ports:
      - "${CARBONE_MCP_HOST_PORT:-51001}:4180"

volumes:
  chroma-data:
  open-webui-pipelines-data:
  docling-serve-data:
  carbone-data:
  carbone-templates:
  carbone-renders:

networks:
  llm-public:
  llm-internal:
