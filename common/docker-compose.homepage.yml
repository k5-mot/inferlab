services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    profiles:
      - common
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost,127.0.0.1,${PUBLIC_HOST:-localhost}}
    ports:
      - "${HOMEPAGE_HOST_PORT:-30002}:3000"
    volumes:
      - homepage-config:/app/config
    networks:
      - llm-public
      - llm-internal

volumes:
  homepage-config:

networks:
  llm-public:
  llm-internal:
