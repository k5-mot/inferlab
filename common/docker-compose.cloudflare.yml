services:
  cloudflare:
    image: docker.io/cloudflare/cloudflared:2026.7.1
    container_name: cloudflare
    restart: unless-stopped
    profiles:
      - cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - --protocol
      - http2
      - run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - internalnw
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  internalnw:
