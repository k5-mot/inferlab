[project]
name = "airgap-backend"
version = "0.1.0"
description = "Air-gap資材を検証するFastAPI application"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uv>=0.11.17,<0.12",
    "uvicorn>=0.52.0,<0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airgap_backend"]
