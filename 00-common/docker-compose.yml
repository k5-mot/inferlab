#
# 参考資料:
# - Homepage
#   - https://gethomepage.dev/installation/docker/
# - whoami
#   - https://hub.docker.com/r/traefik/whoami
#
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: ${STACK_NAME}-homepage
    restart: unless-stopped
    ports:
      - 30000:3000
    profiles:
      - common
    volumes:
      - ./homepage:/app/config # Make sure your local config directory exists
      - ./homepage/icons:/app/public/icons:ro # 外部アイコン取得を避ける設定でローカル配信する
      - ../docs/assets:/app/public/assets:ro # D2で生成した構成図をHomepageから参照する
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    networks:
      - internal-nw
    environment:
      # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      # HOMEPAGE_ALLOWED_HOSTS: gethomepage.dev
      HOMEPAGE_ALLOWED_HOSTS: "$PUBLIC_HOST:30000"
    labels:
      - homepage.group=00-common
      - homepage.name=Homepage
      - homepage.href=http://${PUBLIC_HOST}:30000
      - homepage.description=Dashboard
      - homepage.icon=/icons/homepage.png
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('http'); const req=http.get('http://127.0.0.1:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => req.destroy());"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  whoami:
    image: docker.io/traefik/whoami:${WHOAMI_IMAGE_TAG:-v1.11}
    container_name: ${STACK_NAME}-whoami
    restart: unless-stopped
    profiles:
      - common
    ports:
      - ${WHOAMI_HTTP_HOST_PORT:-30003}:80
    networks:
      - internal-nw
    labels:
      - homepage.group=00-common
      - homepage.name=whoami
      - homepage.href=http://${PUBLIC_HOST}:${WHOAMI_HTTP_HOST_PORT:-30003}
      - homepage.description=HTTP request echo endpoint
      - homepage.icon=/icons/traefik.png
    healthcheck:
      test: [ "CMD", "/whoami", "--help" ]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  internal-nw:
