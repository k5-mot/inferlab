services:
  plane-web:
    image: docker.io/makeplane/plane-frontend:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-web
    restart: unless-stopped
    profiles:
      - team-project
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://${PUBLIC_HOST}:32001
    networks:
      - internal-nw
    depends_on:
      plane-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Web
      - homepage.description=Project management tool

  plane-space:
    image: docker.io/makeplane/plane-space:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-space
    restart: unless-stopped
    profiles:
      - team-project
    networks:
      - internal-nw
    depends_on:
      plane-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Space
      - homepage.description=Project management tool

  plane-admin:
    image: docker.io/makeplane/plane-admin:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-admin
    restart: unless-stopped
    profiles:
      - team-project
    networks:
      - internal-nw
    depends_on:
      plane-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Admin
      - homepage.description=Project management tool

  plane-api:
    image: docker.io/makeplane/plane-backend:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-api
    restart: unless-stopped
    profiles:
      - team-project
    command:
      - ./bin/docker-entrypoint-api.sh
    environment: &plane-backend-env
      WEB_URL: http://${PUBLIC_HOST}:32001
      DEBUG: "0"
      DJANGO_SETTINGS_MODULE: plane.settings.production
      SECRET_KEY: sk-plane-secret-key
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane_password
      POSTGRES_DB: plane
      POSTGRES_HOST: plane-postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/0
      RABBITMQ_HOST: plane-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane_password
      RABBITMQ_VHOST: plane
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: plane
      AWS_SECRET_ACCESS_KEY: plane_password
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: 5242880
    networks:
      - internal-nw
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-rabbitmq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-API
      - homepage.description=Project management tool

  plane-worker:
    image: docker.io/makeplane/plane-backend:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-worker
    restart: unless-stopped
    profiles:
      - team-project
    command:
      - ./bin/docker-entrypoint-worker.sh
    environment: *plane-backend-env
    networks:
      - internal-nw
    depends_on:
      plane-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os; raise SystemExit(0 if os.path.exists('/proc/1') else 1)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Worker
      - homepage.description=Project management tool

  plane-beat-worker:
    image: docker.io/makeplane/plane-backend:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-beat-worker
    restart: unless-stopped
    profiles:
      - team-project
    command:
      - ./bin/docker-entrypoint-beat.sh
    environment: *plane-backend-env
    networks:
      - internal-nw
    depends_on:
      plane-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os; raise SystemExit(0 if os.path.exists('/proc/1') else 1)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Beat-Worker
      - homepage.description=Project management tool

  plane-migrator:
    image: docker.io/makeplane/plane-backend:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-migrator
    restart: "no"
    profiles:
      - team-project
    command:
      - ./bin/docker-entrypoint-migrator.sh
    environment: *plane-backend-env
    networks:
      - internal-nw
    depends_on:
      plane-postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "raise SystemExit(0)"
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 5s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Migrator
      - homepage.description=Project management tool

  plane-live:
    image: docker.io/makeplane/plane-live:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-live
    restart: unless-stopped
    profiles:
      - team-project
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const net=require('net'); const s=net.createConnection(3000,'127.0.0.1'); s.on('connect',()=>process.exit(0)); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Live
      - homepage.description=Project management tool

  plane-proxy:
    image: docker.io/makeplane/plane-proxy:v1.3.1
    container_name: ${STACK_NAME:-inferlab}-plane-proxy
    restart: unless-stopped
    profiles:
      - team-project
    environment:
      FILE_SIZE_LIMIT: 5242880
      BUCKET_NAME: uploads
    ports:
      - 32001:80
    networks:
      - internal-nw
    depends_on:
      plane-web:
        condition: service_healthy
      plane-api:
        condition: service_healthy
      plane-space:
        condition: service_healthy
      plane-admin:
        condition: service_healthy
      plane-live:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/plane.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane
      - homepage.href=http://${PUBLIC_HOST}:32001
      - homepage.description=Project management tool

  plane-postgres:
    image: docker.io/library/postgres:15.7-alpine
    container_name: ${STACK_NAME:-inferlab}-plane-postgres
    restart: unless-stopped
    profiles:
      - team-project
    command:
      - postgres
      - -c
      - max_connections=1000
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane_password
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    volumes:
      - plane-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U plane -d plane
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/postgres.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Postgres
      - homepage.description=Relational database

  plane-redis:
    image: docker.io/valkey/valkey:7.2.11-alpine
    container_name: ${STACK_NAME:-inferlab}-plane-redis
    restart: unless-stopped
    profiles:
      - team-project
    volumes:
      - plane-redis-data:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/redis.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-Redis
      - homepage.description=Inmemory key-value NoSQL database

  plane-rabbitmq:
    image: docker.io/library/rabbitmq:3.13.6-management-alpine
    container_name: ${STACK_NAME:-inferlab}-plane-rabbitmq
    restart: unless-stopped
    profiles:
      - team-project
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane_password
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - plane-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/rabbitmq.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-RabbitMQ
      - homepage.description=Reliable multi-protocol message broker

  plane-minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${STACK_NAME:-inferlab}-plane-minio
    restart: unless-stopped
    profiles:
      - team-project
    command:
      - server
      - /export
      - --console-address
      - :9090
    environment:
      MINIO_ROOT_USER: plane
      MINIO_ROOT_PASSWORD: plane_password
      MINIO_UPDATE: "off"
    volumes:
      - plane-uploads:/export
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    label_file:
      - ../00-common/homepage/icon-labels/${AIRGAP:-false}/minio.labels
    labels:
      - homepage.group=21-team-project
      - homepage.name=Plane-MinIO
      - homepage.description=S3-compatible object storage

volumes:
  plane-postgres-data:
  plane-redis-data:
  plane-rabbitmq-data:
  plane-uploads:

networks:
  internal-nw:
