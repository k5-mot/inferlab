#
# keycloak-config-cli configuration
#
# 管理対象:
# - inferlab realm
# - realm users
# - groups
# - OIDC clients
#
# 環境変数はkeycloak-config-cliのvariable substitutionで展開する。
# docker-compose.yml側で以下を有効化すること。
#
# IMPORT_VARSUBSTITUTION_ENABLED: "true"
# IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
#

realm: "$(env:STACK_NAME)"
enabled: true
displayName: "$(env:STACK_NAME)"

registrationAllowed: false
resetPasswordAllowed: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false

groups:
  - name: admins
    path: /admins

  - name: guests
    path: /guests

  - name: users
    path: /users

users:
  - username: admin
    enabled: true
    firstName: admin
    lastName: admin
    email: admin@admin.com
    emailVerified: true

    groups:
      - /admins
      - /users

    credentials:
      - type: password
        value: "$(env:KEYCLOAK_REALM_ADMIN_PASSWORD)"
        temporary: false

clients:
  #
  # Open WebUI
  #
  - clientId: open-webui
    name: Open WebUI
    enabled: true
    protocol: openid-connect

    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(env:OPEN_WEBUI_OIDC_CLIENT_SECRET)"

    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

    rootUrl: "http://$(env:PUBLIC_HOST):$(env:OPEN_WEBUI_HTTP_HOST_PORT)/"

    redirectUris:
      - "http://localhost:$(env:OPEN_WEBUI_HTTP_HOST_PORT)/oauth/oidc/callback"
      - "http://127.0.0.1:$(env:OPEN_WEBUI_HTTP_HOST_PORT)/oauth/oidc/callback"
      - "http://$(env:PUBLIC_HOST):$(env:OPEN_WEBUI_HTTP_HOST_PORT)/oauth/oidc/callback"

    webOrigins:
      - "http://localhost:$(env:OPEN_WEBUI_HTTP_HOST_PORT)"
      - "http://127.0.0.1:$(env:OPEN_WEBUI_HTTP_HOST_PORT)"
      - "http://$(env:PUBLIC_HOST):$(env:OPEN_WEBUI_HTTP_HOST_PORT)"

    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false

        config:
          claim.name: groups
          full.path: "false"
          introspection.token.claim: "true"
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

