#
# keycloak-config-cli configuration
#
# 管理対象:
# - prod realm
# - realm users
# - groups
# - OIDC clients
#
# 環境変数はkeycloak-config-cliのvariable substitutionで展開する。
# docker-compose.yml側で以下を有効化すること。
#
# IMPORT_VARSUBSTITUTION_ENABLED: "true"
# IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
#

realm: "prod"
enabled: true
displayName: "$(env:STACK_NAME)"

registrationAllowed: false
resetPasswordAllowed: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false

groups:
  - name: admins
    path: /admins

  - name: guests
    path: /guests

  - name: users
    path: /users

users:
  - username: admin
    enabled: true
    firstName: admin
    lastName: admin
    email: admin@admin.com
    emailVerified: true

    groups:
      - /admins
      - /users

    credentials:
      - type: password
        value: "$(env:KEYCLOAK_REALM_ADMIN_PASSWORD)"
        temporary: false

clients:
  #
  # Open WebUI
  #
  - clientId: open-webui
    name: Open WebUI
    enabled: true
    protocol: openid-connect

    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(env:OPEN_WEBUI_OIDC_CLIENT_SECRET)"

    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

    rootUrl: "http://$(env:PUBLIC_HOST):32000/"

    redirectUris:
      - "http://localhost:32000/oauth/oidc/callback"
      - "http://127.0.0.1:32000/oauth/oidc/callback"
      - "http://$(env:PUBLIC_HOST):32000/oauth/oidc/callback"

    webOrigins:
      - "http://localhost:32000"
      - "http://127.0.0.1:32000"
      - "http://$(env:PUBLIC_HOST):32000"

    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false

        config:
          claim.name: groups
          full.path: "false"
          introspection.token.claim: "true"
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

  #
  # Langfuse
  #
  - clientId: langfuse
    name: Langfuse
    enabled: true
    protocol: openid-connect

    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "$(env:LANGFUSE_OIDC_CLIENT_SECRET)"

    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

    rootUrl: "http://$(env:PUBLIC_HOST):35100/"

    redirectUris:
      - "http://localhost:35100/api/auth/callback/keycloak"
      - "http://localhost:35100/*"
      - "http://127.0.0.1:35100/api/auth/callback/keycloak"
      - "http://127.0.0.1:35100/*"
      - "http://$(env:PUBLIC_HOST):35100/api/auth/callback/keycloak"
      - "http://$(env:PUBLIC_HOST):35100/*"

    webOrigins:
      - "http://localhost:35100"
      - "http://127.0.0.1:35100"
      - "http://$(env:PUBLIC_HOST):35100"

    protocolMappers:
