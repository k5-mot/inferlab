#
# 参考資料:
# - Keycloak
#   - https://www.keycloak.org/getting-started/getting-started-docker
#   - https://www.keycloak.org/server/supported-configurations
# - keycloak-config-cli
#   - https://adorsys.github.io/keycloak-config-cli/
#   - https://adorsys.github.io/keycloak-config-cli/compatibility/keycloak-versions/
#
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: ${STACK_NAME}-keycloak
    restart: unless-stopped
    profiles:
      - keycloak
    command:
      - start
      - --import-realm
    environment:
      # 全般.
      PUBLIC_HOST: ${PUBLIC_HOST}
      # ホスト名設定.
      KC_HOSTNAME: http://${PUBLIC_HOST}:30001
      # DB接続.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: kc_db_user
      KC_DB_PASSWORD: kc_db_password
      # master realmの初期管理者.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # TLS終端設定.
      KC_HTTP_ENABLED: "true"
      # KC_PROXY_HEADERS: xforwarded
      # ヘルスチェックエンドポイントの有効化.
      KC_HEALTH_ENABLED: "true"
      # Prometheus metricsを管理ポートで公開する。
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      # BookStack/ZulipのOIDC遷移でHTTP/2 header-list上限に当たるため拡張する。
      QUARKUS_HTTP_LIMITS_MAX_HEADER_SIZE: 512K
      QUARKUS_HTTP_LIMITS_MAX_HEADER_LIST_SIZE: "524288"
    ports:
      - 30001:8080
    volumes:
      # 初回起動時にprod realmだけを作成する。
      - ./keycloak/bootstrap-realm.json:/opt/keycloak/data/import/prod-realm.json:ro
    networks:
      - internal-nw
    depends_on:
      keycloak-postgres-compat:
        condition: service_completed_successfully
    healthcheck:
      # Realm設定の反映完了はkeycloak-configサービスの終了状態で管理する。
      test:
        - CMD-SHELL
        - timeout 3 sh -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    labels:
      - homepage.icon=/icons/keycloak.png
      - homepage.group=01-keycloak
      - homepage.name=Keycloak
      - homepage.href=http://${PUBLIC_HOST}:30001
      - homepage.description=Identity and Access Management

  keycloak-config:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26
    container_name: ${STACK_NAME}-keycloak-config
    restart: "no"
    profiles:
      - keycloak
    environment:
      # master realmの初期管理者を使ってKeycloak Admin APIへ接続する。
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_USER: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Keycloakの起動待ち.
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      # 宣言的設定ファイル.
      IMPORT_FILES_LOCATIONS: /config/config.yaml
      IMPORT_VALIDATE: "true"
      # config.yaml内の$(env:VARIABLE)を展開する。
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      PUBLIC_HOST: ${PUBLIC_HOST}
      STACK_NAME: ${STACK_NAME}
      # prod realmのadminユーザー.
      KEYCLOAK_REALM_ADMIN_PASSWORD: ${KEYCLOAK_REALM_ADMIN_PASSWORD:-admin}
      OPEN_WEBUI_OIDC_CLIENT_SECRET: ${OPEN_WEBUI_OIDC_CLIENT_SECRET:-open-webui-oauth-client-secret-key}
      DIFY_OIDC_CLIENT_SECRET: ${DIFY_OIDC_CLIENT_SECRET:-sk-dify-oidc-client-secret-key}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET:-sk-nextcloud-oidc-client-secret-key}
      LANGFUSE_OIDC_CLIENT_SECRET: ${LANGFUSE_OIDC_CLIENT_SECRET:-sk-langfuse-oidc-client-secret-key}
      BOOKSTACK_OIDC_CLIENT_SECRET: ${BOOKSTACK_OIDC_CLIENT_SECRET:-sk-bookstack-oidc-client-secret-key}
      KANEO_OIDC_CLIENT_SECRET: ${KANEO_OIDC_CLIENT_SECRET:-sk-kaneo-oidc-client-secret-key}
      ZULIP_OIDC_CLIENT_SECRET: ${ZULIP_OIDC_CLIENT_SECRET:-sk-zulip-oidc-client-secret-key}
      GITLAB_OIDC_CLIENT_SECRET: ${GITLAB_OIDC_CLIENT_SECRET:-sk-gitlab-oidc-client-secret-key}
      GRAFANA_OIDC_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-sk-grafana-oidc-client-secret-key}
    volumes:
      - ./keycloak/config.yaml:/config/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak-https:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: ${STACK_NAME}-keycloak-https
    restart: unless-stopped
    profiles:
      - keycloak
    command:
      - start
    environment:
      # ホスト名設定.
      KC_HOSTNAME: https://${PUBLIC_HOST}:30002
      # DB接続.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: kc_db_user
      KC_DB_PASSWORD: kc_db_password
      # 初期管理者.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # HTTPS終端設定.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
      # BookStack/ZulipのOIDC遷移でHTTP/2 header-list上限に当たるため拡張する。
      QUARKUS_HTTP_LIMITS_MAX_HEADER_SIZE: 512K
      QUARKUS_HTTP_LIMITS_MAX_HEADER_LIST_SIZE: "524288"
      # ヘルスチェックエンドポイントの有効化.
      KC_HEALTH_ENABLED: "true"
      # Prometheus metricsを管理ポートでHTTP公開する。
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
    ports:
      - 30002:8443
    volumes:
      - ./keycloak/certs:/opt/keycloak/certs:ro
    networks:
      - internal-nw
    depends_on:
      # config.yamlの適用が正常終了してからHTTPS側を起動する。
      keycloak-config:
        condition: service_completed_successfully
      keycloak-postgres-compat:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 3 sh -c 'exec 3<>/dev/tcp/127.0.0.1/8443'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/keycloak.png
      - homepage.group=01-keycloak
      - homepage.name=Keycloak HTTPS
      - homepage.href=https://${PUBLIC_HOST}:30002
      - homepage.description=HTTPS issuer for OIDC clients

  keycloak-postgres:
    image: docker.io/library/postgres:18.4-trixie
    container_name: ${STACK_NAME}-keycloak-postgres
    restart: unless-stopped
    profiles:
      - keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: kc_db_user
      POSTGRES_PASSWORD: kc_db_password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d keycloak_db
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.icon=/icons/postgresql.png
      - homepage.group=01-keycloak
      - homepage.name=Keycloak-Postgres
      - homepage.description=Relational database

  keycloak-postgres-compat:
    image: docker.io/library/postgres:18.4-trixie
    container_name: ${STACK_NAME}-keycloak-postgres-compat
    restart: "no"
    profiles:
      - keycloak
    entrypoint:
      - sh
      - -euc
    command:
      - |
        # 既存volumeが旧credentialで初期化済みの場合だけ、新しい固定credentialを追加する。
        if PGPASSWORD=kc_db_password psql -h keycloak-postgres -U kc_db_user -d keycloak_db -tAc 'SELECT 1' >/dev/null 2>&1; then
          echo "Keycloak PostgreSQL credential is already current."
          exit 0
        fi

        if ! PGPASSWORD=keycloak_password psql -h keycloak-postgres -U keycloak_user -d keycloak_db -tAc 'SELECT 1' >/dev/null 2>&1; then
          echo "Keycloak PostgreSQL credential migration failed: neither current nor legacy credential can connect." >&2
          exit 1
        fi

        if PGPASSWORD=keycloak_password psql -h keycloak-postgres -U keycloak_user -d keycloak_db -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'kc_db_user'" | grep -q '^1$'; then
          PGPASSWORD=keycloak_password psql -v ON_ERROR_STOP=1 -h keycloak-postgres -U keycloak_user -d keycloak_db \
            -c "ALTER ROLE kc_db_user WITH LOGIN PASSWORD 'kc_db_password';"
        else
          PGPASSWORD=keycloak_password psql -v ON_ERROR_STOP=1 -h keycloak-postgres -U keycloak_user -d keycloak_db \
            -c "CREATE ROLE kc_db_user LOGIN PASSWORD 'kc_db_password';"
        fi

        PGPASSWORD=keycloak_password psql -v ON_ERROR_STOP=1 -h keycloak-postgres -U keycloak_user -d keycloak_db \
          -c "ALTER DATABASE keycloak_db OWNER TO kc_db_user;" \
          -c "GRANT ALL PRIVILEGES ON DATABASE keycloak_db TO kc_db_user;" \
          -c "GRANT ALL PRIVILEGES ON SCHEMA public TO kc_db_user;" \
          -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO kc_db_user;" \
          -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO kc_db_user;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO kc_db_user;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO kc_db_user;"
    networks:
      - internal-nw
    depends_on:
      keycloak-postgres:
        condition: service_healthy

volumes:
  keycloak_postgres_data:

networks:
  internal-nw:
