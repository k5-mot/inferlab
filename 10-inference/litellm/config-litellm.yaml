general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  callbacks:
    - prometheus
    - langfuse_otel
  drop_params: true
  request_timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  # 同じ model_name 内で、失敗した deployment を除外して、別 provider を選び直す
  enable_weighted_failover: true
  # リトライ回数
  num_retries: 3
  # 1リクエスト内で試す failover の最大数
  max_fallbacks: 5
  # 壊れている provider を一時的に routing 対象外にする
  allowed_fails: 2
  cooldown_time: 30

model_list:
  ### Ollama
  - model_name: google/gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://ollama:11434
      tags: ["ollama", "foundation"]
      weight: 1
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false
  - model_name: openai/gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b-cloud
      api_base: http://ollama:11434
      tags: ["ollama", "foundation"]
      weight: 1
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false
  - model_name: nvidia/nemotron-3-nano:30b
    litellm_params:
      model: ollama_chat/nemotron-3-nano:30b-cloud
      api_base: http://ollama:11434
      tags: ["ollama", "foundation"]
      weight: 1
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false

