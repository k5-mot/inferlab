general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  callbacks:
    - prometheus
    - langfuse_otel
  drop_params: true
  request_timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3

model_list:
  ### Ollama; Cloud modelの認証はOllama daemon側のsignin状態を使う。
  ### tool callはOllama /api/chat routeで処理し、本文へのJSON漏れを避ける。
  - model_name: google/gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://ollama:11434
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false
  - model_name: openai/gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b-cloud
      api_base: http://ollama:11434
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false
  - model_name: nvidia/nemotron-3-nano:30b
    litellm_params:
      model: ollama_chat/nemotron-3-nano:30b-cloud
      api_base: http://ollama:11434
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false

  ### TEI; HuggingFace Text Embedding Inference
  - model_name: cl-nagoya/ruri-v3:310m
    litellm_params:
      model: openai/cl-nagoya/ruri-v3-310m
      api_base: http://tei-embedding:8000/v1
      api_key: EMPTY
      encoding_format: float
      max_parallel_requests: 1
  - model_name: cl-nagoya/ruri-v3-reranker:310m
    litellm_params:
      model: huggingface/cl-nagoya/ruri-v3-reranker-310m
      api_base: http://tei-reranking:8000
      api_key: EMPTY
      encoding_format: float
      max_parallel_requests: 1

  ### TTS
  - model_name: kokoro
    litellm_params:
      model: openai/kokoro
      api_base: http://kokoro:8880/v1
      api_key: not-needed
    model_info:
      mode: audio_speech
