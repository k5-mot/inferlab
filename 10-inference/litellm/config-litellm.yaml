general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  callbacks:
    - prometheus
    - langfuse_otel
  drop_params: true
  request_timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  enable_weighted_failover: true
  num_retries: 3
  max_fallbacks: 5
  allowed_fails: 2
  cooldown_time: 30

model_list:
  ### Ollama
  ### - https://openrouter.ai/google/gemma-4-31b-it
  ### - https://openrouter.ai/openai/gpt-oss-20b
  ### - https://openrouter.ai/nvidia/nemotron-3-nano-30b-a3b
  - model_name: google/gemma4:31b
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://ollama:11434
      tags: ["ollama", "foundation"]
      weight: 1
    model_info:
      supports_function_calling: true
      supports_parallel_function_calling: false
      input_cost_per_token:  0.00000009 # $0.09 / M tokens
      output_cost_per_token: 0.00000034 # $0.34 / M tokens
  - model_name: openai/gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b-cloud
      api_base: http://ollama:11434
      tags: ["ollama", "foundation"]
      weight: 1
