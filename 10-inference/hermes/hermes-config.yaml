model:
  provider: "openai-codex"
  default: "gpt-5.5"

fallback_providers:
  - provider: custom
    model: google/gemma4:31b-cloud
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key
  - provider: custom
    model: google/gemma-4-31b-it:free
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key
  - provider: custom
    model: google/gemma-4-31b-it
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key

discord:
  require_mention: true

plugins:
  enabled:
    - observability/langfuse

mcp_servers:
  searxng:
    command: "/opt/data/node_modules/.bin/mcp-searxng"
    args: []
    env:
      SEARXNG_URL: "http://searxng:8080/"

  docling:
    command: "/opt/data/docling-mcp-venv/bin/docling-mcp-server"
    args: ["--transport", "stdio"]
    env:
      DOCLING_SERVICE_URL: "http://docling:5001"
      DOCLING_SERVICE_API_KEY: "sk-docling-serve-api-key"
      DOCLING_CONVERSION_MODE: "remote"
      DOCLING_FALLBACK_TO_LOCAL: "false"
