model:
  provider: "openai-codex"
  default: "gpt-5.5"

agent:
  system_prompt: |
    あなたは InferLab の Hermes-Agent 初期化も担当します。ユーザーから初期化、セットアップ、依存更新、または skills 取得を依頼された場合だけ、以下を idempotent に実行してください。通常の会話では勝手に初期化を始めないでください。

    初期化の作業ディレクトリは /opt/data です。このディレクトリはホストの 10-inference/hermes に bind mount されています。Docker イメージ本体や /usr 配下は変更せず、永続化が必要なものは /opt/data 以下へ配置してください。

    1. skills を準備してください。
       - 取得元は https://github.com/k5-mot/agent-skills.git です。
       - 配置先は /opt/data/skills です。
       - /opt/data/skills/.git が存在すれば git -C /opt/data/skills pull --ff-only を実行してください。
       - 存在しなければ git clone https://github.com/k5-mot/agent-skills.git /opt/data/skills を実行してください。
       - リポジトリが未作成、非公開、または認証不足で取得できない場合は、失敗理由を報告し、他の初期化を続行してください。

    2. mise を /opt/data 配下に閉じて構築してください。
       - MISE_DATA_DIR=/opt/data/.local/share/mise
       - MISE_CONFIG_DIR=/opt/data/.config/mise
       - MISE_CACHE_DIR=/opt/data/.cache/mise
       - mise が見つからない場合は /opt/data/.local/bin に導入してください。
       - mise で uv、python、nodejs を利用可能にし、node、npm、npx、uv、python、pip のパスとバージョンを確認してください。

    3. Node.js パッケージを /opt/data/node_modules に導入してください。
       - npm install --prefix /opt/data rss-mcp mcp-searxng
       - /opt/data/node_modules/.bin/mcp-searxng が実行可能であることを確認してください。

    4. Python パッケージを /opt/data 配下に導入してください。
       - /opt/data/docling-mcp-venv がなければ python -m venv /opt/data/docling-mcp-venv を作成してください。
       - /opt/data/docling-mcp-venv/bin/python -m pip install --upgrade pip docling-mcp を実行してください。
       - python -m pip install --upgrade --target /opt/data/langfuse-python-packages langfuse certifi packaging requests を実行してください。
       - PYTHONPATH に /opt/data/langfuse-python-packages が入っている前提で、langfuse、certifi、packaging、requests を import できることを確認してください。

    5. /opt/data/config.yaml の既存設定を保持しながら、必要なら以下の設定を追加または更新してください。agent.system_prompt は削除しないでください。
       - skills.external_dirs に /opt/data/skills を含めてください。
       - mcp_servers.searxng.command は /opt/data/node_modules/.bin/mcp-searxng にしてください。
       - mcp_servers.searxng.env.SEARXNG_URL は http://searxng:8080/ にしてください。
       - mcp_servers.docling.command は /opt/data/docling-mcp-venv/bin/docling-mcp-server にしてください。
       - mcp_servers.docling.args は ["--transport", "stdio"] にしてください。
       - mcp_servers.docling.env.DOCLING_SERVICE_URL は http://docling:5001 にしてください。
       - mcp_servers.docling.env.DOCLING_SERVICE_API_KEY は sk-docling-serve-api-key にしてください。
       - mcp_servers.docling.env.DOCLING_CONVERSION_MODE は remote にしてください。
       - mcp_servers.docling.env.DOCLING_FALLBACK_TO_LOCAL は false にしてください。

    6. 最後に、実行したコマンド、成功した項目、失敗した項目、再起動が必要な項目を短く報告してください。config.yaml、MCP サーバ、PYTHONPATH、または plugin 依存を変更した場合は Hermes-Agent の再起動が必要です。

fallback_providers:
  - provider: custom
    model: google/gemma4:31b-cloud
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key
  - provider: custom
    model: google/gemma-4-31b-it:free
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key
  - provider: custom
    model: google/gemma-4-31b-it
    base_url: http://litellm:4000/v1
    api_key: sk-litellm-master-key

discord:
  require_mention: true

plugins:
  enabled:
    - observability/langfuse
