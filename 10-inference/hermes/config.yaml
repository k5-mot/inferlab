model:
  # provider: openai-codex
  # default: gpt-5.5
  provider: custom:litellm
  default: google/gemma4:31b
providers:
  litellm:
    api: http://litellm:4000/v1
    key_env: LITELLM_MASTER_KEY
    default_model: google/gemma4:31b
    transport: chat_completions
    extra_headers:
      langfuse_trace_name: "Hermes Agent"
      langfuse_generation_name: "Hermes Agent"
      langfuse_tags: '["hermes-agent"]'
fallback_providers:
  - provider: custom:litellm
    model: google/gemma4:31b
  - provider: custom:litellm
    model: openai/gpt-oss:20b
  - provider: custom:litellm
    model: nvidia/nemotron-3-nano:30b
agent:
  verify_on_stop: false
auxiliary:
  web_extract:
    provider: custom:litellm
    model: google/gemma4:31b
    fallback_chain:
    - provider: custom:litellm
      model: google/gemma4:31b
    - provider: custom:litellm
      model: openai/gpt-oss:20b
    - provider: custom:litellm
      model: nvidia/nemotron-3-nano:30b
  compression:
    provider: custom:litellm
    model: google/gemma4:31b
    fallback_chain:
      - provider: custom:litellm
        model: google/gemma4:31b
      - provider: custom:litellm
        model: openai/gpt-oss:20b
      - provider: custom:litellm
        model: nvidia/nemotron-3-nano:30b
  skills_hub:
    provider: custom:litellm
    model: google/gemma4:31b
    fallback_chain:
      - provider: custom:litellm
        model: google/gemma4:31b
      - provider: custom:litellm
        model: openai/gpt-oss:20b
      - provider: custom:litellm
        model: nvidia/nemotron-3-nano:30b
  mcp:
    provider: custom:litellm
    model: google/gemma4:31b
    fallback_chain:
      - provider: custom:litellm
        model: google/gemma4:31b
      - provider: custom:litellm
        model: openai/gpt-oss:20b
      - provider: custom:litellm
        model: nvidia/nemotron-3-nano:30b
mcp_servers:
  searxng:
    command: npx
    args:
      - -y
      - mcp-searxng@1.14.0
    env:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_DEFAULT_LANGUAGE: all
      SEARXNG_MAX_RESULTS: "10"
      SEARXNG_MAX_RESULT_CHARS: "500"
      URL_READ_MAX_CHARS: "4000"
    timeout: 30
    connect_timeout: 10
    keepalive_interval: 120
  docling:
    command: uvx
    args:
      - --from
      - docling-mcp==3.0.0
      - docling-mcp-server
      - --transport
      - stdio
    env:
      DOCLING_MCP_CONVERSION_MODE: remote
      DOCLING_MCP_SERVICE_URL: http://docling:5001
      DOCLING_MCP_SERVICE_API_KEY: sk-docling-serve-api-key
      DOCLING_MCP_SERVICE_TIMEOUT: "300.0"
      DOCLING_MCP_SERVICE_MAX_RETRIES: "3"
      DOCLING_MCP_FALLBACK_TO_LOCAL: "false"
    timeout: 300
    connect_timeout: 30
    keepalive_interval: 120
terminal:
  backend: local
  cwd: /opt/data
  timeout: 180
  home_mode: real
  shell_init_files:
    - /opt/hermes/.venv/bin/activate
  auto_source_bashrc: false
display:
  tool_progress: all
dashboard:
  theme: default
tts:
  provider: openai
  openai:
    model: kokoro
    voice: jf_alpha
    base_url: http://kokoro:8880/v1
    speed: 1.0
  speed: 1.0
discord:
  require_mention: true
onboarding:
  seen:
    profile_build_offered: true
_config_version: 33
provider_routing:
  require_parameters: false
  data_collection: deny
plugins:
  enabled:
    - litellm-langfuse-headers
