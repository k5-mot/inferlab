model:
  provider: openai-codex
  default: gpt-5.5
providers:
  ollama-gemma4:
    api: http://ollama:11434/v1
    default_model: gemma4:31b-cloud
    transport: chat_completions
  cerebras-gemma4:
    api: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    default_model: gemma-4-31b
    transport: chat_completions
fallback_providers:
  - provider: custom:ollama-gemma4
    model: gemma4:31b-cloud
  - provider: custom:cerebras-gemma4
    model: gemma-4-31b
  - provider: gemini
    model: gemma-4-31b-it
    base_url: https://generativelanguage.googleapis.com/v1beta
  - provider: openrouter
    model: google/gemma-4-31b-it:free
agent:
  verify_on_stop: false
auxiliary:
  web_extract:
    provider: gemini
    model: gemma-4-31b-it
    base_url: https://generativelanguage.googleapis.com/v1beta
    fallback_chain:
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
  compression:
    provider: custom:cerebras-gemma4
    model: gemma-4-31b
    fallback_chain:
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
  skills_hub:
    provider: openrouter
    model: google/gemma-4-31b-it:free
    fallback_chain:
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
  mcp:
    provider: custom:ollama-gemma4
    model: gemma4:31b-cloud
    fallback_chain:
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
      - provider: openrouter
        model: google/gemma-4-31b-it:free
mcp_servers:
  searxng:
    command: npx
    args:
      - -y
      - mcp-searxng@1.14.0
    env:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_DEFAULT_LANGUAGE: all
      SEARXNG_MAX_RESULTS: "10"
      SEARXNG_MAX_RESULT_CHARS: "500"
      URL_READ_MAX_CHARS: "4000"
    timeout: 30
    connect_timeout: 10
    keepalive_interval: 120
  docling:
    command: uvx
    args:
      - --from
      - docling-mcp==3.0.0
      - docling-mcp-server
      - --transport
      - stdio
    env:
      DOCLING_MCP_CONVERSION_MODE: remote
      DOCLING_MCP_SERVICE_URL: http://docling:5001
      DOCLING_MCP_SERVICE_API_KEY: sk-docling-serve-api-key
      DOCLING_MCP_SERVICE_TIMEOUT: "300.0"
      DOCLING_MCP_SERVICE_MAX_RETRIES: "3"
      DOCLING_MCP_FALLBACK_TO_LOCAL: "false"
    timeout: 300
    connect_timeout: 30
    keepalive_interval: 120
terminal:
  backend: local
  cwd: /opt/data
  timeout: 180
  home_mode: real
  shell_init_files:
    - /opt/hermes/.venv/bin/activate
  auto_source_bashrc: false
display:
  tool_progress: all
dashboard:
  theme: default
tts:
  provider: openai
  openai:
    model: kokoro
    voice: jf_alpha
    base_url: http://kokoro:8880/v1
    speed: 1.0
  speed: 1.0
discord:
  require_mention: true
onboarding:
  seen:
    profile_build_offered: true
_config_version: 33
provider_routing:
  require_parameters: false
  data_collection: deny
plugins:
  enabled:
    - observability/langfuse
