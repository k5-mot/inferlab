providers:
  # Hermesが対応していないモデルをOpenAI-Compatible APIとして設定.
  ollama-gemma4:
    api: http://ollama:11434/v1
    default_model: gemma4:31b-cloud
    transport: chat_completions
  cerebras-gemma4:
    api: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    default_model: gemma-4-31b
    transport: chat_completions
model:
  # メインモデル.
  provider: custom:ollama-gemma4
  default: gemma4:31b-cloud
fallback_providers:
  # メインモデルが失敗した場合の候補.
  - provider: custom:cerebras-gemma4
    model: gemma-4-31b
  - provider: gemini
    model: gemma-4-31b-it
    base_url: https://generativelanguage.googleapis.com/v1beta
  - provider: openrouter
    model: google/gemma-4-31b-it:free
provider_routing:
  # データ収集を不許可.
  require_parameters: false
  data_collection: deny
auxiliary:
  # 会話履歴の圧縮と要約を担当.
  compression:
    provider: custom:cerebras-gemma4
    model: gemma-4-31b
    fallback_chain:
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
  web_extract:
    # Web ページ抽出結果の要約を担当.
    provider: gemini
    model: gemma-4-31b-it
    base_url: https://generativelanguage.googleapis.com/v1beta
    fallback_chain:
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
  skills_hub:
    # スキル検索とスキル関連の補助判断を担当.
    provider: openrouter
    model: google/gemma-4-31b-it:free
    fallback_chain:
      - provider: custom:ollama-gemma4
        model: gemma4:31b-cloud
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
  mcp:
    # MCP helper 操作と軽量な補助判断を担当.
    provider: custom:ollama-gemma4
    model: gemma4:31b-cloud
    fallback_chain:
      - provider: custom:cerebras-gemma4
        model: gemma-4-31b
      - provider: gemini
        model: gemma-4-31b-it
        base_url: https://generativelanguage.googleapis.com/v1beta
      - provider: openrouter
        model: google/gemma-4-31b-it:free
tts:
  # 音声合成を担当.
  provider: openai
  speed: 1.0
  openai:
    model: kokoro
    voice: jf_alpha
    base_url: http://kokoro:8880/v1
    speed: 1.0

discord:
  require_mention: true
plugins:
  enabled:
    - observability/langfuse
display:
  tool_progress: all
agent:
  verify_on_stop: false
_config_version: 33
onboarding:
  seen:
    profile_build_offered: true
