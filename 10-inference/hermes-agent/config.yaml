model:
  provider: openai-codex
  default: gpt-5.5
fallback_providers:
  - provider: custom:litellm
    model: google/gemma4:31b
  - provider: custom:litellm
    model: openai/gpt-oss:20b
  - provider: custom:litellm
    model: nvidia/nemotron-3-nano:30b
custom_providers:
  - name: litellm
    base_url: http://litellm:4000/v1
    key_env: LITELLM_MASTER_KEY
    models:
      - google/gemma4:31b
      - openai/gpt-oss:20b
      - nvidia/nemotron-3-nano:30b
tts:
  provider: openai
  speed: 1.0
  openai:
    model: voicevox/tts
    voice: '3'
    base_url: http://litellm:4000/v1
    speed: 1.0
discord:
  require_mention: true
plugins:
  enabled:
    - observability/langfuse
display:
  tool_progress: all
agent:
  verify_on_stop: false
_config_version: 33
onboarding:
  seen:
    profile_build_offered: true
