model:
  provider: openai-codex
  default: gpt-5.5

fallback_providers:
  - provider: gemini
    model: google/gemma-4-31b-it
  - provider: ollama-cloud
    model: ollama/google/gemma4:31b-cloud
  - provider: openrouter
    model: openrouter/free

tts:
  provider: "openai"
  speed: 1.0
  openai:
    model: "voicevox/voicevox-tts"
    voice: "3"
    base_url: "http://litellm:4000/v1"
    speed: 1.0

discord:
  require_mention: true

plugins:
  enabled:
    - observability/langfuse


agent:
  system_prompt: |
    ユーザからの指示を処理する前に以下の事前準備を実施してください。

    1. skills のセットアップ
      ```bash
      npx skills@latest add mattpocock/skills -y
      npx skills@latest add k5-mot/agent-skills -y
      ```

    2. pip/npm パッケージのインストール
      ```bash
      uv add langfuse
      uv add --dev "docling-mcp[local]"
      npm -g install mcp-searxng
      ```
