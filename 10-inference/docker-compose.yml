#
# 参考資料:
# - LiteLLM
#   - https://docs.litellm.ai/docs/simple_proxy
# - Ollama
#   - https://docs.ollama.com/docker
# - TEI; HuggingFace Text Embedding Inference
#   - https://huggingface.co/docs/text-embeddings-inference/quick_tour
#

x-external-dns-stabilizer: &external-dns-stabilizer
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_search:
    - .
  dns_opt:
    - "timeout:1"
    - "attempts:2"
    - "ndots:1"

services:
  litellm:
    <<: *external-dns-stabilizer
    image: docker.io/litellm/litellm:v1.94.1
    container_name: ${STACK_NAME:-inferlab}-litellm
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
    ports:
      - 31000:4000
    volumes:
      - ./litellm/config-litellm.yaml:/app/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      ollama:
        condition: service_healthy
      tei-embedding:
        condition: service_healthy
      tei-reranking:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit() if requests.get('http://localhost:4000/health/readiness').status_code == 200 else exit(1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - homepage.icon=/icons/litlellm.png
      - homepage.group=10-inference
      - homepage.name=LiteLLM
      - homepage.href=http://${PUBLIC_HOST}:31000/ui
      - homepage.description=LLM proxy

  ollama:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.32.5
    container_name: ${STACK_NAME:-inferlab}-ollama
    restart: unless-stopped
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internal-nw
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama list > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      - homepage.icon=/icons/ollama.png
      - homepage.group=10-inference
      - homepage.name=Ollama
      - homepage.description=Inference engine

  ollama-init:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.32.5
    container_name: ${STACK_NAME:-inferlab}-ollama-init
    restart: no
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_INIT_MODELS: "gemma4:31b-cloud gpt-oss:20b-cloud nemotron-3-nano:30b-cloud"
    volumes:
      - ollama-cache:/root/.ollama
      - ./ollama/init-models.sh:/usr/local/bin/init-models:ro
    networks:
      - internal-nw
    entrypoint:
      - /bin/sh
    command:
      - /usr/local/bin/init-models

  tei-embedding:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME:-inferlab}-tei-embedding
    restart: on-failure:3
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
    volumes:
      - tei-cache:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Embedding
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 7g
    cpus: 4.0

  tei-reranking:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME:-inferlab}-tei-reranking
    restart: on-failure:3
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
    volumes:
      - tei-cache:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Reranking
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 7g
    cpus: 4.0

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.7.0
    container_name: ${STACK_NAME:-inferlab}-kokoro
    restart: unless-stopped
    profiles:
      - inference
    environment:
      DEFAULT_VOICE: jf_alpha
      DEFAULT_VOICE_CODE: j
      USE_GPU: "false"
      DEVICE_TYPE: cpu
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8880/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - homepage.group=10-inference
      - homepage.name=Kokoro-TTS
      - homepage.description=Text-to-Speech Engine
      - homepage.href=http://${PUBLIC_HOST}:31005/web
      - homepage.icon=/icons/kokoro-web.png

  hermes-agent:
    <<: *external-dns-stabilizer
    image: docker.io/nousresearch/hermes-agent:v2026.7.30
    container_name: ${STACK_NAME:-inferlab}-hermes-agent
    restart: unless-stopped
    profiles:
      - inference
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - /opt/data/docker/start-gateway.sh
    environment:
      # https://hermes-agent.nousresearch.com/docs/reference/environment-variables
      ### OpenAI-Compatible API
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      # API_SERVER_PORT: ${HERMES_AGENT_PORT:-8642}
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Tokyo}
      ### Web Dashboard
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pw-hermes-agent-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-sk-hermes-agent-dashboard-secret}
      ### Open-WebUI
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://${PUBLIC_HOST}:31001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: ${OPEN_WEBUI_DEFAULT_CHANNEL:-general}
      OPEN_WEBUI_CHANNELS_LIST_PATH: ${OPEN_WEBUI_CHANNELS_LIST_PATH:-/api/v1/channels/}
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: ${OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE:-/api/v1/channels/{channel_id}/messages/post}
      OPEN_WEBUI_CHATS_ALL_DB_PATH: ${OPEN_WEBUI_CHATS_ALL_DB_PATH:-/api/v1/chats/all/db}
      OPEN_WEBUI_MAX_MESSAGE_CHARS: ${OPEN_WEBUI_MAX_MESSAGE_CHARS:-20000}
      ### Discord
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      DISCORD_AUTO_THREAD: false
      ### Langfuse
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      VOICE_TOOLS_OPENAI_KEY: ${VOICE_TOOLS_OPENAI_KEY:-not-needed}
      ### SearXNG
      SEARXNG_URL: "http://searxng:8080/"
      SEARXNG_SECRET_KEY: "sk-searxng-secret-key"
      ### docling-serve
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_API_KEY: "sk-docling-serve-api-key"
      ### Model providers
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      HERMES_HOME: /opt/data
      UV_LINK_MODE: copy
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    ports:
      - 31001:9119
    volumes:
      - ./hermes-agent:/opt/data
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${HERMES_AGENT_PORT:-8642}/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/hermes-icon.png
      - homepage.group=10-inference
      - homepage.name=Hermes-Agent
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31001

  # https://github.com/openclaw/openclaw/blob/main/docker-compose.yml
  # https://docs.openclaw.ai/install/docker
  openclaw:
    <<: *external-dns-stabilizer
    build:
      context: ./openclaw/custom-image
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_BASE_IMAGE:-ghcr.io/openclaw/openclaw:2026.7.1-browser}
    image: ${OPENCLAW_IMAGE:-inferlab/openclaw:2026.7.1-browser}
    container_name: ${STACK_NAME:-inferlab}-openclaw
    restart: unless-stopped
    profiles:
      - inference
      - openclaw
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # host側.envのpathをcontainer内の実行時pathへ漏らさない。
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_TEMPLATE_SOURCE_PATH: /usr/local/share/openclaw/openclaw.template.json
      OPENCLAW_CONFIG_SCHEMA_SOURCE_PATH: /usr/local/share/openclaw/openclaw.schema.json
      OPENCLAW_CONFIG_TEMPLATE_PATH: /home/node/.openclaw/openclaw.template.json
      OPENCLAW_CONFIG_SCHEMA_PATH: /home/node/.openclaw/openclaw.schema.json
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspaces
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-sk-openclaw-gateway-token}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      DISCORD_BOT_TOKEN: ${OPENCLAW_DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${OPENCLAW_DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${OPENCLAW_DISCORD_CHANNEL_ID:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      TZ: ${OPENCLAW_TZ:-Asia/Tokyo}
    ports:
      - 31002:18789
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/workspaces:/home/node/.openclaw/workspaces
    networks:
      - internal-nw
    # cap_drop:
    #   - NET_RAW
    #   - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    init: true
    healthcheck:
      test: [ "CMD", "node", "dist/index.js", "health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/openclaw.png
      - homepage.group=10-inference
      - homepage.name=OpenClaw
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31002

volumes:
  ollama-cache:
  openclaw-data:
  tei-cache:

networks:
  internal-nw:
