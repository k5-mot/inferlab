#
# 参考資料:
# - LiteLLM
#   - https://docs.litellm.ai/docs/simple_proxy
# - Ollama
#   - https://docs.ollama.com/docker
# - TEI; HuggingFace Text Embedding Inference
#   - https://huggingface.co/docs/text-embeddings-inference/quick_tour
#

x-external-dns-stabilizer: &external-dns-stabilizer
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_search:
    - .
  dns_opt:
    - "timeout:1"
    - "attempts:2"
    - "ndots:1"

services:
  litellm:
    <<: *external-dns-stabilizer
    image: docker.io/litellm/litellm:v1.91.0
    container_name: ${STACK_NAME:-inferlab}-litellm
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
    ports:
      - 31000:4000
    volumes:
      - ./litellm/config-litellm.yaml:/app/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      ollama:
        condition: service_healthy
      tei-embedding:
        condition: service_healthy
      tei-reranking:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit() if requests.get('http://localhost:4000/health/readiness').status_code == 200 else exit(1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - homepage.group=10-inference
      - homepage.name=LiteLLM
      # - homepage.icon=litellm.png
      - homepage.icon=litlellm.png
      - homepage.href=http://${PUBLIC_HOST}:31000/ui
      - homepage.description=LLM_Proxy

  ollama:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.31.1
    container_name: ${STACK_NAME:-inferlab}-ollama
    restart: unless-stopped
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internal-nw
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama list > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      - homepage.group=10-inference
      - homepage.name=Ollama
      - homepage.icon=ollama.png
      - homepage.description=Inference_Engine

  ollama-init:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.31.1
    container_name: ${STACK_NAME:-inferlab}-ollama-init
    restart: no
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_INIT_MODELS: "deepseek-v4-flash:cloud gemma4:31b-cloud"
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internal-nw
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - >-
        ollama serve & OLLAMA_PID=$$!; until ollama list > /dev/null 2>&1; do
          echo 'Waiting for Ollama to be ready...';
          sleep 1;
        done; echo 'Ollama is ready. Importing models sequentially...'; for model in $${OLLAMA_INIT_MODELS}; do
          echo "Pulling $$model...";
          ollama pull "$$model";
        done; echo 'All models pulled.'; kill "$$OLLAMA_PID"

  tei-embedding:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME:-inferlab}-tei-embedding
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "512"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "16"
      - --tokenization-workers
      - "2"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - tei-cache:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    labels:
      - homepage.group=10-inference
      - homepage.name=TEI_Embedding
      - homepage.icon=hugging-face.png
      - homepage.description=Embedding_Inference_Engine

  tei-reranking:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME:-inferlab}-tei-reranking
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --model-id
      - cl-nagoya/ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "512"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "16"
      - --tokenization-workers
      - "2"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - tei-cache:/data
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    labels:
      - homepage.group=10-inference
      - homepage.name=TEI_Reranking
      - homepage.icon=hugging-face.png
      - homepage.description=Embedding_Inference_Engine

  hermes-agent-init:
    <<: *external-dns-stabilizer
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: ${STACK_NAME:-inferlab}-hermes-agent-init
    restart: no
    profiles:
      - inference
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -c
        # cp -rv  /opt/config/.codex/auth.json  /opt/data/auth.json
        # cp -rfv /opt/config/.codex/           /opt/data
    command:
      - |
        set -eu
        mkdir -p /opt/data/skills
        cp -rv  /opt/config/config.yaml       /opt/data/config.yaml
        cp -rfv /opt/config/skills/*          /opt/data/skills
        if [ ! -x /opt/data/node_modules/.bin/rss-mcp ]; then
          npm install --prefix /opt/data rss-mcp --silent
        fi
        if [ ! -x /opt/data/node_modules/.bin/mcp-searxng ]; then
          npm install --prefix /opt/data mcp-searxng --silent
        fi
        if [ ! -x /opt/data/docling-mcp-venv/bin/docling-mcp-server ]; then
          python -m venv /opt/data/docling-mcp-venv
          /opt/data/docling-mcp-venv/bin/python -m pip install --no-cache-dir --upgrade pip
          /opt/data/docling-mcp-venv/bin/python -m pip install --no-cache-dir docling-mcp
        fi
        export PYTHONPATH="/opt/data/langfuse-python-packages$${PYTHONPATH:+:$$PYTHONPATH}"
        if ! python - <<'PY' >/dev/null 2>&1
        import importlib.metadata as md
        from langfuse import Langfuse, propagate_attributes

        expected = {
            "certifi": "2026.5.20",
            "packaging": "26.0",
            "requests": "2.33.0",
        }
        for package, version in expected.items():
            if md.version(package) != version:
                raise SystemExit(1)
        PY
        then
          python -m ensurepip --upgrade
          python -m pip install --no-cache-dir --upgrade --target /opt/data/langfuse-python-packages \
            "$${HERMES_LANGFUSE_SDK_PACKAGE:-langfuse}" \
            certifi==2026.5.20 \
            packaging==26.0 \
            requests==2.33.0
        fi
        python - <<'PY'
        from langfuse import Langfuse, propagate_attributes
        PY
        chown -R 10000:10000 /opt/data || true
    volumes:
      - hermes-agent-data:/opt/data
      - ./hermes/hermes-config.yaml:/opt/config/config.yaml
      - ~/.codex:/opt/config/.codex:ro
      - ./skills:/opt/config/skills:ro
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      HERMES_LANGFUSE_SDK_PACKAGE: ${HERMES_LANGFUSE_SDK_PACKAGE:-langfuse}

  hermes-agent:
    <<: *external-dns-stabilizer
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: ${STACK_NAME:-inferlab}-hermes-agent
    restart: unless-stopped
    profiles:
      - inference
      - hermes-agent
    command:
      - gateway
      - run
    environment:
      # https://hermes-agent.nousresearch.com/docs/reference/environment-variables
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: ${HERMES_AGENT_PORT:-8642}
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      PYTHONPATH: /opt/data/langfuse-python-packages
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: ${HERMES_AGENT_GATEWAY_ALLOW_ALL_USERS:-true}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Tokyo}
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:31001}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: ${OPEN_WEBUI_DEFAULT_CHANNEL:-report}
      OPEN_WEBUI_CHANNELS_LIST_PATH: ${OPEN_WEBUI_CHANNELS_LIST_PATH:-/api/v1/channels/}
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: ${OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE:-/api/v1/channels/{channel_id}/messages/post}
      OPEN_WEBUI_CHATS_ALL_DB_PATH: ${OPEN_WEBUI_CHATS_ALL_DB_PATH:-/api/v1/chats/all/db}
      OPEN_WEBUI_MAX_MESSAGE_CHARS: ${OPEN_WEBUI_MAX_MESSAGE_CHARS:-20000}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - hermes-agent-data:/opt/data
      - ./hermes/sitecustomize.py:/opt/data/langfuse-python-packages/sitecustomize.py:ro
    networks:
      - internal-nw
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:${HERMES_AGENT_PORT:-8642}/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      hermes-agent-init:
        condition: service_completed_successfully
    labels:
      - homepage.group=10-inference
      - homepage.name=Hermes-Agent
      - homepage.icon=hermes-icon
      - homepage.description=AI_Agent

  hermes-agent-dashboard:
    <<: *external-dns-stabilizer
    image: ${HERMES_AGENT_IMAGE:-docker.io/nousresearch/hermes-agent:v2026.7.7.2}
    container_name: ${STACK_NAME:-inferlab}-hermes-agent-dashboard
    restart: unless-stopped
    profiles:
      - inference
      - hermes-agent
    command:
      - dashboard
      - --host
      - "0.0.0.0"
      - --port
      - "9119"
      - --no-open
    environment:
      GATEWAY_HEALTH_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pw-hermes-agent-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-sk-hermes-agent-dashboard-secret}
      PYTHONPATH: /opt/data/langfuse-python-packages
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_OTEL_HOST:-http://langfuse-web:3000}
    ports:
      - 31001:9119
    volumes:
      - hermes-agent-data:/opt/data
      - ./hermes/sitecustomize.py:/opt/data/langfuse-python-packages/sitecustomize.py:ro
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9119/health >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      hermes-agent:
        condition: service_healthy
    labels:
      - homepage.group=10-inference
      - homepage.name=Hermes-Agent
      - homepage.icon=hermes-icon
      - homepage.href=http://${PUBLIC_HOST}:31001
      - homepage.description=AI_Agent

volumes:
  ollama-cache:
  tei-cache:
  hermes-agent-data:

networks:
  internal-nw:
