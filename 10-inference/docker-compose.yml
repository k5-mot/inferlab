#
# 参考資料:
# - LiteLLM
#   - https://docs.litellm.ai/docs/simple_proxy
# - TEI; HuggingFace Text Embedding Inference
#   - https://huggingface.co/docs/text-embeddings-inference/quick_tour
# - ZeroClaw
#   - https://github.com/zeroclaw-labs/zeroclaw
#

x-external-dns-stabilizer: &external-dns-stabilizer
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_search:
    - .
  dns_opt:
    - "timeout:1"
    - "attempts:2"
    - "ndots:1"

services:
  litellm:
    <<: *external-dns-stabilizer
    image: docker.io/litellm/litellm:v1.110.2
    container_name: ${STACK_NAME}-litellm
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
      OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
    ports:
      - 31000:4000
    volumes:
      - ./litellm/config-litellm.yaml:/app/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      # tei-embedding-jp:
      #   condition: service_healthy
      # tei-reranking-jp:
      #   condition: service_healthy
      vllm-embedding:
        condition: service_healthy
      vllm-reranking:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; exit(urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=3).status != 200)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - homepage.icon=/icons/litlellm.png
      - homepage.group=10-inference
      - homepage.name=LiteLLM
      - homepage.href=http://${PUBLIC_HOST}:31000/ui
      - homepage.description=LLM proxy

  tei-embedding:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME}-tei-embedding
    restart: on-failure:3
    profiles:
      - inference-tei
    command:
      - --model-id
      - "cl-nagoya/ruri-v3-310m"
      # - /models/cl-nagoya--ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - "mean"
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    volumes:
      - tei-cache:/data
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Embedding
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0

  tei-reranking:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME}-tei-reranking
    restart: on-failure:3
    profiles:
      - inference-tei
    command:
      - --model-id
      - "cl-nagoya/ruri-v3-reranker-310m"
      # - /models/cl-nagoya--ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    volumes:
      - tei-cache:/data
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Reranking
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0

  vllm-embedding:
    image: docker.io/vllm/vllm-openai-cpu:v0.34.0-x86_64
    container_name: ${STACK_NAME}-vllm-embedding
    restart: unless-stopped
    ipc: host
    profiles:
      - inference
    command:
      - "Qwen/Qwen3-Embedding-0.6B"
      # - "/models/Qwen3-Embedding-0.6B"
      - --runner
      - pooling
      - --convert
      - embed
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - "Qwen/Qwen3-Embedding-0.6B"
      - --dtype
      - auto
      # - --gpu-memory-utilization
      # - "0.05"
      - --kv-cache-memory-bytes
      - "1G"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-3600}
      VLLM_CPU_OMP_THREADS_BIND: "0-3"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - vllm-cache:/root/.cache/huggingface
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    # mem_limit: 8g
    # memswap_limit: 8g
    # cpus: 4.0
    labels:
      - homepage.icon=/icons/vllm.png
      - homepage.group=10-inference
      - homepage.name=vLLM_Embedding
      - homepage.description=Embedding inference engine

  vllm-reranking:
    image: docker.io/vllm/vllm-openai-cpu:v0.34.0-x86_64
    container_name: ${STACK_NAME}-vllm-reranking
    restart: unless-stopped
    ipc: host
    profiles:
      - inference
    command:
      - "Qwen/Qwen3-Reranker-0.6B"
      # - "/models/Qwen3-Reranker-0.6B"
      - --runner
      - pooling
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - "Qwen/Qwen3-Reranker-0.6B"
      - --dtype
      - auto
      # - --gpu-memory-utilization
      # - "0.05"
      - --kv-cache-memory-bytes
      - "1G"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --hf-overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /config/qwen3_reranker.jinja
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      # VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-3600}
      VLLM_CPU_OMP_THREADS_BIND: "4-5"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - vllm-cache:/root/.cache/huggingface
      # - /srv/huggingface:/models:ro
      - ./vllm/qwen3_reranker.jinja:/config/qwen3_reranker.jinja:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    # mem_limit: 8g
    # memswap_limit: 8g
    # cpus: 4.0
    labels:
      - homepage.icon=/icons/vllm.png
      - homepage.group=10-inference
      - homepage.name=vLLM_Reranking
      - homepage.description=Reranking inference engine

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0
    # image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.10.0
    container_name: ${STACK_NAME}-kokoro
    restart: unless-stopped
    profiles:
      - inference
    environment:
      DEFAULT_VOICE: jf_alpha
      DEFAULT_VOICE_CODE: j
      USE_GPU: "false"
      DEVICE_TYPE: cpu
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8880/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - homepage.group=10-inference
      - homepage.name=Kokoro-TTS
      - homepage.description=Text-to-Speech Engine
      - homepage.href=http://${PUBLIC_HOST}:31005/web
      - homepage.icon=/icons/kokoro-web.png

  hermes-agent:
    <<: *external-dns-stabilizer
    image: docker.io/nousresearch/hermes-agent:v2026.9.24
    container_name: ${STACK_NAME}-hermes-agent
    restart: unless-stopped
    profiles:
      - inference
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        exec /init /opt/hermes/docker/main-wrapper.sh gateway run
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      # https://hermes-agent.nousresearch.com/docs/reference/environment-variables
      ### OpenAI-Compatible API
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: "true"
      REPORT_TIMEZONE: Asia/Tokyo
      ### Web Dashboard
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pw-hermes-agent-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-sk-hermes-agent-dashboard-secret}
      ### Open-WebUI
      OPEN_WEBUI_BASE_URL: http://open-webui:8080
      OPEN_WEBUI_PUBLIC_URL: http://${PUBLIC_HOST}:31001
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: general
      OPEN_WEBUI_CHANNELS_LIST_PATH: /api/v1/channels/
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: /api/v1/channels/{channel_id}/messages/post
      OPEN_WEBUI_CHATS_ALL_DB_PATH: /api/v1/chats/all/db
      OPEN_WEBUI_MAX_MESSAGE_CHARS: "20000"
      ### Discord
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      DISCORD_AUTO_THREAD: false
      VOICE_TOOLS_OPENAI_KEY: not-needed
      ### SearXNG
      SEARXNG_URL: "http://searxng:8080/"
      ### docling-serve
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_API_KEY: ${DOCLING_SERVE_API_KEY:-sk-docling-serve-api-key}
      DOCLING_MCP_SERVICE_API_KEY: ${DOCLING_SERVE_API_KEY:-sk-docling-serve-api-key}
      ### Model providers
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CODEX_HOME: /opt/data/.codex
      UV_LINK_MODE: copy
      UV_NO_CACHE: "true"
      HERMES_UID: 1000
      HERMES_GID: 1000
    ports:
      - 31001:9119
    volumes:
      - hermes-data:/opt/data
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/hooks/install-skills:/opt/data/hooks/install-skills:ro
      - ./hermes/plugins/langfuse-headers:/opt/data/plugins/langfuse-headers:ro
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/hermes-icon.png
      - homepage.group=10-inference
      - homepage.name=Hermes-Agent
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31001

  # Discord pluginは公式imageとは別に永続volumeへ導入する。
  openclaw-init:
    <<: *external-dns-stabilizer
    image: ghcr.io/openclaw/openclaw:2026.11.7-browser
    container_name: ${STACK_NAME}-openclaw-init
    user: "0:0"
    restart: "no"
    profiles:
      - inference
      - openclaw
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.managed.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      XDG_CACHE_HOME: /tmp/cache
      TZ: Asia/Tokyo
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/openclaw.json:/opt/inferlab/openclaw.json:ro
    networks:
      - internal-nw
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        # Doctorがschema migrationを書き戻せるよう、管理設定を永続volumeへ複製する。
        install -o node -g node -m 0644 /opt/inferlab/openclaw.json /home/node/.openclaw/openclaw.managed.json
        # 個別bind mountでroot所有になり得るworkspaceを、実行userが書き込める状態へ戻す。
        install -d -o node -g node -m 0755 /home/node/.openclaw/workspaces
        # coreと同じrelease cohortのDiscord pluginへ永続volumeを収束させる。
        plugin_json="$$(setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins list --json)"
        plugin_version="$$(printf '%s' "$$plugin_json" | node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(data.plugins.find((plugin) => plugin.id === "discord")?.version ?? "");')"
        if [ "$$plugin_version" = "2026.11.7" ]; then
          echo "Discord plugin is already at 2026.11.7."
        elif [ -n "$$plugin_version" ]; then
          setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins update @openclaw/discord@2026.11.7 --accept-capabilities
        else
          setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins install @openclaw/discord@2026.11.7 --pin --accept-capabilities
        fi
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  # https://github.com/openclaw/openclaw/blob/main/docker-compose.yml
  # https://docs.openclaw.ai/install/docker
  openclaw:
    <<: *external-dns-stabilizer
    image: ghcr.io/openclaw/openclaw:2026.11.7-browser
    container_name: ${STACK_NAME}-openclaw
    restart: unless-stopped
    profiles:
      - inference
      - openclaw
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # host側.envのpathをcontainer内の実行時pathへ漏らさない。
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.managed.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspaces
      XDG_CACHE_HOME: /tmp/cache
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-sk-openclaw-gateway-token}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ""
      OPENCLAW_DISABLE_BONJOUR: ""
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DISCORD_BOT_TOKEN: ${OPENCLAW_DISCORD_BOT_TOKEN:-}
      TZ: Asia/Tokyo
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    ports:
      - 31002:18789
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/AGENTS.md:/home/node/.openclaw/workspaces/AGENTS.md:ro
      - ./openclaw/IDENTITY.md:/home/node/.openclaw/workspaces/IDENTITY.md:ro
      - ./openclaw/SOUL.md:/home/node/.openclaw/workspaces/SOUL.md:ro
    networks:
      - internal-nw
    # cap_drop:
    #   - NET_RAW
    #   - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    init: true
    healthcheck:
      test: [ "CMD", "node", "dist/index.js", "health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/openclaw.png
      - homepage.group=10-inference
      - homepage.name=OpenClaw
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31002

  # https://github.com/zeroclaw-labs/zeroclaw/blob/master/docs/book/src/setup/container.md
  # https://github.com/zeroclaw-labs/zeroclaw/blob/master/docker-compose.yml
  zeroclaw-init:
    image: docker.io/alpine/openssl:3.5.9
    container_name: ${STACK_NAME}-zeroclaw-init
    restart: "no"
    profiles:
      - inference
      - zeroclaw
    user: "0:0"
    entrypoint:
      - sh
      - -euc
    command:
      - |
        # 人格fileのbind mountより先にworkspaceを作り、ZeroClawの実行userが書き込めるようにする。
        mkdir -p /zeroclaw-data/workspace /zeroclaw-data/.zeroclaw
        # release image同梱のconfig.tomlは旧schema (V1) のため、repository管理の基底設定へ置き換える。
        # ZeroClawはpairing tokenをconfig.tomlへ保存し、comment無しで書き戻すため、
        # 適用済みの版番号を別fileへ記録し、版番号が変わった場合だけ置き換える。
        marker=/zeroclaw-data/.zeroclaw/.inferlab-managed-config
        managed=$$(head -n 1 /opt/inferlab/config.toml)
        current=$$(cat "$${marker}" 2>/dev/null || true)
        if [ "$${managed}" != "$${current}" ]; then
          echo "Install managed ZeroClaw config: $${managed}"
          cp /opt/inferlab/config.toml /zeroclaw-data/.zeroclaw/config.toml
          printf '%s\n' "$${managed}" > "$${marker}"
        fi
        chown 65534:65534 /zeroclaw-data/workspace /zeroclaw-data/.zeroclaw /zeroclaw-data/.zeroclaw/config.toml
    volumes:
      - zeroclaw-data:/zeroclaw-data
      - ./zeroclaw/config.toml:/opt/inferlab/config.toml:ro
    network_mode: none

  zeroclaw:
    <<: *external-dns-stabilizer
    image: ghcr.io/zeroclaw-labs/zeroclaw:v0.9.0
    container_name: ${STACK_NAME}-zeroclaw
    restart: unless-stopped
    profiles:
      - inference
      - zeroclaw
    init: true
    # 設定はimage同梱config.tomlへZEROCLAW_<dotted path>形式の環境変数で上書きする。
    environment:
      TZ: Asia/Tokyo
      ZEROCLAW_gateway__require_pairing: "true"
      # air-gap環境ではGitHubへ到達できないため、更新確認を無効化する。
      ZEROCLAW_gateway__check_updates: "false"
      ZEROCLAW_providers__models__litellm__default__uri: http://litellm:4000/v1
      ZEROCLAW_providers__models__litellm__default__api_key: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      ZEROCLAW_providers__models__litellm__default__model: google/gemma4:31b
      # rate limit時はprovider alias単位でcooldownするため、fallback modelは別aliasに分ける。
      ZEROCLAW_providers__models__litellm__default__fallback: '["litellm.gptoss"]'
      ZEROCLAW_providers__models__litellm__default__extra_headers__langfuse_trace_name: ZeroClaw
      ZEROCLAW_providers__models__litellm__default__extra_headers__langfuse_generation_name: zeroclaw
      ZEROCLAW_providers__models__litellm__default__extra_headers__langfuse_tags: '["zeroclaw"]'
      ZEROCLAW_providers__models__litellm__gptoss__uri: http://litellm:4000/v1
      ZEROCLAW_providers__models__litellm__gptoss__api_key: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      ZEROCLAW_providers__models__litellm__gptoss__model: openai/gpt-oss:20b
      ZEROCLAW_providers__models__litellm__gptoss__extra_headers__langfuse_trace_name: ZeroClaw
      ZEROCLAW_providers__models__litellm__gptoss__extra_headers__langfuse_generation_name: zeroclaw
      ZEROCLAW_providers__models__litellm__gptoss__extra_headers__langfuse_tags: '["zeroclaw"]'
      ZEROCLAW_agents__default__model_provider: litellm.default
      ZEROCLAW_agents__default__workspace__path: /zeroclaw-data/workspace
      ZEROCLAW_agents__default__channels: '["discord.default"]'
      ZEROCLAW_channels__discord__default__enabled: "true"
      ZEROCLAW_channels__discord__default__bot_token: ${ZEROCLAW_DISCORD_BOT_TOKEN:-}
      ZEROCLAW_channels__discord__default__mention_only: "true"
      # 空のpeer setは全員を拒否するため、QwenPawと同じく全発言者を許可する。
      ZEROCLAW_peer_groups__discord__channel: discord
      ZEROCLAW_peer_groups__discord__external_peers: '["*"]'
    ports:
      - 31003:42617
    volumes:
      - zeroclaw-data:/zeroclaw-data
      - ./zeroclaw/persona/SOUL.md:/zeroclaw-data/workspace/SOUL.md:ro
      - ./zeroclaw/persona/IDENTITY.md:/zeroclaw-data/workspace/IDENTITY.md:ro
      - ./zeroclaw/persona/USER.md:/zeroclaw-data/workspace/USER.md:ro
      - ./zeroclaw/persona/AGENTS.md:/zeroclaw-data/workspace/AGENTS.md:ro
    networks:
      - internal-nw
    depends_on:
      zeroclaw-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - zeroclaw
        - status
        - --format=exit-code
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - homepage.icon=/icons/zeroclaw.png
      - homepage.group=10-inference
      - homepage.name=ZeroClaw
      - homepage.description=Personal AI agent
      - homepage.href=http://${PUBLIC_HOST}:31003

volumes:
  openclaw-data:
  zeroclaw-data:
  tei-cache:
  vllm-cache:
  hermes-data:

networks:
  internal-nw:
