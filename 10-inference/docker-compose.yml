#
# 参考資料:
# - LiteLLM
#   - https://docs.litellm.ai/docs/simple_proxy
# - Ollama
#   - https://docs.ollama.com/docker
# - TEI; HuggingFace Text Embedding Inference
#   - https://huggingface.co/docs/text-embeddings-inference/quick_tour
# - QwenPaw
#   - https://github.com/agentscope-ai/QwenPaw
#

x-external-dns-stabilizer: &external-dns-stabilizer
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_search:
    - .
  dns_opt:
    - "timeout:1"
    - "attempts:2"
    - "ndots:1"

services:
  litellm:
    <<: *external-dns-stabilizer
    image: docker.io/litellm/litellm:v1.98.0
    container_name: ${STACK_NAME}-litellm
    restart: unless-stopped
    profiles:
      - inference
    command:
      - --config
      - /app/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-langfuse-project-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-langfuse-project-secret-key}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
      OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
    ports:
      - 31000:4000
    volumes:
      - ./litellm/config-litellm.yaml:/app/config.yaml:ro
    networks:
      - internal-nw
    depends_on:
      ollama:
        condition: service_healthy
      # tei-embedding-jp:
      #   condition: service_healthy
      # tei-reranking-jp:
      #   condition: service_healthy
      vllm-embedding:
        condition: service_healthy
      vllm-reranking:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit() if requests.get('http://localhost:4000/health/readiness').status_code == 200 else exit(1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - homepage.icon=/icons/litlellm.png
      - homepage.group=10-inference
      - homepage.name=LiteLLM
      - homepage.href=http://${PUBLIC_HOST}:31000/ui
      - homepage.description=LLM proxy

  ollama:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.33.2
    container_name: ${STACK_NAME}-ollama
    restart: unless-stopped
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internal-nw
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama list > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      - homepage.icon=/icons/ollama.png
      - homepage.group=10-inference
      - homepage.name=Ollama
      - homepage.description=Inference engine

  ollama-init:
    <<: *external-dns-stabilizer
    image: docker.io/ollama/ollama:0.33.2
    container_name: ${STACK_NAME}-ollama-init
    restart: no
    profiles:
      - inference
    tty: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_INIT_MODELS: "gemma4:31b-cloud gpt-oss:20b-cloud nemotron-3-nano:30b-cloud"
    volumes:
      - ollama-cache:/root/.ollama
    networks:
      - internal-nw
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        # `ollama pull`にはlocal daemonが必要なため、init container内で一時的にserverを起動する。
        # 本体serviceはこのcontainerの正常終了後に同じvolumeを使って起動する。
        ollama serve &
        OLLAMA_PID=$$!
        trap 'kill "$${OLLAMA_PID}" 2>/dev/null || true' INT TERM EXIT
        until ollama list > /dev/null 2>&1; do
          echo 'Waiting for Ollama to be ready...'
          sleep 1
        done
        echo 'Ollama is ready. Importing models sequentially...'
        for model in $${OLLAMA_INIT_MODELS}; do
          echo "Pulling $${model}..."
          ollama pull "$${model}"
        done
        echo 'All models pulled.'
        trap - INT TERM EXIT
        kill "$${OLLAMA_PID}"
        wait "$${OLLAMA_PID}" 2>/dev/null || true

  tei-embedding:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME}-tei-embedding
    restart: on-failure:3
    profiles:
      - inference-tei
    command:
      - --model-id
      - "cl-nagoya/ruri-v3-310m"
      # - /models/cl-nagoya--ruri-v3-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - "mean"
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    volumes:
      - tei-cache:/data
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Embedding
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0

  tei-reranking:
    <<: *external-dns-stabilizer
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: ${STACK_NAME}-tei-reranking
    restart: on-failure:3
    profiles:
      - inference-tei
    command:
      - --model-id
      - "cl-nagoya/ruri-v3-reranker-310m"
      # - /models/cl-nagoya--ruri-v3-reranker-310m
      - --hostname
      - "0.0.0.0"
      - --port
      - "8000"
      - --pooling
      - mean
      - --max-batch-tokens
      - "1024"
      # - "8192"
      - --auto-truncate
      - "true"
      - --max-client-batch-size
      - "2"
      - --max-concurrent-requests
      - "2"
      - --tokenization-workers
      - "1"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      # HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    volumes:
      - tei-cache:/data
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://127.0.0.1:8000/health"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    labels:
      - homepage.icon=/icons/hugging-face.png
      - homepage.group=10-inference
      - homepage.name=TEI_Reranking
      - homepage.description=Embedding inference engine
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0

  vllm-embedding:
    image: docker.io/vllm/vllm-openai-cpu:v0.28.0-x86_64
    container_name: ${STACK_NAME}-vllm-embedding
    restart: on-failure:3
    ipc: host
    profiles:
      - inference
    command:
      - "Qwen/Qwen3-Embedding-0.6B"
      # - "/models/Qwen3-Embedding-0.6B"
      - --runner
      - pooling
      - --convert
      - embed
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - "Qwen/Qwen3-Embedding-0.6B"
      - --dtype
      - auto
      # - --gpu-memory-utilization
      # - "0.05"
      - --kv-cache-memory-bytes
      - "1G"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_CPU_OMP_THREADS_BIND: "0-3"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - vllm-cache:/root/.cache/huggingface
      # - /srv/huggingface:/models:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    # mem_limit: 8g
    # memswap_limit: 8g
    # cpus: 4.0
    labels:
      - homepage.icon=/icons/vllm.png
      - homepage.group=10-inference
      - homepage.name=vLLM_Embedding
      - homepage.description=Embedding inference engine

  vllm-reranking:
    image: docker.io/vllm/vllm-openai-cpu:v0.28.0-x86_64
    container_name: ${STACK_NAME}-vllm-reranking
    restart: on-failure:3
    ipc: host
    profiles:
      - inference
    command:
      - "Qwen/Qwen3-Reranker-0.6B"
      # - "/models/Qwen3-Reranker-0.6B"
      - --runner
      - pooling
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - "Qwen/Qwen3-Reranker-0.6B"
      - --dtype
      - auto
      # - --gpu-memory-utilization
      # - "0.05"
      - --kv-cache-memory-bytes
      - "1G"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --hf-overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /config/qwen3_reranker.jinja
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      # VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: "4-5"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - vllm-cache:/root/.cache/huggingface
      # - /srv/huggingface:/models:ro
      - ./vllm/qwen3_reranker.jinja:/config/qwen3_reranker.jinja:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" > /dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s
    # mem_limit: 8g
    # memswap_limit: 8g
    # cpus: 4.0
    labels:
      - homepage.icon=/icons/vllm.png
      - homepage.group=10-inference
      - homepage.name=vLLM_Reranking
      - homepage.description=Reranking inference engine

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.1
    # image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.8.1
    container_name: ${STACK_NAME}-kokoro
    restart: unless-stopped
    profiles:
      - inference
    environment:
      DEFAULT_VOICE: jf_alpha
      DEFAULT_VOICE_CODE: j
      USE_GPU: "false"
      DEVICE_TYPE: cpu
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8880/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - homepage.group=10-inference
      - homepage.name=Kokoro-TTS
      - homepage.description=Text-to-Speech Engine
      - homepage.href=http://${PUBLIC_HOST}:31005/web
      - homepage.icon=/icons/kokoro-web.png

  hermes-agent:
    <<: *external-dns-stabilizer
    image: docker.io/nousresearch/hermes-agent:v2026.8.31
    container_name: ${STACK_NAME}-hermes-agent
    restart: unless-stopped
    profiles:
      - inference
      - hermes-agent
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        exec /init /opt/hermes/docker/main-wrapper.sh gateway run
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      # https://hermes-agent.nousresearch.com/docs/reference/environment-variables
      ### OpenAI-Compatible API
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:-hermes-agent-secret-key}
      GATEWAY_ALLOWED_USERS: ${HERMES_AGENT_GATEWAY_ALLOWED_USERS:-}
      GATEWAY_ALLOW_ALL_USERS: "true"
      REPORT_TIMEZONE: Asia/Tokyo
      ### Web Dashboard
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pw-hermes-agent-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-sk-hermes-agent-dashboard-secret}
      ### Open-WebUI
      OPEN_WEBUI_BASE_URL: http://open-webui:8080
      OPEN_WEBUI_PUBLIC_URL: http://${PUBLIC_HOST}:31001
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_DEFAULT_CHANNEL: general
      OPEN_WEBUI_CHANNELS_LIST_PATH: /api/v1/channels/
      OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE: /api/v1/channels/{channel_id}/messages/post
      OPEN_WEBUI_CHATS_ALL_DB_PATH: /api/v1/chats/all/db
      OPEN_WEBUI_MAX_MESSAGE_CHARS: "20000"
      ### Discord
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME:-}
      DISCORD_AUTO_THREAD: false
      VOICE_TOOLS_OPENAI_KEY: not-needed
      ### SearXNG
      SEARXNG_URL: "http://searxng:8080/"
      ### docling-serve
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_API_KEY: ${DOCLING_SERVE_API_KEY:-sk-docling-serve-api-key}
      DOCLING_MCP_SERVICE_API_KEY: ${DOCLING_SERVE_API_KEY:-sk-docling-serve-api-key}
      ### Model providers
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CODEX_HOME: /opt/data/.codex
      UV_LINK_MODE: copy
      UV_NO_CACHE: "true"
      HERMES_UID: 1000
      HERMES_GID: 1000
    ports:
      - 31001:9119
    volumes:
      - hermes-data:/opt/data
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/hooks/install-skills:/opt/data/hooks/install-skills:ro
      - ./hermes/plugins/langfuse-headers:/opt/data/plugins/langfuse-headers:ro
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/hermes-icon.png
      - homepage.group=10-inference
      - homepage.name=Hermes-Agent
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31001

  # Discord pluginは公式imageとは別に永続volumeへ導入する。
  openclaw-init:
    <<: *external-dns-stabilizer
    image: ghcr.io/openclaw/openclaw:2026.8.2-browser
    container_name: ${STACK_NAME}-openclaw-init
    user: "0:0"
    restart: "no"
    profiles:
      - inference
      - openclaw
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.managed.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      XDG_CACHE_HOME: /tmp/cache
      TZ: Asia/Tokyo
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/openclaw.json:/home/node/.openclaw/openclaw.managed.json:ro
    networks:
      - internal-nw
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        # 個別bind mountでroot所有になり得るworkspaceを、実行userが書き込める状態へ戻す。
        install -d -o node -g node -m 0755 /home/node/.openclaw/workspaces
        # coreと同じrelease cohortのDiscord pluginへ永続volumeを収束させる。
        plugin_json="$$(setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins list --json)"
        plugin_version="$$(printf '%s' "$$plugin_json" | node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(data.plugins.find((plugin) => plugin.id === "discord")?.version ?? "");')"
        if [ "$$plugin_version" = "2026.8.2" ]; then
          echo "Discord plugin is already at 2026.8.2."
        elif [ -n "$$plugin_version" ]; then
          setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins update @openclaw/discord@2026.8.2 --accept-capabilities
        else
          setpriv --reuid=node --regid=node --init-groups node dist/index.js plugins install @openclaw/discord@2026.8.2 --pin --accept-capabilities
        fi
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  # https://github.com/openclaw/openclaw/blob/main/docker-compose.yml
  # https://docs.openclaw.ai/install/docker
  openclaw:
    <<: *external-dns-stabilizer
    image: ghcr.io/openclaw/openclaw:2026.8.2-browser
    container_name: ${STACK_NAME}-openclaw
    restart: unless-stopped
    profiles:
      - inference
      - openclaw
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # host側.envのpathをcontainer内の実行時pathへ漏らさない。
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.managed.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspaces
      XDG_CACHE_HOME: /tmp/cache
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-sk-openclaw-gateway-token}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ""
      OPENCLAW_DISABLE_BONJOUR: ""
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DISCORD_BOT_TOKEN: ${OPENCLAW_DISCORD_BOT_TOKEN:-}
      TZ: Asia/Tokyo
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    ports:
      - 31002:18789
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/openclaw.json:/home/node/.openclaw/openclaw.managed.json:ro
      - ./openclaw/AGENTS.md:/home/node/.openclaw/workspaces/AGENTS.md:ro
      - ./openclaw/IDENTITY.md:/home/node/.openclaw/workspaces/IDENTITY.md:ro
      - ./openclaw/SOUL.md:/home/node/.openclaw/workspaces/SOUL.md:ro
    networks:
      - internal-nw
    # cap_drop:
    #   - NET_RAW
    #   - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    init: true
    healthcheck:
      test: [ "CMD", "node", "dist/index.js", "health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - homepage.icon=/icons/openclaw.png
      - homepage.group=10-inference
      - homepage.name=OpenClaw
      - homepage.description=AI agent
      - homepage.href=http://${PUBLIC_HOST}:31002

  # https://qwenpaw.agentscope.io/docs/channels#Discord
  # https://github.com/agentscope-ai/QwenPaw/blob/main/docker-compose.yml
  qwenpaw-init:
    image: docker.io/agentscope/qwenpaw:v2.1.0
    container_name: ${STACK_NAME}-qwenpaw-init
    restart: no
    profiles:
      - inference
      - qwenpaw
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      QWENPAW_DISCORD_BOT_TOKEN: ${QWENPAW_DISCORD_BOT_TOKEN:-}
      QWENPAW_ENABLED_CHANNELS: console,discord
      TZ: Asia/Tokyo
    entrypoint:
      - /opt/inferlab/init.sh
    volumes:
      - ./qwenpaw/init.sh:/opt/inferlab/init.sh:ro
      - ./qwenpaw/configure.py:/opt/inferlab/configure.py:ro
      - qwenpaw-data:/app/working
      - qwenpaw-secrets:/app/working.secret
      - qwenpaw-backups:/app/working.backups
    networks:
      - internal-nw

  qwenpaw:
    <<: *external-dns-stabilizer
    image: docker.io/agentscope/qwenpaw:v2.1.0
    container_name: ${STACK_NAME}-qwenpaw
    restart: unless-stopped
    profiles:
      - inference
      - qwenpaw
    init: true
    environment:
      QWENPAW_PORT: "8088"
      QWENPAW_AUTH_ENABLED: "true"
      QWENPAW_AUTH_USERNAME: ${QWENPAW_AUTH_USERNAME:-qwenpaw-admin}
      QWENPAW_AUTH_PASSWORD: ${QWENPAW_AUTH_PASSWORD:-pw-qwenpaw-admin-password}
      QWENPAW_ENABLED_CHANNELS: console,discord
      TZ: Asia/Tokyo
    ports:
      - 31003:8088
    volumes:
      - qwenpaw-data:/app/working
      - qwenpaw-secrets:/app/working.secret
      - qwenpaw-backups:/app/working.backups
      - ./qwenpaw/persona/AGENTS.md:/app/working/workspaces/default/AGENTS.md
      - ./qwenpaw/persona/SOUL.md:/app/working/workspaces/default/SOUL.md
      - ./qwenpaw/persona/PROFILE.md:/app/working/workspaces/default/PROFILE.md
    networks:
      - internal-nw
    depends_on:
      qwenpaw-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 60s
    labels:
      - homepage.icon=/icons/qwenpaw.png
      - homepage.group=10-inference
      - homepage.name=QwenPaw
      - homepage.description=Personal AI agent
      - homepage.href=http://${PUBLIC_HOST}:31003

volumes:
  ollama-cache:
  openclaw-data:
  qwenpaw-data:
  qwenpaw-secrets:
  qwenpaw-backups:
  tei-cache:
  vllm-cache:
  hermes-data:

networks:
  internal-nw:
