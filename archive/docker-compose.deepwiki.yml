services:
  deepwiki-open:
    container_name: worklab-alfa-llm-deepwiki-open
    restart: unless-stopped
    profiles:
      - deepwiki
    image: ghcr.io/asyncfuncai/deepwiki-open:latest
    environment:
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-worklab-litellm}
      OPENAI_BASE_URL: http://litellm:4000/v1
      PORT: 8001
    volumes:
      - deepwiki-open-data:/root/.adalflow
    networks:
      - llm-internal

volumes:
  deepwiki-open-data:

networks:
  llm-internal:
