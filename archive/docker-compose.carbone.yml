services:
  carbone:
    container_name: inferlab-carbone
    restart: unless-stopped
    profiles:
      - carbone
    image: docker.io/carbone/carbone-ee:full-5.4.5
    environment:
      LANG: C.UTF-8
      CARBONE_EE_BIND: 0.0.0.0
      CARBONE_EE_PORT: 4000
      CARBONE_EE_LICENSE: ${CARBONE_EE_LICENSE:-}
    volumes:
      - carbone-data:/app/data
      - carbone-templates:/app/template
      - carbone-renders:/app/render
    networks:
      - llm-internal

  carbone-mcp:
    container_name: inferlab-carbone-mcp
    restart: unless-stopped
    profiles:
      - carbone
    image: docker.io/carbone/carbone-mcp:1.1.1
    environment:
      CARBONE_BASE_URL: http://carbone:4000
      MCP_TRANSPORT: http
      MCP_PORT: 3000
      MCP_PATH: /
    depends_on:
      carbone:
        condition: service_started
    networks:
      - llm-internal

  carbone-gateway:
    build:
      context: ./carbone-gateway
      dockerfile: Dockerfile
    container_name: inferlab-carbone-gateway
    restart: unless-stopped
    profiles:
      - carbone
    environment:
      CARBONE_BASE_URL: ${CARBONE_BASE_URL:-http://carbone:4000}
      CARBONE_API_KEY: ${CARBONE_API_KEY:-}
      CARBONE_TIMEOUT_SECONDS: ${CARBONE_TIMEOUT_SECONDS:-300}
      CARBONE_GATEWAY_PUBLIC_URL: ${CARBONE_GATEWAY_PUBLIC_URL:-http://localhost:31010}
      CARBONE_OUTPUT_DIR: /app/outputs
    ports:
      - "${CARBONE_GATEWAY_HOST_PORT:-31010}:8080"
    volumes:
      - ./carbone/outputs:/app/outputs
    depends_on:
      carbone:
        condition: service_started
    networks:
      - llm-internal

volumes:
  carbone-data:
  carbone-templates:
  carbone-renders:

networks:
  llm-internal:
