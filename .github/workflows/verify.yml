name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify shell, Python, and Compose config
        env:
          STACK_NAME: ci-static-validation
        run: tests/verify-init-static.sh

  compose-smoke:
    name: Compose smoke (${{ matrix.smoke_case }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        smoke_case:
          - dify-postgres-init
          - pypiserver-readonly
          - oikb-bucket-init
          - ragflow-bucket-init
          - langfuse-bucket-init
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run minimal Compose smoke
        run: tests/verify-compose-smoke.sh "${{ matrix.smoke_case }}"
