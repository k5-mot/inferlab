name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shell, Python, and Compose config
        run: script/verify-init-static.sh

  compose-smoke:
    name: Compose smoke (${{ matrix.smoke_case }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        smoke_case:
          - bookstack-init
          - dify-postgres-init
          - oikb-bucket-init
          - langfuse-bucket-init
          - gitea-keycloak-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run minimal Compose smoke
        run: script/verify-compose-smoke.sh "${{ matrix.smoke_case }}"

  playwright-e2e:
    name: Playwright E2E (${{ matrix.smoke_case }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        smoke_case:
          - bookstack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run minimal Playwright E2E
        run: tests/e2e/run-playwright-smoke.sh "${{ matrix.smoke_case }}"
