#
# 参考資料
# - pypiserver
#   - https://github.com/pypiserver/pypiserver
# - Verdaccio
#   - https://verdaccio.org/docs/docker/
# - createrepo_c
#   - https://github.com/rpm-software-management/createrepo_c
# - reprepro
#   - https://salsa.debian.org/debian/reprepro
# - code-marketplace
#   - https://github.com/coder/code-marketplace
# - registry
#   - https://hub.docker.com/_/registry
#
name: ${STACK_NAME:?STACK_NAME is required}

services:
  docker-registry:
    image: docker.io/library/registry:3.1.1
    container_name: ${STACK_NAME}-docker-registry
    restart: unless-stopped
    profiles:
      - registry
    ports:
      - 31205:5000
    volumes:
      - docker-registry-data:/var/lib/registry
    networks:
      - internal-nw
    labels:
      - homepage.group=12-registry
      - homepage.name=Docker Registry
      - homepage.href=http://${PUBLIC_HOST}:31205/v2/
      - homepage.description=Container image registry
      - homepage.icon=/icons/docker.png
    healthcheck:
      test:
        - CMD
        - registry
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pypiserver:
    image: pypiserver/pypiserver:v2.4.1
    container_name: ${STACK_NAME}-pypiserver
    restart: unless-stopped
    profiles:
      - registry
    command:
      - run
    ports:
      - 31200:8080
    volumes:
      - /srv/12-registry/pypi:/data/packages:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/simple/', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - homepage.group=12-registry
      - homepage.name=PyPIserver
      - homepage.href=http://${PUBLIC_HOST}:31200/simple/
      - homepage.description=Python package registry
      - homepage.icon=/icons/pypi.png

  verdaccio:
    image: verdaccio/verdaccio:6.10.0
    container_name: ${STACK_NAME}-verdaccio
    restart: unless-stopped
    profiles:
      - registry
    ports:
      - 31201:4873
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('http'); const req=http.get('http://127.0.0.1:4873/', res => process.exit(res.statusCode < 500 ? 0 : 1)); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => req.destroy());"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - homepage.group=12-registry
      - homepage.name=Verdaccio
      - homepage.href=http://${PUBLIC_HOST}:31201/
      - homepage.description=npm registry
      - homepage.icon=/icons/verdaccio.png

  code-marketplace:
    image: ghcr.io/coder/code-marketplace:v2.4.2
    container_name: ${STACK_NAME}-code-marketplace
    restart: unless-stopped
    profiles:
      - registry
    command:
      - --address=0.0.0.0:3000
      - --extensions-dir=/extensions
    ports:
      - 31202:3000
    volumes:
      - code-marketplace-extensions:/extensions:ro
    networks:
      - internal-nw
    depends_on:
      - code-marketplace-importer
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - homepage.group=12-registry
      - homepage.name=Code Marketplace
      - homepage.href=http://${PUBLIC_HOST}:31202/api
      - homepage.description=VS Code extension marketplace
      - homepage.icon=/icons/visual-studio-code.png

  code-marketplace-importer:
    image: ghcr.io/coder/code-marketplace:v2.4.2
    container_name: ${STACK_NAME}-code-marketplace-importer
    restart: unless-stopped
    profiles:
      - registry
    entrypoint: []
    environment:
      CODE_MARKETPLACE_IMPORT_INTERVAL_SECONDS: 300
    command:
      - sh
      - /usr/local/bin/import-vsix-extensions
    volumes:
      - /srv/12-registry/vsix:/imports:ro
      - code-marketplace-extensions:/extensions
      - ./code-marketplace-importer/import-vsix-extensions.sh:/usr/local/bin/import-vsix-extensions:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/cmdline && grep -q import-vsix-extensions /proc/1/cmdline
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  npm-importer:
    image: node:22.22.3-alpine
    container_name: ${STACK_NAME}-npm-importer
    profiles:
      - registry
    restart: unless-stopped
    working_dir: /work
    environment:
      NPM_IMPORT_ENABLED: true
      NPM_IMPORT_INTERVAL_SECONDS: 30
      NPM_PUBLISH_TOKEN: ${NPM_PUBLISH_TOKEN:-local-publish-token}
    command:
      - sh
      - /usr/local/bin/import-npm-packages
    volumes:
      - /srv/12-registry/npm-packages:/imports:ro
      - ./npm-importer/import-npm-packages.sh:/usr/local/bin/import-npm-packages:ro
    networks:
      - internal-nw
    depends_on:
      verdaccio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/cmdline && grep -q import-npm-packages /proc/1/cmdline
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  createrepo_c:
    image: docker.io/openitcockpit/createrepo_c:bullseye-0.17.0
    container_name: ${STACK_NAME}-createrepo_c
    profiles:
      - registry
    restart: unless-stopped
    user: "0:0"
    entrypoint: []
    environment:
      REPOSITORY_SYNC_INTERVAL_SECONDS: 30
    command:
      - bash
      - /usr/local/bin/sync-rpm-repository
    volumes:
      - /srv/12-registry/rpm:/repo
      - ./rpm-repository-sync/publish-rpm-repository.sh:/usr/local/bin/publish-rpm-repository:ro
      - ./rpm-repository-sync/sync-rpm-repository.sh:/usr/local/bin/sync-rpm-repository:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/cmdline && grep -q sync-rpm-repository /proc/1/cmdline
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rpm-dist:
    image: nginxinc/nginx-unprivileged:1.31.4-alpine
    container_name: ${STACK_NAME}-rpm-dist
    restart: unless-stopped
    profiles:
      - registry
    ports:
      - 31203:8080
    volumes:
      - /srv/12-registry/rpm:/usr/share/nginx/html:ro
    networks:
      - internal-nw
    depends_on:
      - createrepo_c
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - homepage.group=12-registry
      - homepage.name=createrepo_c
      - homepage.href=http://${PUBLIC_HOST}:31203/
      - homepage.description=RPM source repository for dnf/yum
      - homepage.icon=/icons/redhat-linux.png

  reprepro:
    image: docker.io/eilandert/reprepro@sha256:96dbd4cdbbb5c26893a7270c8949393211aaa0ec3ff05bf1ebd22da35347e64c
    container_name: ${STACK_NAME}-reprepro
    profiles:
      - registry
    restart: unless-stopped
    user: "0:0"
    entrypoint: []
    environment:
      DEB_ARCHITECTURES: amd64 arm64
      DEB_CODENAME: stable
      DEB_COMPONENT: main
      DEB_DISTRIBUTION: stable
      DEB_LABEL: Local
      DEB_ORIGIN: Local
      REPOSITORY_SYNC_INTERVAL_SECONDS: 30
    command:
      - bash
      - /usr/local/bin/sync-deb-repository
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /repo/public/dists/stable/Release
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - /srv/12-registry/deb:/repo
      - ./deb-repository-sync/publish-deb-repository.sh:/usr/local/bin/publish-deb-repository:ro
      - ./deb-repository-sync/sync-deb-repository.sh:/usr/local/bin/sync-deb-repository:ro
    networks:
      - internal-nw

  deb-dist:
    image: nginxinc/nginx-unprivileged:1.31.4-alpine
    container_name: ${STACK_NAME}-deb-dist
    restart: unless-stopped
    profiles:
      - registry
    ports:
      - 31204:8080
    volumes:
      - /srv/12-registry/deb/public:/usr/share/nginx/html:ro
    networks:
      - internal-nw
    depends_on:
      - reprepro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - homepage.group=12-registry
      - homepage.name=reprepro
      - homepage.href=http://${PUBLIC_HOST}:31204/
      - homepage.description=APT repository
      - homepage.icon=/icons/debian-linux.png

volumes:
  code-marketplace-extensions:
  docker-registry-data:
  verdaccio-storage:

networks:
  internal-nw:
