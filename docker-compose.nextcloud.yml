services:
  nextcloud:
    image: docker.io/library/nextcloud:34.0.1-apache
    container_name: nextcloud
    restart: unless-stopped
    profiles:
      - nextcloud
    depends_on:
      nextcloud-mariadb:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${NEXTCLOUD_MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_MYSQL_PASSWORD:-nextcloud_password}
      MYSQL_HOST: nextcloud-mariadb
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1 ${PUBLIC_HOST:?PUBLIC_HOST must be set} nextcloud}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_INIT_HTACCESS: "true"
      OVERWRITECLIURL: ${NEXTCLOUD_PUBLIC_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:31012}
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT:-1024M}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_PHP_UPLOAD_LIMIT:-2G}
      APACHE_BODY_LIMIT: ${NEXTCLOUD_APACHE_BODY_LIMIT:-0}
      NEXTCLOUD_OIDC_PROVIDER_ID: ${NEXTCLOUD_OIDC_PROVIDER_ID:-keycloak}
      NEXTCLOUD_OIDC_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID:-nextcloud}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET:-nextcloud-oauth-client-secret-key}
      NEXTCLOUD_OIDC_DISCOVERY_URL: ${NEXTCLOUD_OIDC_DISCOVERY_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:30000/realms/inferlab/.well-known/openid-configuration}
      NEXTCLOUD_OIDC_SCOPE: ${NEXTCLOUD_OIDC_SCOPE:-openid profile email}
      NEXTCLOUD_OIDC_MAPPING_UID: ${NEXTCLOUD_OIDC_MAPPING_UID:-preferred_username}
      NEXTCLOUD_OIDC_MAPPING_DISPLAY_NAME: ${NEXTCLOUD_OIDC_MAPPING_DISPLAY_NAME:-name}
      NEXTCLOUD_OIDC_MAPPING_EMAIL: ${NEXTCLOUD_OIDC_MAPPING_EMAIL:-email}
      NEXTCLOUD_OIDC_MAPPING_GROUPS: ${NEXTCLOUD_OIDC_MAPPING_GROUPS:-groups}
      NEXTCLOUD_OIDC_UNIQUE_UID: ${NEXTCLOUD_OIDC_UNIQUE_UID:-0}
      NEXTCLOUD_OIDC_GROUP_PROVISIONING: ${NEXTCLOUD_OIDC_GROUP_PROVISIONING:-1}
      NEXTCLOUD_OIDC_ALLOW_INSECURE_HTTP: ${NEXTCLOUD_OIDC_ALLOW_INSECURE_HTTP:-true}
      NEXTCLOUD_ALLOW_LOCAL_REMOTE_SERVERS: ${NEXTCLOUD_ALLOW_LOCAL_REMOTE_SERVERS:-true}
    ports:
      - "31012:80"
    volumes:
      - nextcloud:/var/www/html
      - ./nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./nextcloud/hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
    networks:
      - llm-public
      - llm-internal
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/status.php\") === false ? 1 : 0);'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  nextcloud-mariadb:
    image: docker.io/library/mariadb:12.3.2-noble
    container_name: nextcloud-mariadb
    restart: unless-stopped
    profiles:
      - nextcloud
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_MYSQL_ROOT_PASSWORD:-nextcloud_root_password}
      MYSQL_PASSWORD: ${NEXTCLOUD_MYSQL_PASSWORD:-nextcloud_password}
      MYSQL_DATABASE: ${NEXTCLOUD_MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_MYSQL_USER:-nextcloud}
    volumes:
      - nextcloud-mariadb:/var/lib/mysql
    networks:
      - llm-internal
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nextcloud-redis:
    image: docker.io/library/redis:8.8.0-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    profiles:
      - nextcloud
    networks:
      - llm-internal
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  oikb:
    image: ghcr.io/open-webui/oikb:0.3.6
    container_name: oikb
    restart: unless-stopped
    command: daemon --config /app/.oikb.yaml
    profiles:
      - nextcloud
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OIKB_API_KEY: ${OIKB_API_KEY:-}
      LOG_FORMAT: ${OIKB_LOG_FORMAT:-json}
      NEXTCLOUD_URL: ${OIKB_NEXTCLOUD_URL:-http://nextcloud}
      NEXTCLOUD_USER: ${OIKB_NEXTCLOUD_USER:-${NEXTCLOUD_ADMIN_USER:-admin}}
      NEXTCLOUD_PASSWORD: ${OIKB_NEXTCLOUD_PASSWORD:-${NEXTCLOUD_ADMIN_PASSWORD:-admin}}
      NEXTCLOUD_OPENWEBUI_KB_ID: ${NEXTCLOUD_OPENWEBUI_KB_ID:-replace-with-openwebui-kb-id}
      OIKB_NEXTCLOUD_SOURCE: ${OIKB_NEXTCLOUD_SOURCE:-/nextcloud/data/admin/files/Documents}
      OIKB_NEXTCLOUD_INTERVAL: ${OIKB_NEXTCLOUD_INTERVAL:-1h}
    ports:
      - "${OIKB_HOST_PORT:-31013}:8080"
    volumes:
      - ./oikb/oikb.yaml:/app/.oikb.yaml:ro
      - nextcloud:/nextcloud:ro
    networks:
      - llm-public
      - llm-internal
    depends_on:
      nextcloud:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health', timeout=3).read()" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nextcloud:
  nextcloud-mariadb:

networks:
  llm-public:
  llm-internal:
