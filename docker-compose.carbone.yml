services:
  carbone:
    container_name: worklab-alfa-llm-carbone
    restart: unless-stopped
    image: docker.io/carbone/carbone-ee:full-5.4.5
    environment:
      LANG: C.UTF-8
      CARBONE_EE_BIND: 0.0.0.0
      CARBONE_EE_PORT: 4000
      CARBONE_EE_LICENSE: ${CARBONE_EE_LICENSE:-}
    volumes:
      - carbone-data:/app/data
      - carbone-templates:/app/template
      - carbone-renders:/app/render
    networks:
      - llm-internal

  carbone-mcp:
    container_name: worklab-alfa-llm-carbone-mcp
    restart: unless-stopped
    image: docker.io/carbone/carbone-mcp:1.1.1
    environment:
      CARBONE_BASE_URL: http://carbone:4000
      MCP_TRANSPORT: http
      MCP_PORT: 3000
      MCP_PATH: /
    depends_on:
      carbone:
        condition: service_started
    networks:
      - llm-internal

volumes:
  carbone-data:
  carbone-templates:
  carbone-renders:

networks:
  llm-internal:
