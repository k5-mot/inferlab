model:
  provider: openai-codex
  default: gpt-5.4

# fallback_model:
#   provider: custom
#   model: gpt-oss:120b
#   base_url: http://ollama:11434/v1
#   api_key: sk-litellm-master-key

fallback_model:
  provider: custom
  model: gemma4:31b
  base_url: http://litellm:4000/v1
  api_key: sk-litellm-master-key

skills:
  external_dirs:
    - /opt/inferlab/skills

mcp_servers:
  rss:
    command: "node"
    args: ["/opt/data/node_modules/rss-mcp/dist/index.js"]

terminal:
  env_passthrough:
    - REPORT_TIMEZONE
    - OPEN_WEBUI_BASE_URL
    - OPEN_WEBUI_PUBLIC_URL
    - OPEN_WEBUI_API_KEY
    - OPEN_WEBUI_DEFAULT_CHANNEL
    - OPEN_WEBUI_CHANNELS_LIST_PATH
    - OPEN_WEBUI_CHANNELS_POST_PATH_TEMPLATE
    - OPEN_WEBUI_CHATS_ALL_DB_PATH
    - OPEN_WEBUI_MAX_MESSAGE_CHARS
    - OPEN_WEBUI_TIMEOUT_SECONDS
    - OPEN_WEBUI_MAX_RETRIES
    - PYTHONPATH
    - LANGFUSE_HOST
    - LANGFUSE_PUBLIC_KEY
    - LANGFUSE_SECRET_KEY
