version: 1

scheduler:
  timezone: Asia/Tokyo

storage:
  source_store_path: /data/knowledge-source
  state_database_path: /data/knowledge-source/state/platform.db

defaults:
  ingest:
    retry:
      max_attempts: 3
      backoff: exponential
      initial_delay: 30s
      max_delay: 10m
    rate_limit:
      requests_per_minute: 60

sources:
  gitlab:
    enabled: false
    base_url: http://gitlab
    credential:
      token_env: GITLAB_TOKEN
    ingest:
      schedule: "*/5 * * * *"
      rate_limit:
        requests_per_minute: 120
    include:
      projects: []
    exclude:
      paths:
        - "**/node_modules/**"

  zulip:
    enabled: false
    base_url: https://zulip
    credential:
      email_env: ZULIP_BOT_EMAIL
      api_key_env: ZULIP_API_KEY
    ingest:
      schedule: "*/10 * * * *"
    include:
      channels: []

  nextcloud:
    enabled: false
    base_url: http://nextcloud
    credential:
      username_env: NEXTCLOUD_USERNAME
      password_env: NEXTCLOUD_PASSWORD
    ingest:
      schedule: "*/30 * * * *"
      retry:
        max_attempts: 5
    include:
      paths:
        - /Engineering
        - /Product
        - /Projects
        - /Shared/Architecture
    exclude:
      paths:
        - /Personal
        - /Temp

  kaneo:
    enabled: false
    base_url: http://kaneo:5173
    credential:
      token_env: KANEO_TOKEN
    ingest:
      schedule: "*/5 * * * *"
    include:
      projects: []

openkb:
  base_url: http://openkb:7566
  knowledge_base: internal-wiki
  # OpenKB REST APIに生成page本文のread endpointがないためread-only mountを使用する。
  generated_wiki_path: /openkb-kbs/internal-wiki/wiki
  credential:
    token_env: OPENKB_TOKEN
  llm:
    model: openai/gpt-oss:20b
    api_key_env: LITELLM_MASTER_KEY
    openai_api_base: http://litellm:4000/v1

bookstack:
  base_url: http://bookstack
  human_wiki:
    shelf: Human Wiki
  llm_wiki:
    shelf: LLM Wiki
    books:
      concepts: Concepts
      entities: Entities
      projects: Projects
      systems: Systems
      decisions: Decisions
      sources: Sources
      summaries: Summaries
      syntheses: Syntheses
  ingest:
    enabled: false
    schedule: "*/10 * * * *"
  reader_credential:
    token_id_env: BOOKSTACK_READER_TOKEN_ID
    token_secret_env: BOOKSTACK_READER_TOKEN_SECRET
  publisher_credential:
    token_id_env: BOOKSTACK_PUBLISHER_TOKEN_ID
    token_secret_env: BOOKSTACK_PUBLISHER_TOKEN_SECRET

pipeline:
  compile:
    enabled: false
    schedule: "*/30 * * * *"
    trigger:
      on_ingest_batch_completed: false
      min_changed_documents: 10
      max_delay: 2h
  publish:
    enabled: false
    mode: after_successful_compile
    require_validation: false
    dry_run: false
    deletion_policy: mark_unavailable
