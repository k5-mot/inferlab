services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:26.05.2
    container_name: ${STACK_NAME}-bookstack
    restart: unless-stopped
    profiles:
      - bookstack
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Tokyo
      APP_URL: http://${PUBLIC_HOST}:33100
      APP_KEY: ${BOOKSTACK_APP_KEY:-base64:8Xpuu6D/PftKO7GAZWORsKIw1rveODqBcEyU8HKaxCA=}
      DB_HOST: bookstack-mariadb
      DB_PORT: "3306"
      DB_USERNAME: bs_db_user
      DB_PASSWORD: bs_db_password
      DB_DATABASE: bookstack
      QUEUE_CONNECTION: database
      AUTH_METHOD: oidc
      AUTH_AUTO_INITIATE: false
      OIDC_NAME: Keycloak
      OIDC_DISPLAY_NAME_CLAIMS: name
      OIDC_CLIENT_ID: bookstack
      OIDC_CLIENT_SECRET: ${BOOKSTACK_OIDC_CLIENT_SECRET:-sk-bookstack-oidc-client-secret-key}
      OIDC_ISSUER: https://${PUBLIC_HOST}:30002/realms/prod
      OIDC_ISSUER_DISCOVER: true
      OIDC_EXTERNAL_ID_CLAIM: preferred_username
      OIDC_END_SESSION_ENDPOINT: false
      OIDC_USER_TO_GROUPS: true
      OIDC_GROUPS_CLAIM: groups
      OIDC_REMOVE_FROM_GROUPS: false
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "33100:80"
    volumes:
      - bookstack-config:/config
      - ../01-keycloak/keycloak/certs/keycloak.crt:/usr/local/share/ca-certificates/keycloak.crt:ro
      - bookstack-custom-cont-init:/custom-cont-init.d:ro
    networks:
      - internal-nw
    depends_on:
      bookstack-custom-init:
        condition: service_completed_successfully
      bookstack-mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1/login > /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - homepage.group=31-bookstack
      - homepage.name=BookStack
      - homepage.href=http://${PUBLIC_HOST}:33100
      - homepage.description=Team documentation wiki
      - homepage.icon=/icons/bookstack.png

  bookstack-custom-init:
    image: alpine:3.24.1
    container_name: ${STACK_NAME}-bookstack-custom-init
    restart: "no"
    network_mode: none
    profiles:
      - bookstack
    command:
      - sh
      - -ec
      - |
        # host bindをBookStack本体へ直接mountせず、init scriptの権限をcontainer側に固定する。
        rm -rf /target/*
        cp -R /source/. /target/
        chown -R root:root /target
        find /target -type d -exec chmod 755 {} +
        find /target -type f -exec chmod 755 {} +
    volumes:
      - ./custom-cont-init.d:/source:ro
      - bookstack-custom-cont-init:/target

  bookstack-mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.12
    container_name: ${STACK_NAME}-bookstack-mariadb
    restart: unless-stopped
    profiles:
      - bookstack
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: bs_db_root_password
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bs_db_user
      MYSQL_PASSWORD: bs_db_password
    volumes:
      - bookstack-mariadb-config:/config
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - homepage.icon=/icons/mariadb.png
      - homepage.group=31-bookstack
      - homepage.name=BookStack-MariaDB
      - homepage.description=MySQL-compatible relational database

volumes:
  bookstack-config:
  bookstack-custom-cont-init:
  bookstack-mariadb-config:

networks:
  internal-nw:
