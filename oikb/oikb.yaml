defaults:
  interval: "${OIKB_NEXTCLOUD_INTERVAL:-1h}"
  concurrency: 4
  filter:
    max-size: 50mb

sources:
  - name: nextcloud-documents
    source: "${OIKB_NEXTCLOUD_SOURCE:-nextcloud:/Documents}"
    kb-id: "${NEXTCLOUD_OPENWEBUI_KB_ID:-replace-with-openwebui-kb-id}"
    filter:
      exclude:
        - "**/.DS_Store"
        - "**/Thumbs.db"
