global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  # AMD ROCm対応GPU環境でamd-device-metrics-exporter serviceを有効化した場合のみ使う。
  # - job_name: amd-device-metrics-exporter
  #   static_configs:
  #     - targets:
  #         - amd-device-metrics-exporter:5000

  # NVIDIA GPU環境でnvidia-dcgm-exporter serviceを有効化した場合のみ使う。
  # - job_name: nvidia-dcgm-exporter
  #   static_configs:
  #     - targets:
  #         - nvidia-dcgm-exporter:9400

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http.yaml
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets:
          - cloudflare:20241

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:9000
          - keycloak-https:9000

  - job_name: couchdb
    metrics_path: /_node/_local/_prometheus
    basic_auth:
      username: "__COUCHDB_USER__"
      password: "__COUCHDB_PASSWORD__"
    static_configs:
      - targets:
          - couchdb:5984

  - job_name: nextcloud
    metrics_path: /metrics
    static_configs:
      - targets:
          - nextcloud:80

  - job_name: text-embeddings-inference
    metrics_path: /metrics
    static_configs:
      - targets:
          - tei-embedding:8000
          - tei-reranking:8000

  - job_name: litellm
    metrics_path: /metrics
    authorization:
      credentials: "__LITELLM_MASTER_KEY__"
    static_configs:
      - targets:
          - litellm:4000

  - job_name: searxng
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password: sk-searxng-openmetrics-password
    static_configs:
      - targets:
          - searxng:8080

  - job_name: gitea
    metrics_path: /metrics
    static_configs:
      - targets:
          - gitea:3000

  - job_name: qdrant
    metrics_path: /metrics
    http_headers:
      api-key:
        secrets:
          - sk-qdrant-api-key
    static_configs:
      - targets:
          - qdrant:6333
          - dify-qdrant:6333

  - job_name: postgres-exporters
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak-postgres-exporter:9187
          - nextcloud-postgres-exporter:9187
          - langfuse-postgres-exporter:9187
          - gitea-postgres-exporter:9187
          - dify-postgres-exporter:9187
          - zulip-postgres-exporter:9187
          - pulp-postgres-exporter:9187

  - job_name: redis-exporters
    metrics_path: /metrics
    static_configs:
      - targets:
          - dify-redis-exporter:9121
          - zulip-redis-exporter:9121
          - pulp-redis-exporter:9121

  - job_name: mysqld-exporters
    metrics_path: /metrics
    static_configs:
      - targets:
          - leantime-mysqld-exporter:9104
          - bookstack-mysqld-exporter:9104

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - zulip-rabbitmq:15692

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - langfuse-clickhouse:9363
