global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: containers
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http.yaml
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets:
          - cloudflare:20241

  - job_name: text-embeddings-inference
    metrics_path: /metrics
    static_configs:
      - targets:
          - tei-embedding:8000
          - tei-reranking:8000

  - job_name: gitea
    metrics_path: /metrics
    static_configs:
      - targets:
          - gitea:3000

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
          - dify-qdrant:6333

