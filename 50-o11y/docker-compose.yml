#
# 参考資料:
# - Grafana
#   - https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
# - Prometheus
#   - https://prometheus.io/docs/prometheus/latest/installation/
# - Node Exporter
#   - https://github.com/prometheus/node_exporter
# - cAdvisor
#   - https://github.com/google/cadvisor
# - Blackbox Exporter
#   - https://github.com/prometheus/blackbox_exporter
# - PostgreSQL Exporter
#   - https://github.com/prometheus-community/postgres_exporter
# - Redis Exporter
#   - https://github.com/oliver006/redis_exporter
# - MySQL Server Exporter
#   - https://github.com/prometheus/mysqld_exporter
# - AMD Device Metrics Exporter
#   - https://github.com/ROCm/device-metrics-exporter
# - NVIDIA DCGM Exporter
#   - https://github.com/NVIDIA/dcgm-exporter
#
services:
  grafana:
    image: docker.io/grafana/grafana:13.2.0
    container_name: ${STACK_NAME}-grafana
    restart: unless-stopped
    profiles:
      - o11y
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-grafana-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST}:35000/
      GF_METRICS_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-sk-grafana-oidc-client-secret-key}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://${PUBLIC_HOST}:30001/realms/prod/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://${PUBLIC_HOST}:30001/realms/prod/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://${PUBLIC_HOST}:30001/realms/prod/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'users') && 'Editor' || 'Viewer'"
      DS_PROMETHEUS: http://prometheus:9090
    ports:
      - 35000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal-nw
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - homepage.icon=/icons/grafana.png
      - homepage.group=50-o11y
      - homepage.name=Grafana
      - homepage.href=http://${PUBLIC_HOST}:35000
      - homepage.description=Observability dashboard

  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: ${STACK_NAME}-prometheus
    restart: unless-stopped
    profiles:
      - o11y
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        # Prometheus設定はAPI keyを含めずrepositoryへ置くため、起動時にplaceholderを置換する。
        # 置換後の一時fileだけをPrometheusへ渡し、元templateはread-onlyのまま保つ。
        awk '
        BEGIN {
          litellm_master_key = ENVIRON["LITELLM_MASTER_KEY"]
          qdrant_api_key = ENVIRON["QDRANT_API_KEY"]
          gsub(/\\/, "\\\\", litellm_master_key)
          gsub(/&/, "\\&", litellm_master_key)
          gsub(/\\/, "\\\\", qdrant_api_key)
          gsub(/&/, "\\&", qdrant_api_key)
        }
        {
          gsub(/__LITELLM_MASTER_KEY__/, litellm_master_key)
          gsub(/__QDRANT_API_KEY__/, qdrant_api_key)
          print
        }
        ' /etc/prometheus/prometheus.yaml > /tmp/prometheus.yaml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yaml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.enable-lifecycle \
          --web.enable-otlp-receiver
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-sk-qdrant-api-key}
    ports:
      - 35001:9090
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
    networks:
      - internal-nw
    depends_on:
      node-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
      blackbox-exporter:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "promtool", "check", "config", "/tmp/prometheus.yaml" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - homepage.icon=/icons/prometheus.png
      - homepage.group=50-o11y
      - homepage.name=Prometheus
      - homepage.href=http://${PUBLIC_HOST}:35001
      - homepage.description=Metrics database

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: ${STACK_NAME}-node-exporter
    restart: unless-stopped
    profiles:
      - o11y
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "-T", "3", "http://127.0.0.1:9100/metrics" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - homepage.icon=/icons/prometheus.png
      - homepage.group=50-o11y
      - homepage.name=Node Exporter
      - homepage.description=Host metrics exporter

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: ${STACK_NAME}-cadvisor
    restart: unless-stopped
    profiles:
      - o11y
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD
        - /usr/bin/cadvisor
        - -version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - homepage.group=50-o11y
      - homepage.name=cAdvisor
      - homepage.description=Container metrics exporter
      - homepage.icon=/icons/cadvisor.png

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: ${STACK_NAME}-blackbox-exporter
    restart: unless-stopped
    profiles:
      - o11y
    command:
      - --config.file=/etc/blackbox_exporter/config.yaml
    volumes:
      - ./blackbox/config.yaml:/etc/blackbox_exporter/config.yaml:ro
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "-T", "3", "http://127.0.0.1:9115/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - homepage.icon=/icons/prometheus.png
      - homepage.group=50-o11y
      - homepage.name=Blackbox Exporter
      - homepage.description=Endpoint probe exporter
