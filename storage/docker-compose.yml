services:
  nextcloud:
    image: docker.io/library/nextcloud:34.0.1-apache
    container_name: nextcloud
    restart: unless-stopped
    profiles:
      - storage
    depends_on:
      nextcloud-mariadb:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      MYSQL_DATABASE: ${NEXTCLOUD_MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_MYSQL_PASSWORD:-nextcloud_password}
      MYSQL_HOST: nextcloud-mariadb
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1 ${PUBLIC_HOST:?PUBLIC_HOST must be set} nextcloud}
      NEXTCLOUD_INIT_HTACCESS: "true"
      OVERWRITECLIURL: ${NEXTCLOUD_PUBLIC_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST must be set}:31012}
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT:-1024M}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_PHP_UPLOAD_LIMIT:-2G}
    ports:
      - "${NEXTCLOUD_HOST_PORT:-31012}:80"
    volumes:
      - nextcloud:/var/www/html
      - ./nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./nextcloud/hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
    networks:
      - internalnw

  nextcloud-mariadb:
    image: docker.io/library/mariadb:12.3.2-noble
    container_name: nextcloud-mariadb
    restart: unless-stopped
    profiles:
      - storage
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_MYSQL_ROOT_PASSWORD:-nextcloud_root_password}
      MYSQL_PASSWORD: ${NEXTCLOUD_MYSQL_PASSWORD:-nextcloud_password}
      MYSQL_DATABASE: ${NEXTCLOUD_MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_MYSQL_USER:-nextcloud}
    volumes:
      - nextcloud-mariadb:/var/lib/mysql
    networks:
      - internalnw
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nextcloud-redis:
    image: docker.io/library/redis:8.8.0-trixie
    container_name: nextcloud-redis
    restart: unless-stopped
    profiles:
      - storage
    networks:
      - internalnw

  oikb:
    image: ghcr.io/open-webui/oikb:0.3.6
    container_name: oikb
    restart: unless-stopped
    profiles:
      - storage
    command:
      - daemon
      - --config
      - /app/.oikb.yaml
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_BASE_URL:-http://open-webui:8080}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OIKB_API_KEY: ${OIKB_API_KEY:-}
      LOG_FORMAT: ${OIKB_LOG_FORMAT:-json}
      NEXTCLOUD_URL: ${OIKB_NEXTCLOUD_URL:-http://nextcloud}
      NEXTCLOUD_USER: ${OIKB_NEXTCLOUD_USER:-${NEXTCLOUD_ADMIN_USER:-admin}}
      NEXTCLOUD_PASSWORD: ${OIKB_NEXTCLOUD_PASSWORD:-${NEXTCLOUD_ADMIN_PASSWORD:-admin}}
      NEXTCLOUD_OPENWEBUI_KB_ID: ${NEXTCLOUD_OPENWEBUI_KB_ID:-replace-with-openwebui-kb-id}
      OIKB_NEXTCLOUD_SOURCE: ${OIKB_NEXTCLOUD_SOURCE:-/nextcloud/data/admin/files/Documents}
      OIKB_NEXTCLOUD_INTERVAL: ${OIKB_NEXTCLOUD_INTERVAL:-1h}
    ports:
      - "${OIKB_HOST_PORT:-31013}:8080"
    volumes:
      - ./oikb/oikb.yaml:/app/.oikb.yaml:ro
      - nextcloud:/nextcloud:ro
    networks:
      - internalnw
    depends_on:
      nextcloud:
        condition: service_started

volumes:
  nextcloud:
  nextcloud-mariadb:

networks:
  internalnw:
